<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Yeni Yaşam</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#10151c;--p:#1b222cdd;--p2:#2a3340;--ln:#3a4656;--tx:#eef2f7;--mu:#9aa8b8;--ac:#ff8a4c;--ac2:#4cc9ff;--ok:#5fd19a;--hd:'Bungee',Impact,sans-serif;--ui:'Inter',system-ui,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--tx);font-family:var(--ui);font-size:14px;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
button,input,select{font:inherit;color:inherit}
.b{background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:7px 12px;font-weight:600;cursor:pointer}
.b:hover{border-color:var(--ac)}.b.pri{background:var(--ac);border-color:var(--ac);color:#201006}
.b:focus-visible,input:focus-visible{outline:2px solid var(--ac2);outline-offset:1px}
input[type=text]{background:#0c1015;border:1px solid var(--ln);border-radius:8px;padding:7px 10px;min-width:0}
.pn{background:var(--p);border:1px solid var(--ln);border-radius:12px;backdrop-filter:blur(6px)}
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
#top{position:absolute;left:10px;top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 200px)}
#top .pn{padding:6px 12px;font-weight:700}
#gold b{color:#ffd24a}
#mini{position:absolute;right:10px;top:10px;width:160px;height:160px;border-radius:50%;overflow:hidden;border:2px solid var(--ln);background:#0a2a44}
#mini canvas{width:100%;height:100%;display:block}
#menu{position:absolute;right:10px;top:182px;display:flex;flex-direction:column;gap:6px;width:160px}
#menu .b{text-align:left}
#chat{position:absolute;left:10px;bottom:10px;width:min(430px,calc(100% - 20px));display:flex;flex-direction:column;gap:6px}
#log{max-height:150px;overflow:auto;padding:8px 10px;font-size:13px;line-height:1.4;display:flex;flex-direction:column;gap:2px}
#log .n{color:var(--ac2);font-weight:700}#log .s{color:var(--mu);font-style:italic}#log .me{color:var(--ac);font-weight:700}
#cf{display:flex;gap:6px}#cf input{flex:1}
#tip{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);padding:6px 14px;font-weight:600;text-align:center}
#hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);color:var(--mu);font-size:12px;text-align:center;pointer-events:none}
#emo{position:absolute;right:10px;bottom:10px;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:260px}
#emo .b{padding:6px 9px}
.tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-100%);text-align:center;white-space:nowrap;font-size:12px;font-weight:700;text-shadow:0 1px 3px #000,0 0 2px #000}
.tag .bub{display:block;background:#fffe;color:#111;border-radius:10px;padding:4px 9px;margin-bottom:3px;max-width:200px;white-space:normal;font-weight:500;text-shadow:none;line-height:1.25}
.tag.fr{color:#ffe27a}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000a;z-index:20;padding:10px}
.win{width:min(560px,100%);max-height:92vh;overflow:auto;padding:16px}
.win h2{margin:0 0 10px;font-family:var(--hd);font-weight:400;font-size:22px;color:var(--ac)}
.row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}.row>label{width:84px;color:var(--mu);font-size:12px}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--ac)}
.opt{padding:5px 10px}.opt.on{background:var(--ac);color:#201006;border-color:var(--ac)}
#cr{display:flex;gap:14px;flex-wrap:wrap}#crL{flex:1;min-width:230px}
#prev{width:200px;height:300px;border-radius:12px;background:linear-gradient(#34506c,#162231);flex:none;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:8px 0}
.it{background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:8px;text-align:center;cursor:pointer}
.it:hover{border-color:var(--ac)}.it .ic{font-size:26px}.it small{display:block;color:var(--mu)}
.it.own{opacity:.6}
.card{display:flex;flex-direction:column;gap:6px}
.bar{height:8px;background:#0c1015;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),#ffd24a)}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:var(--p2);border:1px solid var(--ac);border-radius:9px;padding:8px 14px;z-index:60;font-weight:600}
#joy{position:absolute;left:18px;bottom:190px;width:110px;height:110px;border-radius:50%;background:#fff2;border:2px solid #fff4;display:none;touch-action:none}
#joy i{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#fffa}
@media(pointer:coarse){#joy{display:block}#hint{display:none}}
@media(max-width:620px){#mini{width:100px;height:100px}#menu{top:120px;width:120px}#top{max-width:calc(100% - 130px)}#emo{bottom:60px}#chat{bottom:6px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="tags" id="tags"></div>
<div id="hud" hidden>
 <div id="top"><div class="pn" id="gold">🪙 <b id="goldN">0</b></div><div class="pn" id="clock">☀ 12:00</div><div class="pn" id="zone">Meydan</div></div>
 <div id="hint">WASD/ok tuşları: yürü · Shift: koş · Boşluk: zıpla · F: uç · fare sürükle: kamera · E: etkileşim · Enter: yaz</div>
 <div id="mini"><canvas id="mc" width="160" height="160"></canvas></div>
 <div id="menu">
  <button class="b" data-m="tp">🧭 Işınlan</button>
  <button class="b" data-m="fr">👥 Arkadaşlar</button>
  <button class="b" data-m="shop">🛍 Mağaza</button>
  <button class="b" data-m="build">🏠 Ev / Yapı</button>
  <button class="b" data-m="look">👕 Görünüm</button>
  <button class="b" data-m="snd" id="sndB">🔊 Ses: açık</button>
 </div>
 <div id="tip" class="pn" hidden></div>
 <div id="emo"></div>
 <div id="chat"><div id="log" class="pn"></div><form id="cf"><input type="text" id="ci" maxlength="140" placeholder="Yakındakilerle konuş… (Enter)" autocomplete="off"><button class="b pri">Gönder</button></form></div>
 <div id="joy"><i></i></div>
</div>
<div id="cre" class="ov" hidden><div class="win pn"><h2>Yeni Yaşam</h2><div id="cr"><div id="crL"></div><canvas id="prev" width="400" height="600"></canvas></div><div class="row" style="justify-content:flex-end"><button class="b pri" id="crOk">Dünyaya gir →</button></div></div></div>
<div id="dlg" class="ov" hidden></div>
<div id="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.random()*a.length|0];
const KEY='yeni_yasam_save_v1';
const SKIN=['#fbe0c8','#f1c9a0','#d9a273','#a8744a','#7a4b2c','#4a2e1b'];
const HAIRC=['#1b1410','#4a2a14','#8a5a2b','#d9b05a','#c8402f','#e8e8ee','#3b6fd9','#c85ad9'];
const CLOTH=['#e84c4c','#ff8a4c','#f4c430','#4cc96a','#3aa8ff','#7a5cff','#e86ac0','#f2f2f2','#2b2f38'];
const PANTS=['#2b3a55','#1b1b1f','#6a4b2d','#555b66','#e8e0cc','#7a2b3a'];
const DEF={name:'',skin:1,hair:1,hairC:1,top:0,topC:4,pants:0,shoes:1,height:1,acc:0};
let S={look:Object.assign({},DEF),gold:150,friends:{},own:[],plots:{},t:9.5,snd:true,seen:false};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.look){S=Object.assign(S,s);S.look=Object.assign({},DEF,s.look)}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S,(k,v)=>k==='_g'?undefined:v))}catch(e){}}
let tt=0;function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}

/* ---------- three ---------- */
const cvs=$('gl');
const R=new THREE.WebGLRenderer({canvas:cvs,antialias:true,preserveDrawingBuffer:true});
R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(60,1,.1,400);
const hemi=new THREE.HemisphereLight(0xbfe0ff,0x4a5a3a,.7);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,.9);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
const sc=sun.shadow.camera;sc.left=-40;sc.right=40;sc.top=40;sc.bottom=-40;sc.near=1;sc.far=200;scene.add(sun,sun.target);
scene.fog=new THREE.Fog(0x9ad0ff,60,210);
const M={};const mat=(c,o)=>{const k=c+(o?JSON.stringify(o):'');return M[k]||(M[k]=new THREE.MeshLambertMaterial(Object.assign({color:c},o||{})))};
function mesh(g,m,x=0,y=0,z=0,sh=true){const o=new THREE.Mesh(g,typeof m==='string'?mat(m):m);o.position.set(x,y,z);if(sh){o.castShadow=true;o.receiveShadow=true}return o}
const BOX=new THREE.BoxGeometry(1,1,1),CYL=new THREE.CylinderGeometry(1,1,1,16),SPH=new THREE.SphereGeometry(1,16,12);
function box(w,h,d,c,x,y,z,p){const m=mesh(BOX,c,x,y,z);m.scale.set(w,h,d);(p||scene).add(m);return m}
function cyl(r,h,c,x,y,z,p,seg){const m=mesh(CYL,c,x,y,z);m.scale.set(r,h,r);(p||scene).add(m);return m}
function sph(r,c,x,y,z,p){const m=mesh(SPH,c,x,y,z);m.scale.set(r,r,r);(p||scene).add(m);return m}
function fit(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',fit);fit();

/* ---------- dünya ---------- */
const COL=[];           // {x,z,hx,hz}
const ZONES=[{n:'Meydan',x:0,z:0,r:20},{n:'Kafe',x:-30,z:-12,r:14},{n:'Kulüp',x:32,z:-14,r:15},{n:'Mağaza',x:0,z:-38,r:12},{n:'Konut Alanı',x:0,z:34,r:32},{n:'Plaj',x:0,z:72,r:26}];
const POI={meydan:[0,8],kafe:[-30,-3],kulup:[32,-2],plaj:[0,70],magaza:[0,-27]};
const PLOTS=[{x:-22,z:34},{x:0,z:34},{x:22,z:34}],PS=16;
function addCol(x,z,w,d){COL.push({x,z,hx:w/2,hz:d/2})}
const ground=mesh(new THREE.CircleGeometry(95,48),'#6bb35a',0,0,0);ground.rotation.x=-Math.PI/2;ground.castShadow=false;scene.add(ground);
const sand=mesh(new THREE.RingGeometry(66,95,48),'#ecd9a0',0,.02,0);sand.rotation.x=-Math.PI/2;sand.castShadow=false;scene.add(sand);
const sea=mesh(new THREE.PlaneGeometry(900,900),new THREE.MeshLambertMaterial({color:0x1f86c8,transparent:true,opacity:.92}),0,-.35,0,false);sea.rotation.x=-Math.PI/2;scene.add(sea);
// meydan
const plaza=mesh(new THREE.CylinderGeometry(15,15,.15,40),'#c8c2b4',0,.08,0);plaza.receiveShadow=true;plaza.castShadow=false;scene.add(plaza);
for(const a of[[0,-1,5,'#c8c2b4'],[0,1,5,'#c8c2b4']]){}
function path(x1,z1,x2,z2,w){const dx=x2-x1,dz=z2-z1,L=Math.hypot(dx,dz);const m=mesh(BOX,'#b9b2a2',(x1+x2)/2,.05,(z1+z2)/2);m.scale.set(w,.08,L);m.rotation.y=Math.atan2(dx,dz);m.castShadow=false;scene.add(m)}
path(0,0,-30,-6,5);path(0,0,32,-8,5);path(0,0,0,-34,5);path(0,0,0,30,6);path(0,40,0,68,5);
// çeşme
cyl(4,.7,'#9aa3ad',0,.4,0);cyl(3.4,.3,'#4cb0e8',0,.7,0);cyl(.6,3,'#9aa3ad',0,2,0);sph(1,'#bfe6ff',0,3.6,0);addCol(0,0,8,8);
const fountainSpray=[];for(let i=0;i<14;i++){const s=sph(.12,'#e8f6ff',0,3,0);fountainSpray.push({m:s,p:Math.random()*6.28,r:Math.random()*2.2+.5})}
// bank
const BENCH=[];
function bench(x,z,ry){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=ry;scene.add(g);box(2,.15,.7,'#8a5a2b',0,.5,0,g);box(2,.5,.1,'#8a5a2b',0,.85,-.3,g);box(.1,.5,.6,'#444',-.9,.25,0,g);box(.1,.5,.6,'#444',.9,.25,0,g);BENCH.push({x,z,ry,seat:null})}
bench(-9,0,Math.PI/2);bench(9,0,-Math.PI/2);bench(0,-9,0);bench(-8,10,Math.PI*.8);
function lamp(x,z){cyl(.12,5,'#333',x,2.5,z);const b=sph(.45,'#ffe9a8',x,5.2,z);b.material=new THREE.MeshBasicMaterial({color:0xffe9a8});b.castShadow=false;LAMPS.push(b)}
const LAMPS=[];[[-12,-8],[12,-8],[-12,8],[12,8],[0,-20],[0,20],[-18,-6],[22,-8],[0,50],[0,62]].forEach(p=>lamp(...p));
// tarif: bina
function building(x,z,w,d,h,wall,roof,label,rot){
  const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
  box(w,h,d,wall,0,h/2,0,g);box(w+1,.5,d+1,roof,0,h+.25,0,g);
  const door=box(2.4,3.2,.2,'#4a2f1b',0,1.6,d/2+.05,g);
  for(let i=-1;i<=1;i+=2)box(2,1.6,.15,'#9ad8ff',i*(w/3),h*.55,d/2+.05,g);
  addCol(x,z,w,d);
  const c=document.createElement('canvas');c.width=256;c.height=64;const q=c.getContext('2d');q.fillStyle='#222';q.fillRect(0,0,256,64);q.fillStyle='#ffd24a';q.font='bold 34px sans-serif';q.textAlign='center';q.textBaseline='middle';q.fillText(label,128,34);
  const sg=new THREE.Mesh(new THREE.PlaneGeometry(6,1.5),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c)}));sg.position.set(0,h-.2,d/2+.12);g.add(sg);
  return g;
}
building(-30,-20,14,9,6,'#e8b98a','#8a3b2a','KAFE');
building(32,-24,18,10,7,'#5a4a8a','#2b2140','KULÜP');
building(0,-46,16,9,6,'#8ac0e8','#2b4a6a','MAĞAZA');
// kafe masaları
for(const p of[[-36,-10],[-30,-8],[-24,-10]]){cyl(.9,.1,'#f2f2f2',p[0],1,p[1]);cyl(.1,1,'#555',p[0],.5,p[1]);BENCH.push({x:p[0]+1.4,z:p[1],ry:-Math.PI/2,seat:null});box(.7,.5,.7,'#c85a3a',p[0]+1.4,.3,p[1])}
// kulüp pisti
const floorTex=(()=>{const c=document.createElement('canvas');c.width=c.height=8;const q=c.getContext('2d');const cs=['#ff3a8a','#3ad0ff','#ffd24a','#7a5cff'];for(let i=0;i<4;i++){q.fillStyle=cs[i];q.fillRect((i%2)*4,(i>>1)*4,4,4)}const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(5,5);return t})();
const dfl=new THREE.Mesh(new THREE.PlaneGeometry(14,12),new THREE.MeshBasicMaterial({map:floorTex}));dfl.rotation.x=-Math.PI/2;dfl.position.set(32,.06,-6);scene.add(dfl);
const disco=sph(.7,'#ffffff',32,7,-6);disco.material=new THREE.MeshBasicMaterial({color:0xffffff});scene.add(disco);
box(4,.4,2,'#222',32,.2,-12.5);box(2.5,1.2,1,'#111',32,1,-12.5);
// plaj
for(let i=0;i<6;i++){const x=-18+i*7,z=76+(i%2)*3;cyl(.08,2.6,'#a07a4a',x,1.3,z);const u=mesh(new THREE.ConeGeometry(2.2,.9,10),['#e84c4c','#f4c430','#3aa8ff'][i%3],x,2.8,z);scene.add(u);box(1.8,.12,.9,'#f2e8d8',x,.12,z+1.7)}
// ağaçlar
function tree(x,z,s=1){const t=cyl(.3*s,3*s,'#6a4b2d',x,1.5*s,z);sph(2*s,'#3f9a46',x,4.2*s,z);sph(1.4*s,'#4fb257',x+.8*s,5.2*s,z+.3*s);addCol(x,z,.8*s,.8*s)}
const trng=(()=>{let s=7;return()=>(s=(s*16807)%2147483647)/2147483647})();
for(let i=0;i<110;i++){const a=trng()*6.28,r=22+trng()*44,x=Math.cos(a)*r,z=Math.sin(a)*r;if(z>24&&z<56&&Math.abs(x)<40)continue;if(z>62)continue;if(Math.abs(x)<5&&z>-50&&z<46)continue;if(Math.hypot(x+30,z+14)<16||Math.hypot(x-32,z+14)<18||Math.hypot(x,z+40)<12)continue;tree(x,z,.8+trng()*.7)}
// konut parselleri
PLOTS.forEach((p,i)=>{const g=mesh(BOX,'#8fcf7a',p.x,.06,p.z,false);g.scale.set(PS,.1,PS);g.receiveShadow=true;scene.add(g);p.fence=[];
  const col=owned(i)?'#4cc96a':'#ff8a4c';p.sign=box(.2,2,.2,'#6a4b2d',p.x-PS/2+.2,1,p.z-PS/2+.2);p.board=box(2.4,1.1,.2,col,p.x-PS/2+.2,2.2,p.z-PS/2+.2)});
function owned(i){return !!(S.plots[i]&&S.plots[i].owned)}
// bulutlar
const clouds=[];for(let i=0;i<9;i++){const g=new THREE.Group();for(let j=0;j<4;j++){const s=sph(rnd(3,6),'#ffffff',j*4-6,rnd(-.5,.5),rnd(-2,2),g);s.material=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.85});s.castShadow=false;s.scale.y*=.5}g.position.set(rnd(-150,150),rnd(40,60),rnd(-150,150));scene.add(g);clouds.push(g)}

/* ---------- avatar ---------- */
function makeAvatar(L){
  const root=new THREE.Group(),body=new THREE.Group();root.add(body);
  const skin=SKIN[L.skin%SKIN.length],hc=HAIRC[L.hairC%HAIRC.length],tc=CLOTH[L.topC%CLOTH.length],pc=PANTS[L.pants%PANTS.length];
  const P={};
  // bacaklar
  const mkLeg=x=>{const g=new THREE.Group();g.position.set(x,.95,0);const short=L.top===2||L.pants===1;
    box(.3,.95,.32,short?skin:pc,0,-.48,0,g);if(short&&L.top!==2){box(.31,.5,.33,pc,0,-.25,0,g)}
    box(.34,.18,.46,CLOTH[(L.shoes+3)%CLOTH.length===8?0:(L.shoes*2)%CLOTH.length],0,-.92,.06,g);body.add(g);return g};
  P.lL=mkLeg(-.17);P.lR=mkLeg(.17);
  // gövde
  const tors=box(.78,.9,.4,tc,0,1.4,0,body);P.tors=tors;
  if(L.top===2){const sk=mesh(new THREE.CylinderGeometry(.42,.72,.7,16),tc,0,.98,0);body.add(sk)}
  // kollar
  const mkArm=x=>{const g=new THREE.Group();g.position.set(x,1.78,0);const long=L.top===1;
    box(.24,long?.8:.35,.26,long?tc:tc,0,long?-.4:-.17,0,g);if(!long)box(.22,.5,.24,skin,0,-.6,0,g);
    box(.24,.2,.26,skin,0,-.88,0,g);body.add(g);return g};
  P.aL=mkArm(-.52);P.aR=mkArm(.52);
  // kafa
  const head=new THREE.Group();head.position.set(0,2.1,0);body.add(head);P.head=head;
  box(.52,.55,.5,skin,0,.28,0,head);
  box(.07,.07,.02,'#222',-.12,.32,.26,head);box(.07,.07,.02,'#222',.12,.32,.26,head);
  box(.14,.03,.02,'#b0504a',0,.12,.26,head);
  // saç
  const H=L.hair%5;
  if(H===1){box(.58,.2,.56,hc,0,.58,0,head);box(.58,.3,.1,hc,0,.42,-.24,head)}
  if(H===2){box(.58,.2,.56,hc,0,.58,0,head);box(.6,.8,.12,hc,0,.2,-.26,head);box(.1,.6,.4,hc,-.3,.25,-.05,head);box(.1,.6,.4,hc,.3,.25,-.05,head)}
  if(H===3){box(.58,.2,.56,hc,0,.58,0,head);sph(.2,hc,0,.7,-.3,head);box(.58,.3,.1,hc,0,.42,-.24,head)}
  if(H===4){box(.6,.28,.6,hc,0,.62,0,head);box(.62,.08,.1,hc,0,.52,.3,head);box(.1,.35,.4,hc,-.3,.42,0,head);box(.1,.35,.4,hc,.3,.42,0,head)}
  // aksesuar
  const A=L.acc%4;

  if(A===2){cyl(.4,.06,'#d84a3a',0,.62,0,head).scale.set(.4,.06,.4);cyl(.27,.3,'#d84a3a',0,.75,0,head)}
  if(A===3){const c=cyl(.3,.15,'#ffd24a',0,.72,0,head);c.scale.set(.3,.15,.3);for(let i=0;i<5;i++){const a=i/5*6.28;box(.07,.15,.07,'#ffd24a',Math.cos(a)*.3,.88,Math.sin(a)*.3,head)}}
  root.scale.setScalar(.88+.12*[0,1,2,3][clamp(L.height|0,0,3)]+((L.height|0)===3?.04:0));
  return {g:root,body,P,ph:0,state:'idle',t:0,sit:false,fly:false,ems:0};
}
function setLimb(g,x,z=0){g.rotation.x=x;g.rotation.z=z}
function animAv(av,dt,spd,st){
  const P=av.P;av.t+=dt;const t=av.t;
  if(st!==av.state){av.state=st;av.t=0}
  const lerpR=(g,x,z,k=.3)=>{g.rotation.x+=(x-g.rotation.x)*k;g.rotation.z+=(z-g.rotation.z)*k};
  av.body.rotation.x*=.85;av.body.position.y+=(0-av.body.position.y)*.3;
  if(st==='walk'||st==='run'){
    av.ph+=dt*(st==='run'?11:7.5);const s=Math.sin(av.ph),k=st==='run'?.95:.65;
    lerpR(P.lL,s*k,0);lerpR(P.lR,-s*k,0);lerpR(P.aL,-s*k*.9,0);lerpR(P.aR,s*k*.9,0);
    av.body.position.y=Math.abs(Math.cos(av.ph))*.05;if(st==='run')av.body.rotation.x=.18;
  }else if(st==='fly'){
    av.body.rotation.x=.9;lerpR(P.lL,.2+Math.sin(t*5)*.1,0);lerpR(P.lR,.1,0);lerpR(P.aL,2.6,.2);lerpR(P.aR,2.6,-.2);
  }else if(st==='sit'){
    lerpR(P.lL,-1.5,0);lerpR(P.lR,-1.5,0);lerpR(P.aL,-.5,0);lerpR(P.aR,-.5,0);
  }else if(st==='dance'){
    const s=Math.sin(t*8),c=Math.cos(t*8);lerpR(P.aL,-2.4+s*.7,.3);lerpR(P.aR,-2.4-s*.7,-.3);lerpR(P.lL,s*.5,0);lerpR(P.lR,-s*.5,0);
    av.body.position.y=Math.abs(s)*.12;av.body.rotation.z=c*.12;av.body.rotation.y=Math.sin(t*4)*.4;
  }else if(st==='wave'){
    lerpR(P.aR,-2.9,Math.sin(t*10)*.5);lerpR(P.aL,0,0);lerpR(P.lL,0,0);lerpR(P.lR,0,0);
  }else if(st==='clap'){
    const s=Math.sin(t*14)*.3;lerpR(P.aL,-1.3,.5+s);lerpR(P.aR,-1.3,-.5-s);lerpR(P.lL,0,0);lerpR(P.lR,0,0);
  }else if(st==='laugh'){
    av.body.rotation.x=Math.sin(t*16)*.12-.1;lerpR(P.aL,-.4,.2);lerpR(P.aR,-.4,-.2);lerpR(P.lL,0,0);lerpR(P.lR,0,0);
  }else if(st==='jump'){
    lerpR(P.aL,-2.6,.4);lerpR(P.aR,-2.6,-.4);lerpR(P.lL,.4,0);lerpR(P.lR,-.2,0);
  }else{
    const b=Math.sin(t*1.8)*.03;lerpR(P.aL,b,.05);lerpR(P.aR,-b,-.05);lerpR(P.lL,0,0);lerpR(P.lR,0,0);av.body.rotation.z*=.8;av.body.rotation.y*=.8;
  }
  if(st!=='dance'){av.body.rotation.z*=.85;av.body.rotation.y*=.85}
}

const ME={x:0,y:0,z:14,vy:0,yaw:Math.PI,fly:false,sit:null,emo:null,emoT:0,av:null,ground:true};

function buildMe(){if(ME.av)scene.remove(ME.av.g);ME.av=makeAvatar(S.look);scene.add(ME.av.g)}
function bounce(x,z,r=.45){
  for(const c of COL){const dx=x-c.x,dz=z-c.z;const px=c.hx+r-Math.abs(dx),pz=c.hz+r-Math.abs(dz);
    if(px>0&&pz>0){if(px<pz)x+=dx>0?px:-px;else z+=dz>0?pz:-pz}}
  const d=Math.hypot(x,z);if(d>88){x*=88/d;z*=88/d}
  return [x,z];
}
function stepMe(dt){
  let ix=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x;
  let iz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.y;
  const mag=Math.hypot(ix,iz);if(mag>1){ix/=mag;iz/=mag}
  const moving=mag>.1;
  if(ME.sit&&moving){ME.sit=null;ME.av.g.position.y=0}
  if(ME.emo&&moving){ME.emo=null}
  if(ME.emo){ME.emoT-=dt;if(ME.emoT<=0)ME.emo=null}
  let st='idle';
  if(ME.sit){st='sit';ME.x=ME.sit.x;ME.z=ME.sit.z;ME.yaw=ME.sit.yaw;ME.av.g.position.y=-.42}
  else{
    const run=keys.shift;const sp=ME.fly?(run?26:14):(run?9:4.6);
    if(moving){
      const a=camYaw;const dx=ix*Math.cos(a)+iz*Math.sin(a),dz=-ix*Math.sin(a)+iz*Math.cos(a);
      let nx=ME.x+dx*sp*dt,nz=ME.z+dz*sp*dt;
      if(!ME.fly||ME.y<6){[nx,nz]=bounce(nx,nz)}else{const d=Math.hypot(nx,nz);if(d>92){nx*=92/d;nz*=92/d}}
      ME.x=nx;ME.z=nz;const ty=Math.atan2(dx,dz);let d=ty-ME.yaw;d=Math.atan2(Math.sin(d),Math.cos(d));ME.yaw+=d*Math.min(1,dt*12);
      st=ME.fly?'fly':(run?'run':'walk');
    }
    if(ME.fly){
      const up=(keys[' ']?1:0)-(keys.c?1:0);ME.y=clamp(ME.y+up*9*dt,0,60);ME.vy=0;
      if(!moving&&ME.y>.3)st='fly';if(ME.y<=0&&!up&&!moving){ME.fly=false}
    }else{
      ME.vy-=24*dt;ME.y+=ME.vy*dt;if(ME.y<=0){ME.y=0;ME.vy=0;ME.ground=true}else ME.ground=false;
      if(keys[' ']&&ME.ground){ME.vy=8;ME.ground=false}
      if(!ME.ground)st=moving?(st):'jump';
    }
    if(ME.emo&&!moving)st=ME.emo;
    ME.av.g.position.y=ME.y+(ME.sit?-.42:0);
  }
  ME.av.g.position.x=ME.x;ME.av.g.position.z=ME.z;ME.av.g.rotation.y=ME.yaw;
  if(ME.sit)ME.av.g.position.y=-.42;
  animAv(ME.av,dt,0,st);
  ME.state=st;
}

  if(k==='enter'){e.preventDefault();$('ci').focus();return}

  const BASS=[55,55,82,55,73,73,98,73],ARP=[220,277,330,277,247,311,370,311];
  if(b%4===0)tone(60,t,.2,'sine',.9,mus);if(b%2===0)tone(BASS[(b/2|0)%8],t,.14,'sawtooth',.25,mus);tone(ARP[b%8]*(b>7?2:1),t,.1,'square',.07,mus);if(b%4===2)tone(8000,t,.04,'square',.04,mus)}
function sfxCoin(){if(!AC||!S.snd)return;const t=AC.currentTime;tone(988,t,.08,'square',.12);tone(1319,t+.07,.16,'square',.12)}
$('sndB').onclick=()=>{S.snd=!S.snd;$('sndB').textContent='🔊 Ses: '+(S.snd?'açık':'kapalı');if(S.snd)audioInit();save()};
/* ---------- gün döngüsü ---------- */
const SKYK=[[0,[8,12,32]],[5,[20,24,60]],[6.5,[255,150,100]],[9,[140,205,255]],[17,[140,205,255]],[19,[255,120,70]],[20.5,[20,24,60]],[24,[8,12,32]]];
function skyAt(t){for(let i=0;i<SKYK.length-1;i++){const a=SKYK[i],b=SKYK[i+1];if(t>=a[0]&&t<=b[0]){const k=(t-a[0])/(b[0]-a[0]);return a[1].map((v,j)=>v+(b[1][j]-v)*k)}}return SKYK[0][1]}
function lighting(){
  const t=S.t,c=skyAt(t),col=new THREE.Color(`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`);
  scene.background=col;scene.fog.color.copy(col);
  const day=clamp(Math.sin((t-6)/12*Math.PI),0,1),a=(t-6)/12*Math.PI;
  sun.position.set(Math.cos(a)*80,Math.max(8,Math.sin(a)*80),30).add(new THREE.Vector3(ME.x,0,ME.z));sun.target.position.set(ME.x,0,ME.z);
  sun.intensity=.12+day*.85;sun.color.setHSL(.1,.4+(1-day)*.4,.7+day*.25);hemi.intensity=.22+day*.55;
  const night=day<.15;LAMPS.forEach(l=>l.visible=night||day<.3);
  disco.rotation.y+=.05;disco.material.color.setHSL((performance.now()/1500)%1,.9,.6);
  $('clock').textContent=(day>.2?'☀ ':'🌙 ')+String(t|0).padStart(2,'0')+':'+String((t%1)*60|0).padStart(2,'0');
}
/* ---------- minimap ---------- */
const mc=$('mc').getContext('2d');
function mini(){
  const W=160,sc=1.15;mc.clearRect(0,0,W,W);mc.save();mc.translate(W/2,W/2);mc.scale(sc,sc);mc.translate(-ME.x*.5*0-ME.x*.0,0);
  const px=x=>(x-ME.x)*.8,pz=z=>(z-ME.z)*.8;
  mc.fillStyle='#1f6aa8';mc.fillRect(-100,-100,200,200);
  mc.fillStyle='#e6d49a';mc.beginPath();mc.arc(px(0),pz(0),95*.8,0,7);mc.fill();mc.fillStyle='#6bb35a';mc.beginPath();mc.arc(px(0),pz(0),66*.8,0,7);mc.fill();
  mc.fillStyle='#c8c2b4';mc.beginPath();mc.arc(px(0),pz(0),15*.8,0,7);mc.fill();
  mc.fillStyle='#6b5a4a';[[-30,-20,14,9],[32,-24,18,10],[0,-46,16,9]].forEach(b=>mc.fillRect(px(b[0])-b[2]*.4,pz(b[1])-b[3]*.4,b[2]*.8,b[3]*.8));
  PLOTS.forEach((p,i)=>{mc.fillStyle=owned(i)?'#4cc96a':'#9ad88a';mc.fillRect(px(p.x)-PS*.4,pz(p.z)-PS*.4,PS*.8,PS*.8)});
  COINS.forEach(c=>{mc.fillStyle='#ffd24a';mc.fillRect(px(c.x)-1,pz(c.z)-1,2,2)});
  NPCS.forEach(n=>{mc.fillStyle=lvl(n.d.id)>=1?'#ffe27a':'#fff';mc.beginPath();mc.arc(px(n.x),pz(n.z),2.2,0,7);mc.fill()});
  mc.fillStyle='#ff4a4a';mc.beginPath();mc.arc(0,0,3.2,0,7);mc.fill();mc.strokeStyle='#fff';mc.stroke();
  mc.restore();
}
/* ---------- etiketler ---------- */
const tv=new THREE.Vector3();
function placeTag(tag,x,y,z,show){
  tv.set(x,y,z).project(cam);
  const ok=show&&tv.z<1&&Math.abs(tv.x)<1.1&&Math.abs(tv.y)<1.1;
  tag.style.display=ok?'':'none';if(ok){tag.style.left=((tv.x+1)/2*innerWidth)+'px';tag.style.top=((1-tv.y)/2*innerHeight)+'px'}
}
function tags(dt){
  const meB=meTagS;meB.bub-=dt;if(meB.bub<=0){const b=meTag.querySelector('.bub');b.hidden=true}
  placeTag(meTag,ME.x,ME.y+2.7*ME.av.g.scale.y+.2+(ME.sit?-.4:0),ME.z,true);
  NPCS.forEach(n=>{const d=Math.hypot(n.x-ME.x,n.z-ME.z);n.tag.classList.toggle('fr',lvl(n.d.id)>=1);placeTag(n.tag,n.x,2.8*n.av.g.scale.y+.2+(n.st==='sit'?-.4:0),n.z,d<45)});
}
/* ---------- ana döngü ---------- */
let last=performance.now(),fr=0,cT=0,hintT=0,danceAcc=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!started){camYaw+=dt*.1;cam.position.set(Math.sin(camYaw)*38,16,Math.cos(camYaw)*38);cam.lookAt(0,2,0);lighting();R.render(scene,cam);return}
  S.t=(S.t+dt/30)%24;
  stepMe(dt);NPCS.forEach(n=>npcStep(n,dt));
  updCam(dt);lighting();
  fountainSpray.forEach(f=>{f.p+=dt*3;const k=(f.p%3)/3;f.m.position.set(Math.cos(f.r*9)*f.r*k*.9,3+Math.sin(k*Math.PI)*1.4-k*.6,Math.sin(f.r*9)*f.r*k*.9)});
  clouds.forEach(c=>{c.position.x+=dt*1.5;if(c.position.x>170)c.position.x=-170});
  COINS.forEach(c=>{c.m.rotation.z+=dt*3;if(ME.y<3&&Math.hypot(c.x-ME.x,c.z-ME.z)<1.3){earn(5);sfxCoin();newCoin(c)}});
  if(ME.state==='dance'&&inZone('Kulüp')){danceAcc+=dt;if(danceAcc>2){danceAcc=0;earn(3)}}
  // ses: kulüp yakınında müzik
  if(mus&&AC){const d=Math.hypot(ME.x-32,ME.z+14);mus.gain.value=S.snd?clamp(1-(d-8)/26,0,1)*.5:0;if(AC.state==='suspended')AC.resume()}
  // bölge
  if(++fr%10===0){const z=ZONES.map(z=>({n:z.n,d:Math.hypot(ME.x-z.x,ME.z-z.z)/z.r})).sort((a,b)=>a.d-b.d)[0];$('zone').textContent=z.d<1.2?z.n:'Açık alan'}
  if(fr%3===0)mini();
  tags(dt);
  target=findTarget();const tp=$('tip');if(target&&$('dlg').hidden){tp.hidden=false;tp.textContent=target.txt}else tp.hidden=true;
  if(fr%120===0)save();
  R.render(scene,cam);
}
$('hud').querySelector('#menu').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;const m=b.dataset.m;
  if(m==='tp')openTp();else if(m==='fr')openFriends();else if(m==='shop')openShop();else if(m==='build')openBuild();else if(m==='look')openCreator(false);};
function startWorld(){
  started=true;$('hud').hidden=false;buildMe();initPlots();meTag.querySelector('.nm').textContent=S.look.name;
  $('goldN').textContent=S.gold;$('sndB').textContent='🔊 Ses: '+(S.snd?'açık':'kapalı');
  S.seen=true;save();audioInit();
  logLine('<span class="s">Yeni Yaşam’a hoş geldin! Yakındaki yerleşiklere yaz, altın topla, parsel al.</span>');
  const b=$('hud');
}
window.__yy={get S(){return S},ME,NPCS,COINS,PLOTS,keys,scene,cam,R,meSay,interact,openNpc,openShop,openBuild,openTp,openFriends,openCreator,tpTo,reply,startWorld,get started(){return started},lvl,FURN,toggleFly,doEmote,get camYaw(){return camYaw},set camYaw(v){camYaw=v},mini};
requestAnimationFrame(frame);
if(S.seen&&S.look.name){started=false;$('cre').hidden=true;openCreator(true);$('crOk').textContent='Dünyaya gir →'}else openCreator(true);
})();
</script>
