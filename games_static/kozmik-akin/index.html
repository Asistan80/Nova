function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const defSave=()=>({vol:{m:.8,mu:.7,fx:1},shake:true,lbest:{},credits:0,ship:0,owned:[1,0,0,0,0,0,0],up:{dmg:0,rate:0,hp:0,mag:0,bomb:0,drone:0,start:0,cred:0},stars:{},maxLevel:1,best:0,endless:0,sound:true,kills:0,runs:0});
function loadSave(){try{const s=JSON.parse(localStorage.getItem(SK));const d=defSave();if(s){Object.assign(d,s);d.up=Object.assign(defSave().up,s.up||{});d.vol=Object.assign({m:.8,mu:.7,fx:1},s.vol||{});while(d.owned.length<7)d.owned.push(0);d.lbest=d.lbest||{}}return d}catch(e){return defSave()}}

{n:'Kalkan',cost:4500,spd:380,hp:8,rate:.17,dmg:1.05,col:'#4ccf66',acc:'#c9ffd2',desc:'Dayanıklı gövde, geniş yelpaze.',kind:'wide',step:8.5,gap:10,pierce:0},
{n:'Hançer',cost:9000,spd:450,hp:5,rate:.19,dmg:1.35,col:'#f2557f',acc:'#ffc2d4',desc:'Zırh delen mermiler; sıradakileri keser.',kind:'pierce',step:3,gap:8,pierce:2},
{n:'Titan',cost:16000,spd:400,hp:7,rate:.18,dmg:1.2,col:'#a66bff',acc:'#e0ccff',desc:'Güdümlü füzeler ve ağır gövde.',kind:'homing',step:5,gap:10,pierce:0},
{n:'Hayalet',cost:26000,spd:560,hp:4,rate:.13,dmg:.9,col:'#5af2d0',acc:'#d2fff5',desc:'Çok hızlı; mermileri 3 düşmanı delip geçer.',kind:'rapid',step:3.2,gap:8,pierce:3},
{n:'Süpernova',cost:42000,spd:420,hp:9,rate:.2,dmg:1.7,col:'#ff9a3c',acc:'#ffe0b8',desc:'Ağır hasar, güdümlü ve delici mermiler.',kind:'homing',step:6,gap:11,pierce:1}];

const ETYPE={
scout:{hp:2,r:16,sc:10,col:'#7fe3ff'},zig:{hp:3,r:17,sc:15,col:'#8dffb0'},gun:{hp:6,r:20,sc:30,col:'#ffa94d'},

mine:{hp:10,r:20,sc:40,col:'#ffd94d'},ace:{hp:7,r:19,sc:50,col:'#5af2d0'},wing:{hp:6,r:18,sc:35,col:'#a0ff6a'},sniper:{hp:9,r:20,sc:55,col:'#ff4a4a'}};
// ---------------------------------------------------------------- ses
let AC=null,musicOn=false,mTick=0,mGain=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
let ISMUS=false;const vol=()=>SAVE.vol.m*(ISMUS?SAVE.vol.mu:SAVE.vol.fx);
function tone(f,d,type,v,slide){if(!SAVE.sound)return;const vv=(v||.05)*vol();if(vv<.0003)return;const a=ac();if(!a)return;try{const t=a.currentTime,o=a.createOscillator(),gn=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);gn.gain.setValueAtTime(vv,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(a.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d,v,fc){if(!SAVE.sound||vol()<.01)return;const a=ac();if(!a)return;try{const t=a.currentTime,n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),gn=a.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=fc||1200;gn.gain.value=(v||.1)*vol();s.connect(f);f.connect(gn);gn.connect(a.destination);s.start(t)}catch(e){}}
const SFX={shoot:()=>tone(880,.05,'square',.012,.5),hit:()=>tone(300,.05,'triangle',.03,.6),boom:()=>{noise(.35,.12,900);tone(110,.3,'sawtooth',.05,.4)},big:()=>{noise(.9,.2,600);tone(70,.8,'sawtooth',.1,.3)},
pick:()=>{tone(660,.08,'triangle',.06);setTimeout(()=>tone(990,.1,'triangle',.06),60)},pow:()=>{[440,554,659,880].forEach((f,i)=>setTimeout(()=>tone(f,.12,'square',.05),i*60))},
hurt:()=>{noise(.3,.18,500);tone(150,.3,'sawtooth',.08,.4)},bomb:()=>{noise(1.2,.25,400);tone(60,1,'sawtooth',.12,.3)},warn:()=>{for(let i=0;i<4;i++)setTimeout(()=>tone(i%2?520:380,.25,'sawtooth',.06),i*300)},
click:()=>tone(520,.04,'triangle',.05),buy:()=>{tone(523,.08,'square',.05);setTimeout(()=>tone(784,.12,'square',.05),70)},win:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.2,'triangle',.07),i*120))},lose:()=>{[330,262,196,131].forEach((f,i)=>setTimeout(()=>tone(f,.3,'sawtooth',.06),i*180))}};
function music(){if(!SAVE.sound||!AC)return;ISMUS=true;try{music2()}finally{ISMUS=false}}
function music2(){const L=S.scene==='play'?S.level:1,sc=sectOf(L).m,boss=S.boss&&S.boss.alive,step=mTick++;
 const bass=sc[0]/2*(step%8<4?1:(step%8<6?1.189:1.335));if(step%2===0)tone(bass,.22,'sawtooth',.018);
 if(S.scene==='play'){const arp=[sc[0]*2,sc[1]*2,sc[2]*2,sc[1]*2][step%4];if(boss||step%2)tone(arp,.12,'triangle',.014)}}
setInterval(()=>{if(AC&&SAVE.sound)music()},230);
// ---------------------------------------------------------------- girdi
const IN={keys:{},mx:FX+FW/2,my:600,ptr:false,down:false,click:null,lastPtr:0,touch:false,mode:'ptr'};
function mpos(e){const r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]||e.changedTouches[0]:e;return{x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height}}
cv.addEventListener('mousemove',e=>{const p=mpos(e);IN.mx=p.x;IN.my=p.y;IN.lastPtr=performance.now()});
cv.addEventListener('mousedown',e=>{ac();const p=mpos(e);IN.mx=p.x;IN.my=p.y;if(e.button===2){if(S.scene==='play')bomb();return}IN.down=true;IN.click=p;IN.mode='ptr'});
addEventListener('mouseup',()=>IN.down=false);
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('touchstart',e=>{e.preventDefault();ac();IN.touch=true;IN.mode='ptr';const p=mpos(e);IN.mx=p.x;IN.my=p.y;IN.down=true;IN.click=p;IN.lastPtr=performance.now()},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();const p=mpos(e);IN.mx=p.x;IN.my=p.y;IN.lastPtr=performance.now()},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();IN.down=false});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();IN.keys[k]=true;if(['arrowleft','arrowright','arrowup','arrowdown','a','d','w','s'].includes(k)){IN.mode='key';IN.kx=IN.mx;IN.ky=IN.my}if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();ac();
 if(S.scene==='play'){if(k===' '||k==='b')bomb();if(k==='p'||k==='escape')S.paused=!S.paused}
 else if(S.scene==='menu'&&(k==='enter'))go('levels');
 if(k==='m'){SAVE.sound=!SAVE.sound;save()}});
addEventListener('keyup',e=>IN.keys[e.key.toLowerCase()]=false);
addEventListener('blur',()=>{if(S.scene==='play')S.paused=true});
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}addEventListener('resize',fit);fit();
// ---------------------------------------------------------------- durum
const S={scene:'menu',t:0,level:1,endless:false,paused:false,god:false,auto:false,hang:'ships',shake:0,flash:0,msg:null,btns:[],hover:null};
let zaps=[],P=null,bullets=[],ebul=[],enemies=[],pick=[],parts=[],rings=[],floats=[],drones=[];
let line=[],lt=0,bgc={},stars=[];
for(let i=0;i<110;i++)stars.push({x:Math.random()*W,y:Math.random()*H,z:Math.random()*2+.4});
function go(sc){S.scene=sc;SFX.click();S.hover=null}
// ---------------------------------------------------------------- yardımcılar: efektler
function boom(x,y,r,col,n){const c=col||'#ffb347';for(let i=0;i<(n||16);i++){const a=Math.random()*TAU,s=rnd(40,260);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rnd(.3,.8),m:.8,c:c,s:rnd(2,5)})}rings.push({x,y,r:6,mr:r||40,l:.35,m:.35,c});if(parts.length>700)parts.splice(0,100)}
function floatTxt(x,y,t,c){floats.push({x,y,t,c:c||'#fff',l:.9})}
// ---------------------------------------------------------------- oyuncu
function shipStats(){const s=SHIPS[SAVE.ship],u=SAVE.up;return{spd:s.spd,hp:s.hp+u.hp,rate:s.rate*(1-.04*u.rate),dmg:s.dmg*(1+.08*u.dmg),mag:80+30*u.mag,bombs:1+u.bomb,drones:u.drone,wl:2+u.start}}
function newPlayer(){const st=shipStats();return{x:FX+FW/2,y:640,hp:st.hp,max:st.hp,spd:st.spd,rate:st.rate,dmg:st.dmg,mag:st.mag,bombs:st.bombs,wl:st.wl,base:st.wl,cd:0,inv:0,shield:0,rapid:0,drones:st.drones,r:9,hits:0,flame:0}}
function startRun(L,endless){S.level=L;S.endless=!!endless;S.scene='play';S.paused=false;P=newPlayer();bullets=[];ebul=[];enemies=[];pick=[];parts=[];rings=[];floats=[];S.boss=null;S.t=0;S.score=0;S.combo=0;S.comboT=0;S.coins=0;S.kills=0;S.bank=0;S.sp=0;S.hs=[];zaps=[];S.over=null;S.beam=null;zaps=[];S.hs=[];S.clearT=0;S.intro=2.4;
 line=genLevel(L);lt=0;S.total=line.length;S.bg=makeBg(L);ac();SFX.click()}
function bomb(){if(S.scene!=='play'||S.paused||S.over||!P||P.bombs<=0)return;P.bombs--;SFX.bomb();S.flash=1;S.shake=.6;ebul=[];
 for(const e of enemies){if(e.alive)hurt(e,e.boss?60:40,true)}
 for(let i=0;i<30;i++)boom(rnd(FX,FR),rnd(60,H-60),50,'#9fe9ff',4);rings.push({x:P.x,y:P.y,r:10,mr:700,l:.7,m:.7,c:'#9fe9ff'});P.inv=Math.max(P.inv,1.2)}
function hitPlayer(d){if(P.inv>0||S.over)return;if(S.god)return;if(P.shield>0){P.shield=0;P.inv=1;SFX.hit();boom(P.x,P.y,50,'#7ff',10);return}
 P.hp-=d||1;P.hits++;P.inv=2;S.shake=.4;SFX.hurt();boom(P.x,P.y,40,'#f66',14);if(P.wl>P.base){P.wl--;floatTxt(P.x,P.y-30,'SİLAH -1','#f88')}S.combo=0;
 if(P.hp<=0){P.hp=0;boom(P.x,P.y,90,'#ffb347',40);SFX.big();endRun(false)}}
// ---------------------------------------------------------------- bölüm üretici
function genLevel(L){const r=mulberry(L*7919+13),ev=[],pool=['scout','zig'];if(L>=2)pool.push('gun');if(L>=3)pool.push('kami');if(L>=4)pool.push('tank');if(L>=6)pool.push('spin');if(L>=8)pool.push('mine');if(L>=10)pool.push('ace');if(L>=14)pool.push('wing');if(L>=22)pool.push('sniper');
 const pk=a=>a[Math.floor(r()*a.length)],nW=6+Math.min(14,Math.floor(L*.55));let t=1.2;
 const light=['scout','zig','kami','ace','wing'],heavy=['gun','tank','spin','mine','sniper'];
 const X=(f)=>FX+40+f*(FW-80);
 for(let i=0;i<nW;i++){const pat=pk(['line','v','col','sides','arc','swarm','heavy','heavy']);let ty;
  if(pat==='heavy'){const h=pool.filter(x=>heavy.includes(x));ty=h.length?pk(h):'zig'}else{const l=pool.filter(x=>light.includes(x));ty=pk(l)}
  const n=pat==='heavy'?Math.min(5,1+Math.floor(L/8)+Math.floor(r()*2)):Math.min(9,4+Math.floor(r()*3)+Math.floor(L/10));
  const add=(dt,x,y,o)=>ev.push(Object.assign({t:t+dt,type:ty,x,y:y==null?-30:y},o||{}));
  if(pat==='line'||pat==='heavy'){const m=pat==='heavy'?n:Math.min(n,6);for(let k=0;k<m;k++)add(0,X((k+.5)/m),-30-(pat==='heavy'?0:0))}
  else if(pat==='v'){const m=Math.min(n,7)|1;for(let k=0;k<m;k++)add(Math.abs(k-(m-1)/2)*.35,X((k+.5)/m))}
  else if(pat==='col'){const x=X(.15+r()*.7);for(let k=0;k<n+1;k++)add(k*.4,x+Math.sin(k)*20)}
  else if(pat==='sides'){for(let k=0;k<n;k++){const left=k%2===0;add(k*.35,left?FX+20:FR-20,-30,{vx:left?70:-70})}}
  else if(pat==='arc'){for(let k=0;k<n+1;k++)add(k*.32,X(.5+Math.sin(k*.9)*.38))}
  else{for(let k=0;k<n+3;k++)add(k*.2,X(r()),-30-r()*40)}
  t+=Math.max(2,3.4+r()*1.6-L*.035)+(pat==='heavy'?1.5:0)}
 if(L%5!==0){const ty=pk(pool.filter(x=>heavy.concat(['ace']).includes(x)).concat(['gun']));const n=Math.min(6,2+Math.floor(L/8));for(let k=0;k<n;k++)ev.push({t:t+1+k*.5,type:ty,x:X((k+.5)/n),y:-30,elite:true})}
 else ev.push({t:t+1.5,boss:bossDesign(L)});
 return ev.sort((a,b)=>a.t-b.t)}
// ---------------------------------------------------------------- düşman
function hpMul(){const L=S.level;return 1+.07*(L-1)+(S.endless?.03*Math.max(0,L-50):0)}
function bsp(){return Math.min(1.6,1+.011*S.level)}
function spawnE(ev){if(ev.boss!=null)return spawnBoss(ev.boss);const d=ETYPE[ev.type];const e={type:ev.type,x:ev.x,y:ev.y,r:d.r*(ev.elite?1.35:1),hp:d.hp*hpMul()*(ev.elite?2.6:1),alive:1,t:0,ph:Math.random()*TAU,vx:ev.vx||0,elite:!!ev.elite,cd:rnd(.6,1.6),hit:0,sc:d.sc,col:d.col};e.max=e.hp;enemies.push(e)}
function spawnBoss(idx){const L=S.level,base=[320,500,760,1050,1250,1500][idx]*(1+.06*(L-1)),e={type:'boss',boss:1,idx,mk:bossMk(L),x:FX+FW/2,y:-140,r:64,hp:base,max:base,alive:1,t:0,ph:0,cd:1,cd2:2,cd3:4,hit:0,sc:2000+L*100,col:['#9fb0ff','#ff9be8','#ffd27a','#ff6a6a','#8fd8ff','#ff9a4a'][idx],ang:0,entering:true,spiral:0,beamT:0,vx:0};S.boss=e;enemies.push(e);S.msg={t:2.4,s:'UYARI! '+bossName(e).toUpperCase()};SFX.warn()}
function ebullet(x,y,ang,sp,r,col){ebul.push({x,y,vx:Math.sin(ang)*sp*bsp(),vy:Math.cos(ang)*sp*bsp(),r:r||6,col:col||'#ff5c7a'})}
const aim=(x,y)=>Math.atan2(P.x-x,P.y-y);
function updE(e,dt){e.t+=dt;if(e.hit>0)e.hit-=dt;
 if(e.boss)return updBoss(e,dt);
 switch(e.type){
 case'scout':e.y+=110*dt;e.x+=Math.sin(e.t*2+e.ph)*50*dt+e.vx*dt;break;
 case'zig':e.y+=95*dt;e.x+=Math.sin(e.t*3.2+e.ph)*150*dt+e.vx*dt;if(e.elite&&(e.cd-=dt)<=0){e.cd=1.2;ebullet(e.x,e.y,aim(e.x,e.y),230,5)}break;
 case'gun':{const ty=130+(e.ph%1)*60;if(e.t<12){if(e.y<ty)e.y+=130*dt;else e.x+=Math.sin(e.t*.8+e.ph)*30*dt}else e.y+=150*dt;
  if(e.y>60&&(e.cd-=dt)<=0){e.cd=e.elite?1:1.5;const a=aim(e.x,e.y);ebullet(e.x,e.y,a,240,6);if(S.level>=5||e.elite){ebullet(e.x,e.y,a-.18,240,5);ebullet(e.x,e.y,a+.18,240,5)}}break}
 case'tank':e.y+=(e.y<150?60:25)*dt;e.x+=Math.sin(e.t*.6+e.ph)*20*dt;if(e.y>40&&(e.cd-=dt)<=0){e.cd=2.2;const k=S.level<8?1:2;for(let i=-k;i<=k;i++)ebullet(e.x,e.y+10,aim(e.x,e.y)+i*.26,185,6,'#c9a3ff')}break;
 case'kami':if(e.t<.9){e.y+=60*dt}else{if(!e.dv){const a=aim(e.x,e.y);e.dv=[Math.sin(a)*300,Math.cos(a)*300]}e.x+=e.dv[0]*dt;e.y+=e.dv[1]*dt}break;
 case'spin':{const ty=170;if(e.y<ty)e.y+=100*dt;else{e.ox=e.ox==null?e.x:e.ox;e.x=e.ox+Math.cos(e.t*1.4)*70;e.y=ty+Math.sin(e.t*1.4)*40}
  if(e.y>60&&(e.cd-=dt)<=0){e.cd=2.4;for(let i=0;i<8;i++)ebullet(e.x,e.y,i/8*TAU+e.t,170,5,'#ff9be8')}if(e.t>14)e.y+=120*dt;break}
