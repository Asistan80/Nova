<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Fener Işığı</title>
<style>
html,body{margin:0;height:100%;background:#020403;color:#d6e2d0;font-family:system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{background:#000;max-width:100vw;max-height:100vh;cursor:crosshair}
</style></head><body><div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
"use strict";
/* ============================================================ FENER IŞIĞI
   Sisli ormanda 6 kandili yak, kapıya ulaş. Gölge Adamlar karanlıkta hızlı; ışık altında donar.
   Her harita bir koddan üretilir: #s=KOD aynı ormanı herkese verir. */
const W = 1280, H = 720, cv = document.getElementById("c"), g = cv.getContext("2d");
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t, dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const SET = Object.assign({ vol: 0.8, scare: 1, diff: 1 }, store.get("fi_set", {}));
const BEST = store.get("fi_best", {});
const DIFFS = ["Kolay", "Normal", "Zor"];

/* ------------------------------------------------------------ rastgele (kodlu) */
function hash(s) { let h = 2166136261; s = String(s); for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

const newCode = () => { const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s = ""; for (let i = 0; i < 5; i++) s += c[Math.floor(Math.random() * c.length)]; return s; };

/* ------------------------------------------------------------ ses */
const A = { ctx: null, master: null };
function audioInit() {
  if (A.ctx) { if (A.ctx.state === "suspended") A.ctx.resume(); return; }
  try {
    const C = window.AudioContext || window.webkitAudioContext; A.ctx = new C(); A.master = A.ctx.createGain(); A.master.gain.value = SET.vol; A.master.connect(A.ctx.destination);
    const len = A.ctx.sampleRate * 2, w = A.ctx.createBuffer(1, len, A.ctx.sampleRate), d = w.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; A.white = w;
    const br = A.ctx.createBuffer(1, len, A.ctx.sampleRate), bd = br.getChannelData(0); let b = 0; for (let i = 0; i < len; i++) { b = 0.97 * b + 0.03 * (Math.random() * 2 - 1); bd[i] = b * 3; } A.brown = br;
    const s = A.ctx.createBufferSource(); s.buffer = br; s.loop = true; const f = A.ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 420; const gn = A.ctx.createGain(); gn.gain.value = 0.22; s.connect(f); f.connect(gn); gn.connect(A.master); s.start();
    const lfo = A.ctx.createOscillator(), lg = A.ctx.createGain(); lfo.frequency.value = 0.09; lg.gain.value = 160; lfo.connect(lg); lg.connect(f.frequency); lfo.start();
    A.cricket = (() => { const o = A.ctx.createOscillator(), og = A.ctx.createGain(), mod = A.ctx.createOscillator(), mg = A.ctx.createGain(); o.frequency.value = 4300; og.gain.value = 0.0; mod.frequency.value = 14; mg.gain.value = 0.012; mod.connect(mg); mg.connect(og.gain); o.connect(og); og.connect(A.master); o.start(); mod.start(); return og; })();
    A.hb = 0;
  } catch (e) { A.ctx = null; }
}
function tone(freq, dur, type = "sine", vol = 0.2, pan = 0, slide = 0, delay = 0) { if (!A.ctx) return; const t0 = A.ctx.currentTime + delay, o = A.ctx.createOscillator(), gn = A.ctx.createGain(), p = A.ctx.createStereoPanner ? A.ctx.createStereoPanner() : null; o.type = type; o.frequency.setValueAtTime(freq, t0); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t0 + dur); gn.gain.setValueAtTime(0.0001, t0); gn.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); o.connect(gn); if (p) { p.pan.value = clamp(pan, -1, 1); gn.connect(p); p.connect(A.master); } else gn.connect(A.master); o.start(t0); o.stop(t0 + dur + 0.05); }
function noise(dur, vol = 0.3, f0 = 800, f1 = 800, type = "bandpass", pan = 0, delay = 0, q = 1) { if (!A.ctx) return; const t0 = A.ctx.currentTime + delay, s = A.ctx.createBufferSource(); s.buffer = A.white; const f = A.ctx.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur); const gn = A.ctx.createGain(); gn.gain.setValueAtTime(vol, t0); gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); const p = A.ctx.createStereoPanner ? A.ctx.createStereoPanner() : null; s.connect(f); f.connect(gn); if (p) { p.pan.value = clamp(pan, -1, 1); gn.connect(p); p.connect(A.master); } else gn.connect(A.master); s.start(t0, Math.random()); s.stop(t0 + dur + 0.05); }
const SFX = {
  click() { tone(900, 0.04, "square", 0.05); }, step(v = 0.08) { noise(0.07, v, 260, 120, "lowpass"); },
  flash() { tone(520, 0.04, "square", 0.05); noise(0.05, 0.06, 3000, 1500, "highpass"); },
  pick() { tone(660, 0.12, "sine", 0.12); tone(990, 0.2, "sine", 0.1, 0, 0, 0.08); },
  light() { [392, 523, 659, 784].forEach((f, i) => tone(f, 0.9, "sine", 0.1, 0, 0, i * 0.12)); noise(0.5, 0.12, 2000, 600); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 1.5, "sine", 0.12, 0, 0, i * 0.25)); },
  whisper(pan) { for (let i = 0; i < 3; i++) noise(0.8, 0.1, 1700 + i * 260, 900, "bandpass", pan, i * 0.3, 6); },
  freeze() { tone(2200, 0.15, "sawtooth", 0.05, 0, -1500); noise(0.25, 0.1, 5000, 1000, "bandpass"); },
  scare() { const v = [0.55, 0.9, 1.0][SET.scare]; noise(1.4, 0.9 * v, 4000, 200, "bandpass", 0, 0, 0.7); noise(1.2, 0.7 * v, 200, 60, "lowpass"); tone(180, 1.2, "sawtooth", 0.35 * v, 0, -140); tone(540, 1.0, "sawtooth", 0.25 * v, 0, -380); },
  heart() { tone(55, 0.12, "sine", 0.35); tone(48, 0.14, "sine", 0.3, 0, 0, 0.17); },
  empty() { tone(120, 0.4, "sine", 0.2, 0, -50); },
};

/* ------------------------------------------------------------ dünya */
const WS = 3400;
const S = { screen: "menu", code: "", seed: 0, trees: [], grid: {}, lanterns: [], bats: [], gate: null, p: null, en: [], t: 0, paused: false, lit: 0, msg: "", msgT: 0, shake: 0, flash: 0, deadT: 0, winT: 0, aim: 0, mouse: { x: 640, y: 360 }, keys: {}, mdown: false, cam: { x: 0, y: 0 }, steps: 0, hb: 0, newBest: false, sub: null, fx: [] };
const CELL = 160;
function gkey(x, y) { return Math.floor(x / CELL) + "," + Math.floor(y / CELL); }
function addTree(t) { S.trees.push(t); const k = gkey(t.x, t.y); (S.grid[k] = S.grid[k] || []).push(t); }
function nearTrees(x, y, r) { const out = []; const x0 = Math.floor((x - r) / CELL), x1 = Math.floor((x + r) / CELL), y0 = Math.floor((y - r) / CELL), y1 = Math.floor((y + r) / CELL); for (let i = x0; i <= x1; i++) for (let j = y0; j <= y1; j++) { const c = S.grid[i + "," + j]; if (c) for (const t of c) out.push(t); } return out; }
function startGame(code) {
  audioInit(); S.code = (code || newCode()).toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8) || newCode(); S.seed = hash(S.code); history.replaceState(null, "", "#s=" + S.code);
  const R = rng(S.seed); S.trees = []; S.grid = {}; S.lanterns = []; S.bats = []; S.en = []; S.fx = [];
  const start = { x: WS / 2 + (R() - 0.5) * 400, y: WS - 220 }; S.gate = { x: WS / 2 + (R() - 0.5) * 900, y: 170 };
  const pts = [start, S.gate];
  const far = (x, y, d) => pts.every(q => Math.hypot(q.x - x, q.y - y) > d);
  for (let i = 0; i < 6; i++) { let x, y, n = 0; do { x = 260 + R() * (WS - 520); y = 380 + R() * (WS - 860); n++; } while (!far(x, y, 680) && n < 300); pts.push({ x, y }); S.lanterns.push({ x, y, prog: 0, lit: false, id: i }); }
  for (let i = 0; i < 14; i++) { const x = 160 + R() * (WS - 320), y = 160 + R() * (WS - 320); S.bats.push({ x, y, got: false }); pts.push({ x, y }); }
  // ağaçlar
  for (let i = 0; i < 620; i++) { const x = 80 + R() * (WS - 160), y = 80 + R() * (WS - 160), r = 20 + R() * 20; if (pts.every(q => Math.hypot(q.x - x, q.y - y) > 140)) addTree({ x, y, r, h: R(), v: R() }); }
  for (let i = 0; i < 90; i++) { const a = R() * 6.28, r = 20 + R() * 20; /* kenar ağaçları */ const side = i % 4, o = R() * WS; addTree({ x: side === 0 ? o : side === 1 ? o : side === 2 ? 30 : WS - 30, y: side === 0 ? 30 : side === 1 ? WS - 30 : o, r, h: R(), v: R() }); }
  S.p = { x: start.x, y: start.y, vx: 0, vy: 0, bat: 100, stam: 100, on: true, face: -Math.PI / 2, step: 0, hide: 0 };
  S.t = 0; S.lit = 0; S.screen = "play"; S.paused = false; S.shake = 0; S.flash = 0; S.deadT = 0; S.winT = 0; S.newBest = false; S.sub = null; S.msg = "Karanlıkta altı kandil var. Hepsini yak, sonra kapıya git."; S.msgT = 6; S.R = rng(S.seed ^ 0x9e3779b9);
  S.diff = SET.diff; S.maxEn = 1; spawnEnemy(true);
}
function spawnEnemy(first) {
  const p = S.p; let x, y, n = 0; do { const a = Math.random() * 6.28, d = 750 + Math.random() * 500; x = clamp(p.x + Math.cos(a) * d, 100, WS - 100); y = clamp(p.y + Math.sin(a) * d, 100, WS - 100); n++; } while (n < 40 && S.lanterns.some(l => l.lit && Math.hypot(l.x - x, l.y - y) < 240));
  S.en.push({ x, y, st: "wander", tx: x, ty: y, litT: 0, cd: first ? 8 : 2, frozen: false, vis: 0, id: S.en.length });
}
function collide(o, r) { for (const t of nearTrees(o.x, o.y, r + 45)) { const dx = o.x - t.x, dy = o.y - t.y, d = Math.hypot(dx, dy), m = r + t.r * 0.55; if (d < m && d > 0.001) { o.x += dx / d * (m - d); o.y += dy / d * (m - d); } } o.x = clamp(o.x, 20, WS - 20); o.y = clamp(o.y, 20, WS - 20); }
const SAFE_R = 230;
function inSafe(x, y) { return S.lanterns.some(l => l.lit && Math.hypot(l.x - x, l.y - y) < SAFE_R); }
function say(t, d = 4) { S.msg = t; S.msgT = d; }

/* ------------------------------------------------------------ mantık */
function lanternsLit() { return S.lanterns.filter(l => l.lit).length; }
function inCone(e, range = 470, half = 0.5) { const p = S.p; if (!p.on || p.bat <= 0) return false; const d = Math.hypot(e.x - p.x, e.y - p.y); if (d > range) return false; let a = Math.atan2(e.y - p.y, e.x - p.x) - S.aim; while (a > Math.PI) a -= 6.283; while (a < -Math.PI) a += 6.283; return Math.abs(a) < half; }
function update(dt) {
  if (S.screen === "dead") { S.deadT += dt; S.shake = Math.max(0, S.shake - dt * 0.6); return; }
  if (S.screen === "win") { S.winT += dt; return; }
  if (S.screen !== "play" || S.paused) return;
  const p = S.p, K = S.keys; S.t += dt; S.msgT = Math.max(0, S.msgT - dt); S.shake = Math.max(0, S.shake - dt * 2); S.flash = Math.max(0, S.flash - dt * 3);
  // hareket
  let mx = (K["d"] || K["arrowright"] ? 1 : 0) - (K["a"] || K["arrowleft"] ? 1 : 0), my = (K["s"] || K["arrowdown"] ? 1 : 0) - (K["w"] || K["arrowup"] ? 1 : 0);
  if (S.joy && S.joy.on) { mx = S.joy.x; my = S.joy.y; }
  const mv = Math.hypot(mx, my); if (mv > 1) { mx /= mv; my /= mv; }
  const sprint = (K["shift"] || S.sprintBtn) && p.stam > 5 && mv > 0.1; let sp = sprint ? 205 : 118; if (p.bat <= 0) sp *= 0.95;
  p.stam = sprint ? Math.max(0, p.stam - 26 * dt) : Math.min(100, p.stam + 15 * dt);
  p.x += mx * sp * dt; p.y += my * sp * dt; collide(p, 11);
  p.moving = mv > 0.1; p.sprint = sprint;
  if (p.moving) { p.step += sp * dt; if (p.step > 46) { p.step = 0; SFX.step(sprint ? 0.14 : 0.07); } }
  // fener yönü
  if (S.aimStick && S.aimStick.on) S.aim = Math.atan2(S.aimStick.y, S.aimStick.x);
  else if (!S.touch) S.aim = Math.atan2(S.mouse.y - (p.y - S.cam.y), S.mouse.x - (p.x - S.cam.x));
  if (p.on && p.bat > 0) { p.bat = Math.max(0, p.bat - (S.diff === 2 ? 1.5 : S.diff === 0 ? 0.8 : 1.1) * dt); if (p.bat <= 0) { SFX.empty(); say("Pil bitti! Kandil ışığına git ya da pil bul.", 4); } }
  // eşyalar
  for (const b of S.bats) if (!b.got && Math.hypot(b.x - p.x, b.y - p.y) < 26) { b.got = true; p.bat = Math.min(100, p.bat + 32); SFX.pick(); say("Pil bulundu (+%32)", 2); }
  // kandil yakma
  let near = null; for (const l of S.lanterns) if (!l.lit && Math.hypot(l.x - p.x, l.y - p.y) < 46) near = l;
  S.near = near; const act = K["e"] || S.useBtn;
  for (const l of S.lanterns) { if (l === near && act) { l.prog += dt; S.noisy = true; if (l.prog >= 2.4) { l.lit = true; l.prog = 0; SFX.light(); S.shake = 0.2; const n = lanternsLit(); say("Kandil yandı (" + n + "/6). " + (n === 6 ? "KAPI AÇILDI! Kuzeye koş." : "Yeni ışık güvenli bir alan."), 4); if (n === 2 || n === 4 || (n === 1 && S.diff === 2)) { S.maxEn++; spawnEnemy(); say("Ormanda yeni bir şey uyandı…", 3); SFX.whisper(0); } } } else if (!l.lit) l.prog = Math.max(0, l.prog - dt * 1.5); }
  const gateOpen = lanternsLit() === 6; if (gateOpen && Math.hypot(S.gate.x - p.x, S.gate.y - p.y) < 70) { win(); return; }
  // güvenli alan: pil yenilenir
  if (inSafe(p.x, p.y)) p.bat = Math.min(100, p.bat + 6 * dt);
  // düşmanlar
  const dm = [0.85, 1, 1.18][S.diff]; let minD = 1e9;
  for (const e of S.en) {
    const d = Math.hypot(e.x - p.x, e.y - p.y); minD = Math.min(minD, d);
    const lit = inCone(e, 470, 0.5) || (d < 80 && p.on && p.bat > 0);
    e.frozen = lit; e.cd = Math.max(0, e.cd - dt);
    const noisyNear = ((p.sprint && d < 420) || (S.noisy && d < 700) || (d < 260 && p.moving));
    if (e.st === "wander") { if (Math.hypot(e.tx - e.x, e.ty - e.y) < 30 || Math.random() < dt * 0.05) { e.tx = clamp(e.x + (Math.random() - 0.5) * 900, 100, WS - 100); e.ty = clamp(e.y + (Math.random() - 0.5) * 900, 100, WS - 100); } if (!lit) { const a = Math.atan2(e.ty - e.y, e.tx - e.x); e.x += Math.cos(a) * 40 * dm * dt; e.y += Math.sin(a) * 40 * dm * dt; } if ((d < 520 && (p.on || d < 260)) || noisyNear) { if (e.cd <= 0) { e.st = "hunt"; SFX.whisper((e.x - p.x) / 600); } } }
    else if (e.st === "hunt") {
      if (lit) { e.litT += dt; if (Math.random() < dt * 6) S.fx.push({ x: e.x, y: e.y, vx: (Math.random() - 0.5) * 60, vy: -30 - Math.random() * 30, life: 0.6 }); if (e.litT > 1.7) { SFX.freeze(); e.st = "flee"; e.litT = 0; e.cd = 7; e.fleeT = 3.5; } }
      else { e.litT = Math.max(0, e.litT - dt * 0.6); const dark = !(p.on && p.bat > 0); const spd = (dark ? 128 : 96) * dm + lanternsLit() * 5; const a = Math.atan2(p.y - e.y, p.x - e.x); e.x += Math.cos(a) * spd * dt; e.y += Math.sin(a) * spd * dt; }
      if (d > 900 && !noisyNear) e.st = "wander";
    }
    else if (e.st === "flee") { e.fleeT -= dt; const a = Math.atan2(e.y - p.y, e.x - p.x); e.x += Math.cos(a) * 150 * dt; e.y += Math.sin(a) * 150 * dt; if (e.fleeT <= 0) e.st = "wander"; }
    collide(e, 14);
    // güvenli alan
    for (const l of S.lanterns) if (l.lit) { const dx = e.x - l.x, dy = e.y - l.y, dd = Math.hypot(dx, dy); if (dd < SAFE_R && dd > 0.1) { e.x = l.x + dx / dd * SAFE_R; e.y = l.y + dy / dd * SAFE_R; if (e.st === "hunt" && Math.random() < dt) { e.st = "wander"; e.cd = 3; } } }
    e.vis = lerp(e.vis, (lit ? 1 : (d < 150 ? 0.5 : 0)), dt * 6);

  // kalp atışı

  S.hbRate = hbRate;
}
function die() { if (S.screen !== "play") return; S.screen = "dead"; S.deadT = 0; S.shake = 1; SFX.scare(); }
function win() {
  S.screen = "win"; S.winT = 0; SFX.win(); const k = S.code + ":" + S.diff, t = S.t; if (!BEST[k] || t < BEST[k]) { BEST[k] = t; S.newBest = true; store.set("fi_best", BEST); }
}

/* ------------------------------------------------------------ çizim */
const dark = document.createElement("canvas"); dark.width = W; dark.height = H; const dg = dark.getContext("2d");
function drawWorld(cx, cy) {
  g.fillStyle = "#0b140d"; g.fillRect(0, 0, W, H);
  // zemin deseni
  g.fillStyle = "#0e1a10"; const o = (-cx % 80 + 80) % 80, o2 = (-cy % 80 + 80) % 80; for (let x = -80 + o; x < W + 80; x += 80) for (let y = -80 + o2; y < H + 80; y += 80) { const hs = hash((Math.floor((x + cx) / 80)) + "_" + (Math.floor((y + cy) / 80))) % 7; if (hs < 2) g.fillRect(x + hs * 9, y + hs * 5, 26, 3); }
  // sınır
  g.fillStyle = "#020302"; if (cx < 0) g.fillRect(0, 0, -cx, H); if (cy < 0) g.fillRect(0, 0, W, -cy); if (cx + W > WS) g.fillRect(WS - cx, 0, W, H); if (cy + H > WS) g.fillRect(0, WS - cy, W, H);
  // kandiller (söner)
  for (const l of S.lanterns) { const x = l.x - cx, y = l.y - cy; if (x < -60 || x > W + 60 || y < -60 || y > H + 60) continue; g.fillStyle = "#2a1c10"; g.fillRect(x - 5, y - 4, 10, 20); g.fillStyle = l.lit ? "#ffcf70" : "#3a3024"; g.beginPath(); g.arc(x, y - 8, 9, 0, 7); g.fill(); if (l.prog > 0 && !l.lit) { g.strokeStyle = "#ffcf70"; g.lineWidth = 3; g.beginPath(); g.arc(x, y - 8, 16, -1.57, -1.57 + 6.28 * l.prog / 2.4); g.stroke(); } }
  for (const b of S.bats) { if (b.got) continue; const x = b.x - cx, y = b.y - cy; if (x < -20 || x > W + 20 || y < -20 || y > H + 20) continue; g.fillStyle = "#3fb86a"; g.fillRect(x - 6, y - 4, 12, 8); g.fillStyle = "#cfeedd"; g.fillRect(x + 6, y - 2, 3, 4); }
  // kapı
  const gx = S.gate.x - cx, gy = S.gate.y - cy; g.fillStyle = "#1a1510"; g.fillRect(gx - 50, gy - 30, 18, 60); g.fillRect(gx + 32, gy - 30, 18, 60); g.fillRect(gx - 50, gy - 38, 100, 10); if (lanternsLit() === 6) { g.fillStyle = "rgba(255,220,140,.5)"; g.fillRect(gx - 32, gy - 28, 64, 56); }
  // düşmanlar
  for (const e of S.en) drawEnemy(e, cx, cy);
  // oyuncu
