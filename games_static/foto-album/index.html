<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foto Albüm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#171a1f;--bg2:#1f242b;--bg3:#2a313a;--line:#38414c;--tx:#e8edf3;--mu:#93a0af;--ac:#5aa9ff;--ac2:#2f7fd6;--star:#ffcf4a;--danger:#ff6b6b;--ok:#5fd19a;--hd:'Bungee','Impact',sans-serif;--ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--ui);font-size:14px;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-family:var(--hd);font-size:20px;letter-spacing:.04em;color:var(--ac);margin-right:8px;white-space:nowrap}
.logo b{color:var(--star);font-weight:400}
.btn{background:var(--bg3);border:1px solid var(--line);border-radius:7px;padding:6px 11px;font-weight:600;font-size:13px;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--ac);background:#313a45}
.btn.pri{background:var(--ac2);border-color:var(--ac);color:#fff}
.btn.pri:hover{background:var(--ac)}
.btn.dng:hover{border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
input[type=text],input[type=search],select{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0}
input[type=range]{accent-color:var(--ac);min-width:0}
.sp{flex:1}
#main{flex:1;display:flex;min-height:0}
#side{width:210px;flex:none;background:var(--bg2);border-right:1px solid var(--line);overflow:auto;padding:8px 6px}
#side h4{margin:12px 8px 4px;font-size:11px;letter-spacing:.1em;color:var(--mu);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
#side h4 button{background:none;border:0;color:var(--ac);font-size:16px;line-height:1;padding:0 2px}
.si{display:flex;justify-content:space-between;gap:6px;padding:6px 9px;border-radius:7px;cursor:pointer;color:var(--tx);border:0;background:none;width:100%;text-align:left}
.si:hover{background:var(--bg3)}
.si.on{background:var(--ac2);color:#fff}
.si span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.si em{font-style:normal;color:var(--mu);font-size:12px}
.si.on em{color:#d6e8ff}
#lib{flex:1;overflow:auto;padding:10px 14px 90px;position:relative}
.gh{margin:14px 2px 8px;font-weight:700;font-size:15px;display:flex;align-items:baseline;gap:8px}
.gh small{color:var(--mu);font-weight:500;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--ts,150px),1fr));gap:6px}
.th{position:relative;aspect-ratio:1;background:var(--bg3);border-radius:6px;overflow:hidden;cursor:pointer;border:2px solid transparent;user-select:none}
.th img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.th:hover{border-color:#5d6b7b}
.th.sel{border-color:var(--ac);box-shadow:0 0 0 2px rgba(90,169,255,.35)}
.th .st{position:absolute;top:3px;right:5px;font-size:16px;color:var(--star);text-shadow:0 1px 3px #000;display:none;background:none;border:0;padding:0;line-height:1}
.th.starred .st,.th:hover .st{display:block}
.th:not(.starred) .st{color:#fff;opacity:.8}
.th .nm{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 4px;font-size:11px;background:linear-gradient(transparent,rgba(0,0,0,.7));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .15s}
.th:hover .nm{opacity:1}
.th .tg{position:absolute;left:4px;top:4px;font-size:11px;background:rgba(0,0,0,.55);padding:1px 5px;border-radius:9px;display:none}
.th.edited .tg{display:block}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;color:var(--mu);height:100%;min-height:300px;padding:20px}
.empty h2{margin:0;font-family:var(--hd);font-weight:400;color:var(--tx);font-size:26px}
.drop{position:absolute;inset:6px;border:3px dashed var(--ac);border-radius:14px;background:rgba(90,169,255,.1);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--ac);z-index:5;pointer-events:none}
#tray{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--ac);border-radius:12px;padding:8px 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:10;max-width:calc(100vw - 20px);justify-content:center}
#tray .cnt{font-weight:700;padding:0 6px;color:var(--ac)}
#sbar{padding:4px 12px;font-size:12px;color:var(--mu);background:var(--bg2);border-top:1px solid var(--line);display:flex;gap:14px;flex-wrap:wrap}
/* editor */
.ov{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column}
#edTop{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--line);flex-wrap:wrap}
#edTitle{font-weight:700;max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#edMain{flex:1;display:flex;min-height:0}
#edSide{width:290px;flex:none;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 4px;font-weight:600;color:var(--mu);font-size:13px}
#tabs button.on{color:var(--tx);border-color:var(--ac)}
#tp{flex:1;overflow:auto;padding:12px}
.row{margin-bottom:12px}
.row label{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-bottom:3px}
.row label b{color:var(--tx);font-weight:600}
.row input[type=range]{width:100%}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.btns.c3{grid-template-columns:1fr 1fr 1fr}
.ph{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin:14px 0 6px}
.ph:first-child{margin-top:0}
.fxg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fx{background:var(--bg);border:2px solid transparent;border-radius:6px;padding:0;overflow:hidden;text-align:center}
.fx canvas{display:block;width:100%;aspect-ratio:1;background:var(--bg3)}
.fx span{display:block;font-size:11px;padding:3px 1px}
.fx.on{border-color:var(--ac)}
#edView{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-width:0;background:#0d0f12;overflow:hidden}
#cv{max-width:100%;max-height:100%;display:block;box-shadow:0 4px 30px rgba(0,0,0,.6)}
#cwrap{position:relative;line-height:0}
#crop{position:absolute;inset:0;touch-action:none}
#crop .box{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);cursor:move}
#crop .box::before,#crop .box::after{content:"";position:absolute;background:rgba(255,255,255,.35)}
#crop .box::before{left:33.3%;right:33.3%;top:0;bottom:0;border-left:1px solid rgba(255,255,255,.4);border-right:1px solid rgba(255,255,255,.4);background:none}
#crop .box::after{top:33.3%;bottom:33.3%;left:0;right:0;border-top:1px solid rgba(255,255,255,.4);border-bottom:1px solid rgba(255,255,255,.4);background:none}
#crop .h{position:absolute;width:16px;height:16px;background:var(--ac);border:2px solid #fff;border-radius:3px;z-index:2}
#navL,#navR{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.45);border:0;color:#fff;font-size:26px;width:40px;height:70px;border-radius:8px;z-index:3}
#navL{left:8px}#navR{right:8px}
#navL:hover,#navR:hover{background:rgba(0,0,0,.75)}
#film{display:flex;gap:4px;padding:6px 10px;background:var(--bg2);border-top:1px solid var(--line);overflow-x:auto;height:74px;flex:none}
#film img{height:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;border:2px solid transparent;cursor:pointer;flex:none}
#film img.on{border-color:var(--ac)}
#hist{width:100%;height:56px;background:var(--bg);border-radius:6px;display:block}
/* slideshow */
#ss{background:#000;z-index:50;align-items:center;justify-content:center}
#ss img{max-width:100%;max-height:100%;position:absolute;transition:opacity .9s;opacity:0}
#ss img.on{opacity:1}
#ssBar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;background:rgba(0,0,0,.6);padding:8px;border-radius:10px;opacity:0;transition:opacity .3s;z-index:2}
#ss:hover #ssBar,#ssBar:focus-within{opacity:1}
/* collage */
#col{z-index:40}
#colMain{flex:1;display:flex;min-height:0}
#colSide{width:280px;flex:none;background:var(--bg2);border-right:1px solid var(--line);padding:12px;overflow:auto}
#colView{flex:1;display:flex;align-items:center;justify-content:center;background:#0d0f12;min-width:0;padding:16px}
#colView canvas{max-width:100%;max-height:100%;box-shadow:0 4px 30px rgba(0,0,0,.6)}
.lay{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.lay button{background:var(--bg);border:2px solid var(--line);border-radius:6px;padding:4px;aspect-ratio:1}
.lay button.on{border-color:var(--ac)}
.lay svg{width:100%;height:100%;display:block}
/* dialog + toast */
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:flex;align-items:center;justify-content:center;padding:14px}
#dlg .bx{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px;width:min(380px,100%);max-height:80vh;overflow:auto}
#dlg h3{margin:0 0 10px;font-size:16px}
#dlg input{width:100%;margin-bottom:12px}
#dlg .ar{display:flex;gap:8px;justify-content:flex-end}
#dlg .lst{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--ac);padding:9px 16px;border-radius:9px;z-index:90;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.5);max-width:90vw}
.chip{display:inline-block;background:var(--bg3);border-radius:99px;padding:3px 9px;font-size:12px;margin:2px;cursor:pointer;border:1px solid var(--line)}
.chip:hover{border-color:var(--ac)}
@media(max-width:760px){
 #side{position:absolute;z-index:6;height:calc(100% - 100px);transform:translateX(-100%);transition:transform .2s}
 #side.open{transform:none;box-shadow:0 0 30px #000}
 #edMain,#colMain{flex-direction:column-reverse}
 #edSide,#colSide{width:100%;height:42%;border-right:0;border-top:1px solid var(--line)}
 #edTitle{max-width:100%}
}
@media(min-width:761px){#menuBtn{display:none}}
</style>
</head>
<body>
<div id="app">
 <header id="top">
  <button class="btn" id="menuBtn" aria-label="Menü">☰</button>
  <div class="logo">FOTO <b>ALBÜM</b></div>
  <button class="btn pri" id="bImp">＋ Fotoğraf ekle</button>
  <button class="btn" id="bDir">📁 Klasör</button>
  <button class="btn" id="bDemo">✨ Demo</button>
  <input type="search" id="q" placeholder="Ara: ad, etiket…" style="width:170px" aria-label="Ara">
  <select id="sort" aria-label="Sırala">
   <option value="date-d">Tarih (yeni → eski)</option>
   <option value="date-a">Tarih (eski → yeni)</option>
   <option value="name">Ada göre</option>
   <option value="add">Eklenme</option>
  </select>
  <label style="display:flex;align-items:center;gap:5px;color:var(--mu);font-size:12px">Boyut <input type="range" id="size" min="90" max="320" value="150" style="width:90px"></label>
  <span class="sp"></span>
  <button class="btn" id="bCol">🧩 Kolaj</button>
  <button class="btn" id="bSlide">▶ Slayt gösterisi</button>
 </header>
 <div id="main">
  <aside id="side"></aside>
  <section id="lib"></section>
 </div>
 <div id="sbar"><span id="sCount"></span><span id="sSel"></span><span class="sp"></span><span id="sStore"></span></div>
</div>
<div id="tray" hidden></div>

<input type="file" id="fIn" accept="image/*" multiple hidden>
<input type="file" id="fDir" webkitdirectory multiple hidden>

<div id="ed" class="ov" hidden>
 <div id="edTop">
  <button class="btn" id="edBack">← Albüm</button>
  <span id="edTitle"></span>
  <span class="sp"></span>
  <button class="btn" id="edUndo" title="Geri al (Ctrl+Z)">↶</button>
  <button class="btn" id="edRedo" title="Yinele (Ctrl+Y)">↷</button>
  <button class="btn" id="edCmp" title="Basılı tut: orijinali göster">Karşılaştır</button>
  <button class="btn pri" id="edSaveC">Kopya kaydet</button>
  <button class="btn" id="edSaveO">Üzerine kaydet</button>
  <button class="btn" id="edDl">İndir</button>
 </div>
 <div id="edMain">
  <div id="edSide">
   <div id="tabs">
    <button data-t="basic" class="on">Temel</button>
    <button data-t="tune">Ayar</button>
    <button data-t="fx">Efektler</button>
   </div>
   <div id="tp"></div>
  </div>
  <div id="edView">
   <button id="navL" aria-label="Önceki">‹</button>
   <div id="cwrap"><canvas id="cv"></canvas><div id="crop" hidden></div></div>
   <button id="navR" aria-label="Sonraki">›</button>
  </div>
 </div>
 <div id="film"></div>
</div>

<div id="ss" class="ov" hidden>
 <img id="ss1" alt=""><img id="ss2" alt="">
 <div id="ssBar">
  <button class="btn" id="ssPrev">⏮</button>
  <button class="btn" id="ssPlay">⏸</button>
  <button class="btn" id="ssNext">⏭</button>
  <select id="ssSpd" aria-label="Hız"><option value="2000">Hızlı</option><option value="4000" selected>Normal</option><option value="7000">Yavaş</option></select>
  <button class="btn" id="ssFs">⛶</button>
  <button class="btn" id="ssX">✕</button>
 </div>
</div>

<div id="col" class="ov" hidden>
 <div id="edTop">
  <button class="btn" id="colBack">← Albüm</button>
  <b>Kolaj</b>
  <span class="sp"></span>
  <button class="btn" id="colSave">Albüme kaydet</button>
  <button class="btn pri" id="colDl">PNG indir</button>
 </div>
 <div id="colMain">
  <div id="colSide"></div>
  <div id="colView"><canvas id="colCv"></canvas></div>
 </div>
</div>

<div id="dlg" hidden></div>
<div id="toast" hidden></div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MON=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];

/* ---------- depolama ---------- */
let db=null;
const idbReady=new Promise(res=>{
  try{
    const r=indexedDB.open('foto_album',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id'});
    r.onsuccess=()=>{db=r.result;res(true)};
    r.onerror=()=>res(false);
  }catch(e){res(false)}
});
function idbAll(){return new Promise(res=>{if(!db)return res([]);try{const q=db.transaction('p').objectStore('p').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])}catch(e){res([])}})}
function idbPut(rec){return new Promise(res=>{if(!db)return res(false);try{const t=db.transaction('p','readwrite');t.objectStore('p').put(rec);t.oncomplete=()=>res(true);t.onerror=()=>res(false)}catch(e){res(false)}})}
function idbDel(id){return new Promise(res=>{if(!db)return res(false);try{const t=db.transaction('p','readwrite');t.objectStore('p').delete(id);t.oncomplete=()=>res(true);t.onerror=()=>res(false)}catch(e){res(false)}})}
let META={albums:[]};
try{const m=JSON.parse(localStorage.getItem('foto_album_meta_v1')||'null');if(m&&Array.isArray(m.albums))META=m}catch(e){}
function saveMeta(){try{localStorage.setItem('foto_album_meta_v1',JSON.stringify(META))}catch(e){}}
const UI={view:'all',sort:'date-d',size:150,q:''};
try{Object.assign(UI,JSON.parse(localStorage.getItem('foto_album_ui_v1')||'{}'));UI.view='all';UI.q=''}catch(e){}
function saveUI(){try{localStorage.setItem('foto_album_ui_v1',JSON.stringify({sort:UI.sort,size:UI.size}))}catch(e){}}

let P=[];            // fotoğraf kayıtları
const urls=new Map(); // id -> thumb url
let SEL=new Set(), lastSel=null;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function thumbUrl(r){let u=urls.get(r.id);if(!u||r._tv!==r.tv){if(u)URL.revokeObjectURL(u);u=URL.createObjectURL(r.thumb);urls.set(r.id,u);r._tv=r.tv}return u}

/* ---------- yardımcılar ---------- */
let toastT=0;
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
function canvasBlob(c,type='image/jpeg',q=.9){return new Promise(r=>c.toBlob(b=>r(b),type,q))}
async function loadBmp(blob){
  if(window.createImageBitmap){try{return await createImageBitmap(blob)}catch(e){}}
  return new Promise((res,rej)=>{const u=URL.createObjectURL(blob),i=new Image();i.onload=()=>{res(i)};i.onerror=rej;i.src=u})
}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c}
async function makeThumb(src,maxd=360){
  const w=src.width,h=src.height,k=Math.min(1,maxd/Math.max(w,h));
  const c=mkCanvas(w*k,h*k);const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(src,0,0,c.width,c.height);
  return {blob:await canvasBlob(c,'image/jpeg',.82),w,h};
}
async function addBlob(blob,name,taken,extra){
  let bmp;try{bmp=await loadBmp(blob)}catch(e){return null}
  const t=await makeThumb(bmp);
  const rec=Object.assign({id:uid(),name:name||'foto',added:Date.now(),taken:taken||Date.now(),w:t.w,h:t.h,size:blob.size,blob,thumb:t.blob,tv:1,star:false,tags:[],albums:[],orig:null,edited:false},extra||{});
  P.push(rec);await idbPut(rec);
  if(bmp.close)try{bmp.close()}catch(e){}
  return rec;
}
async function importFiles(files){
  const list=[...files].filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|gif|webp|bmp|avif)$/i.test(f.name));
  if(!list.length){toast('Görsel dosyası bulunamadı');return 0}
  let n=0;
  for(const f of list){
    toast(`Ekleniyor… ${n+1}/${list.length}`);
    const r=await addBlob(f,f.name.replace(/\.[^.]+$/,''),f.lastModified);
    if(r)n++;
    if(n%8===0)render();
  }
  render();toast(`${n} fotoğraf eklendi`);return n;
}

/* ---------- demo fotoğraflar (kodla çizilir) ---------- */
function rng(seed){let s=seed>>>0||1;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function drawScene(kind,seed){
  const W=1200,H=800,c=mkCanvas(W,H),x=c.getContext('2d'),R=rng(seed*7919+13);
  const sky=(a,b,hz=.62)=>{const g=x.createLinearGradient(0,0,0,H*hz);g.addColorStop(0,a);g.addColorStop(1,b);x.fillStyle=g;x.fillRect(0,0,W,H)};
  const sun=(px,py,r,col)=>{const g=x.createRadialGradient(px,py,0,px,py,r*4);g.addColorStop(0,col);g.addColorStop(.25,col.replace(/[\d.]+\)$/,'.35)'));g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle=col.replace(/[\d.]+\)$/,'1)');x.beginPath();x.arc(px,py,r,0,7);x.fill()};
  const mount=(base,amp,col,rough)=>{x.fillStyle=col;x.beginPath();x.moveTo(0,H);let y=base;for(let i=0;i<=W;i+=12){y+=(R()-.5)*rough;y=clamp(y,base-amp,base+amp*.6);x.lineTo(i,y)}x.lineTo(W,H);x.closePath();x.fill()};
  const clouds=(n,al)=>{for(let i=0;i<n;i++){const cx=R()*W,cy=40+R()*220,s=60+R()*90;x.fillStyle=`rgba(255,255,255,${al})`;for(let j=0;j<6;j++){x.beginPath();x.ellipse(cx+j*s*.35-s,cy+(R()-.5)*20,s*.5,s*.28,0,0,7);x.fill()}}};

  switch(kind){

   case 'gece':x.fillStyle='#050816';x.fillRect(0,0,W,H);sky('#050816','#18204d');stars(260);sun(W*.2,H*.18,30,'rgba(240,244,255,.9)');mount(H*.7,90,'#0a0f26',26);for(let i=0;i<12;i++){x.fillStyle='rgba(255,214,120,.9)';x.fillRect(80+R()*(W-160),H*.8+R()*80,5,7)}break;
   case 'sehir':sky('#8f63b8','#ffbe8a');sun(W*.3,H*.55,40,'rgba(255,230,180,.8)');for(let i=0,px=0;px<W;i++){const bw=40+R()*70,bh=120+R()*330;x.fillStyle=`rgb(${30+R()*25|0},${24+R()*20|0},${52+R()*30|0})`;x.fillRect(px,H*.9-bh,bw,bh);for(let yy=H*.9-bh+12;yy<H*.9-10;yy+=22)for(let xx=px+6;xx<px+bw-8;xx+=16)if(R()>.55){x.fillStyle='rgba(255,220,130,.9)';x.fillRect(xx,yy,7,10)}px+=bw+R()*6}x.fillStyle='#17102a';x.fillRect(0,H*.9,W,H*.1);break;

   case 'col':sky('#ffcf84','#fff1c8');sun(W*.5,H*.3,50,'rgba(255,255,230,.95)');for(let k=0;k<3;k++){x.fillStyle=['#e8b562','#d89c48','#c58538'][k];x.beginPath();x.moveTo(0,H);let yy=H*(.62+k*.1);for(let i=0;i<=W;i+=10){yy+=Math.sin(i/(80+k*30)+k)*3+(R()-.5)*3;x.lineTo(i,yy)}x.lineTo(W,H);x.fill()}break;

async function addDemos(){
  const kinds=['gunbatimi','dag','deniz','gece','sehir','orman','col','kis','gunbatimi','dag','deniz','orman'];
  const names=['Gün Batımı','Dağ Yolu','Sahil','Yıldızlı Gece','Şehir Işıkları','Çam Ormanı','Çöl','Kar Manzarası','Akşam Sefası','Zirve','Mavi Koy','Yeşil Vadi'];
  const now=Date.now();let n=0;
  for(let i=0;i<kinds.length;i++){
    const c=drawScene(kinds[i],i+3);
    // bazı fotoğrafları bilerek soluk/koyu yap: düzenleme denemek için
    if(i%4===1){const x=c.getContext('2d');x.globalCompositeOperation='source-over';x.fillStyle='rgba(120,120,128,.38)';x.fillRect(0,0,c.width,c.height)}
    if(i%4===3){const x=c.getContext('2d');x.fillStyle='rgba(0,0,10,.42)';x.fillRect(0,0,c.width,c.height)}
    const blob=await canvasBlob(c,'image/jpeg',.9);
    const day=Math.floor(i/4);
    const r=await addBlob(blob,names[i],now-day*86400000*38-i*3600000,{tags:i%3===0?['manzara']:i%3===1?['doğa']:['seyahat']});
    if(r)n++;
  }
  render();toast(`${n} demo fotoğraf eklendi`);return n;
}

/* ---------- filtre / sıralama ---------- */
function visible(){
  let a=P.slice();
  const v=UI.view;
  if(v==='star')a=a.filter(r=>r.star);
  else if(v.startsWith('al:'))a=a.filter(r=>r.albums.includes(v.slice(3)));
  else if(v.startsWith('tg:'))a=a.filter(r=>r.tags.includes(v.slice(3)));
  else if(v.startsWith('mo:'))a=a.filter(r=>monthKey(r)===v.slice(3));
  else if(v==='edited')a=a.filter(r=>r.edited);
  const q=UI.q.trim().toLowerCase();
  if(q)a=a.filter(r=>r.name.toLowerCase().includes(q)||r.tags.some(t=>t.toLowerCase().includes(q)));
  const s=UI.sort;
  if(s==='date-d')a.sort((p,q)=>q.taken-p.taken);
  else if(s==='date-a')a.sort((p,q)=>p.taken-q.taken);
  else if(s==='name')a.sort((p,q)=>p.name.localeCompare(q.name,'tr'));
  else a.sort((p,q)=>q.added-p.added);
  return a;
}
function monthKey(r){const d=new Date(r.taken);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}

const NUM=['bright','contrast','sat','temp','fill','hi','sh','sepia','bw','vig','grain','sharp','soft','glow','fade','invert'];
function defP(){const p={rot:0,fh:false,angle:0,crop:null,lv:null,gain:null,tint:null,fx:null};NUM.forEach(k=>p[k]=0);return p}
const FX={
  'Sepya':{sepia:100,contrast:8},
  'Siyah-Beyaz':{bw:100,contrast:12},
  'Sıcak':{temp:40,sat:14,fill:10},
  'Soğuk':{temp:-40,sat:8},
  'Canlı':{sat:50,contrast:14},
  'Solgun':{fade:45,sat:-20,contrast:-8},
  'Film':{fade:20,grain:40,sat:-10,contrast:10,vig:30,temp:12},
  'Eski Foto':{sepia:70,fade:35,grain:50,vig:55,contrast:-6},
  'Yumuşak':{soft:70,bright:6},
  'Işıltı':{glow:80,sat:14},
  'Vinyet':{vig:75},
  'Dramatik':{contrast:38,sh:-30,hi:-20,sat:12,vig:35},

};
function mergeP(p){
  const m=Object.assign({},p);
  if(p.fx&&FX[p.fx.name]){
    const k=p.fx.amt/100,f=FX[p.fx.name];
    for(const key of Object.keys(f)){if(key==='tint'){const t=f.tint;m.tint=[t[0],t[1],t[2],t[3]*k]}else m[key]=(m[key]||0)+f[key]*k}
  }
  return m;
}
// geometri: döndür, çevir, düzelt, kırp
function geom(img,p,maxd,noCrop){
  let sw=img.width,sh=img.height;
  const odd=p.rot%2!==0;
  let w=odd?sh:sw,h=odd?sw:sh;
  const k=Math.min(1,maxd/Math.max(w,h));
  const cw=Math.max(1,Math.round(w*k)),ch=Math.max(1,Math.round(h*k));
  const c=mkCanvas(cw,ch),x=c.getContext('2d');
  x.imageSmoothingQuality='high';
  x.translate(cw/2,ch/2);
  const a=p.angle*Math.PI/180;
  let s=1;
  if(a){const ca=Math.abs(Math.cos(a)),sa=Math.abs(Math.sin(a));s=ca+sa*Math.max(cw/ch,ch/cw)}
  x.rotate(a);x.scale(s,s);
  x.rotate(p.rot*Math.PI/2);
  if(p.fh)x.scale(-1,1);
  const dw=sw*k,dh=sh*k;
  x.drawImage(img,-dw/2,-dh/2,dw,dh);
  if(p.crop&&!noCrop){
    const cr=p.crop,sx=Math.round(cr.x*cw),sy=Math.round(cr.y*ch),ww=Math.max(1,Math.round(cr.w*cw)),hh=Math.max(1,Math.round(cr.h*ch));
    const c2=mkCanvas(ww,hh);c2.getContext('2d').drawImage(c,sx,sy,ww,hh,0,0,ww,hh);return c2;
  }
  return c;
}
function adjust(c,p0){
  const p=mergeP(p0);
  const w=c.width,h=c.height,x=c.getContext('2d');
  const needPix=p.bright||p.contrast||p.sat||p.temp||p.fill||p.hi||p.sh||p.sepia||p.bw||p.vig||p.grain||p.fade||p.invert||p.lv||p.gain||p.tint;
  if(needPix){
    const id=x.getImageData(0,0,w,h),d=id.data;
    const lo=p.lv?p.lv[0]:0,hiL=p.lv?p.lv[1]:255,lr=255/Math.max(8,hiL-lo);
    const g=p.gain||[1,1,1];
    const tmp=p.temp*.32,br=p.bright*1.6,ct=1+p.contrast/100,sa=1+p.sat/100;
    const fill=p.fill/100,hiA=p.hi/100,shA=p.sh/100,sep=p.sepia/100,bw=p.bw/100,fade=p.fade/100,inv=p.invert/100;
    const tn=p.tint,tA=tn?tn[3]:0;
    const vig=p.vig/100,grain=p.grain*.9;
    const cx=w/2,cy=h/2,rmax=Math.sqrt(cx*cx+cy*cy);
    let seed=12345;
    for(let i=0,px=0;i<d.length;i+=4,px++){
      let r=d[i],gg=d[i+1],b=d[i+2];
      if(p.lv){r=(r-lo)*lr;gg=(gg-lo)*lr;b=(b-lo)*lr}
      if(p.gain){r*=g[0];gg*=g[1];b*=g[2]}
      if(tmp){r+=tmp;b-=tmp}
      if(fill||hiA||shA){
        const l=(.299*r+.587*gg+.114*b)/255;
        const dk=(1-l)*(1-l),br2=l*l;
        const add=(fill*.55*dk+shA*.5*dk*(l<.6?1:0)-hiA*.5*br2)*255;
        r+=add;gg+=add;b+=add;
      }
      if(br){r+=br;gg+=br;b+=br}
      if(ct!==1){r=(r-128)*ct+128;gg=(gg-128)*ct+128;b=(b-128)*ct+128}
      if(sa!==1){const l=.299*r+.587*gg+.114*b;r=l+(r-l)*sa;gg=l+(gg-l)*sa;b=l+(b-l)*sa}
      if(sep){const l=.299*r+.587*gg+.114*b;const sr=l*1.07+14,sg=l*.9+6,sb=l*.66;r+=(sr-r)*sep;gg+=(sg-gg)*sep;b+=(sb-b)*sep}

      if(tA){r+=(tn[0]-r)*tA*.6;gg+=(tn[1]-gg)*tA*.6;b+=(tn[2]-b)*tA*.6}
      if(fade){r=r*(1-fade*.5)+fade*52;gg=gg*(1-fade*.5)+fade*52;b=b*(1-fade*.5)+fade*56}
      if(vig){const X=px%w-cx,Y=(px/w|0)-cy;const t=Math.sqrt(X*X+Y*Y)/rmax;const f=1-vig*Math.max(0,t-.35)*1.55;r*=f;gg*=f;b*=f}

      if(inv){r+=(255-2*r)*inv;gg+=(255-2*gg)*inv;b+=(255-2*b)*inv}
      d[i]=r<0?0:r>255?255:r;d[i+1]=gg<0?0:gg>255?255:gg;d[i+2]=b<0?0:b>255?255:b;
    }
    x.putImageData(id,0,0);
  }
  if(p.soft||p.glow){
    const sm=mkCanvas(Math.max(4,w/10),Math.max(4,h/10)),sx=sm.getContext('2d');
    sx.imageSmoothingQuality='high';sx.drawImage(c,0,0,sm.width,sm.height);
    const big=mkCanvas(w,h),bx=big.getContext('2d');bx.imageSmoothingQuality='high';bx.drawImage(sm,0,0,w,h);
    if(p.soft){x.globalAlpha=clamp(p.soft/100*.75,0,.85);x.drawImage(big,0,0);x.globalAlpha=1}

  }

    const id=x.getImageData(0,0,w,h),s=id.data,o=new Uint8ClampedArray(s),amt=p.sharp/100*1.1;

      const i=(y*w+xx)*4;
      for(let ch=0;ch<3;ch++){
        const v=s[i+ch],bl=(s[i+ch-4]+s[i+ch+4]+s[i+ch-w*4]+s[i+ch+w*4])*.25;

}

function analyze(img){
  const k=Math.min(1,200/Math.max(img.width,img.height)),c=mkCanvas(img.width*k,img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;
  const hist=new Uint32Array(256);let sr=0,sg=0,sb=0,n=d.length/4;
  for(let i=0;i<d.length;i+=4){hist[Math.round(.299*d[i]+.587*d[i+1]+.114*d[i+2])]++;sr+=d[i];sg+=d[i+1];sb+=d[i+2]}
  let a=0,lo=0,hi=255;const t=n*.01;
  for(let i=0;i<256;i++){a+=hist[i];if(a>=t){lo=i;break}}
  a=0;for(let i=255;i>=0;i--){a+=hist[i];if(a>=t){hi=i;break}}
  const mr=sr/n,mg=sg/n,mb=sb/n,m=(mr+mg+mb)/3;
  const gain=[clamp(m/mr,.8,1.25),clamp(m/mg,.8,1.25),clamp(m/mb,.8,1.25)];
  return {lo,hi,gain,hist};
}

function showCrop(){
  const cr=$('crop');cr.hidden=false;
  if(!ED.box){
    const c=ED.p.crop;ED.box=c?{x:c.x,y:c.y,w:c.w,h:c.h}:{x:.1,y:.1,w:.8,h:.8};
  }

  placeBox();
  const box=cr.querySelector('.box');
  const cvr=()=>$('cv').getBoundingClientRect();
  let drag=null;
  const down=e=>{
    const d=e.target.dataset&&e.target.dataset.d||(e.target===box?'move':null);if(!d)return;
    e.preventDefault();const r=cvr();
    drag={d,sx:e.clientX,sy:e.clientY,b:{...ED.box},r};
    (e.target).setPointerCapture&&e.target.setPointerCapture(e.pointerId);
  };
  const move=e=>{
    if(!drag)return;
    const dx=(e.clientX-drag.sx)/drag.r.width,dy=(e.clientY-drag.sy)/drag.r.height;
    let {x,y,w,h}=drag.b;const d=drag.d;
    if(d==='move'){x=clamp(x+dx,0,1-w);y=clamp(y+dy,0,1-h)}
    else{
      let x2=x+w,y2=y+h;
      if(d.includes('w'))x=clamp(x+dx,0,x2-.04);
      if(d.includes('e'))x2=clamp(x2+dx,x+.04,1);
      if(d.includes('n'))y=clamp(y+dy,0,y2-.04);
      if(d.includes('s'))y2=clamp(y2+dy,y+.04,1);
      w=x2-x;h=y2-y;
      if(ED.aspect){
        const cv=$('cv');let ar=ED.aspect===-1?cv.width/cv.height:ED.aspect;
        const ratio=ar*(drag.r.height/drag.r.width); // w/h in normalized units
        if(d==='n'||d==='s'){const nw=h*ratio;const cx=x+w/2;w=clamp(nw,.04,1);x=clamp(cx-w/2,0,1-w)}
        else{const nh=w/ratio;if(d.includes('n'))y=y2-nh;h=nh;if(y<0){y=0;h=y2-y;w=h*ratio}if(y+h>1){h=1-y;w=h*ratio}}
        if(d.includes('w'))x=x2-w;
      }
    }
    ED.box={x,y,w,h};placeBox();
  };
  const up=()=>{drag=null};
  cr.onpointerdown=down;cr.onpointermove=move;cr.onpointerup=up;cr.onpointercancel=up;
}

  mix:{n:'Karışık',cells:()=>[[0,0,.4,.6],[.4,0,.6,.35],[.4,.35,.3,.65],[.7,.35,.3,.65],[0,.6,.4,.4]]}
};
function grid(c,r){const a=[];for(let y=0;y<r;y++)for(let x=0;x<c;x++)a.push([x/c,y/r,1/c,1/r]);return a}
function layIcon(k){const cells=LAYOUTS[k].cells();return `<svg viewBox="0 0 40 40">${cells.map(([x,y,w,h])=>`<rect x="${x*36+2+.6}" y="${y*36+2+.6}" width="${w*36-1.2}" height="${h*36-1.2}" rx="1.5" fill="currentColor" opacity=".7"/>`).join('')}</svg>`}
async function openCollage(recs){
  if(!recs.length){toast('Önce fotoğraf seç');return}
  CL.recs=recs.slice(0,12);CL.bmps=[];
  for(const r of CL.recs){try{CL.bmps.push(await loadBmp(r.blob))}catch(e){}}
  $('col').hidden=false;buildColPanel();drawCollage();
}
function buildColPanel(){
  const s=$('colSide');
  s.innerHTML=`<div class="ph">Yerleşim</div><div class="lay">${Object.keys(LAYOUTS).map(k=>`<button data-l="${k}" class="${CL.layout===k?'on':''}" title="${LAYOUTS[k].n}" aria-label="${LAYOUTS[k].n}" style="color:var(--ac)">${layIcon(k)}</button>`).join('')}</div>
  <div class="row"><label>Boşluk<b data-cv="gap">${CL.gap}</b></label><input type="range" data-c="gap" min="0" max="60" value="${CL.gap}"></div>
  <div class="row"><label>Köşe yuvarlama<b data-cv="round">${CL.round}</b></label><input type="range" data-c="round" min="0" max="80" value="${CL.round}"></div>
  <div class="row"><label>Arka plan</label><input type="color" data-c="bg" value="${CL.bg}" style="width:100%;height:34px;background:none;border:1px solid var(--line);border-radius:7px"></div>
  <div class="row"><label>Fotoğraflar (${CL.recs.length})</label><div style="color:var(--mu);font-size:12px">Yerleşimdeki hücre sayısından fazla fotoğraf kullanılmaz; eksikse fotoğraflar tekrar eder.</div></div>
  <button class="btn" data-c="shuf" style="width:100%">🔀 Karıştır</button>`;
}
function drawCollage(){
  if(!CL.bmps||!CL.bmps.length)return;
  const cells=LAYOUTS[CL.layout].cells();
  const W=CL.size,H=Math.round(CL.size*.75);
  const c=$('colCv');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle=CL.bg;x.fillRect(0,0,W,H);
  const g=CL.gap*(W/1200),m=g;
  cells.forEach((cell,i)=>{
    const img=CL.bmps[i%CL.bmps.length];
    const cx=m+cell[0]*(W-2*m)+(cell[0]>0?g/2:0),cy=m+cell[1]*(H-2*m)+(cell[1]>0?g/2:0);
    const cw=cell[2]*(W-2*m)-((cell[0]>0?g/2:0)+(cell[0]+cell[2]<.999?g/2:0)),ch=cell[3]*(H-2*m)-((cell[1]>0?g/2:0)+(cell[1]+cell[3]<.999?g/2:0));
    x.save();
    const rr=CL.round*(W/1200);
    x.beginPath();if(x.roundRect)x.roundRect(cx,cy,cw,ch,rr);else x.rect(cx,cy,cw,ch);x.clip();
    const s=Math.max(cw/img.width,ch/img.height),dw=img.width*s,dh=img.height*s;
    x.drawImage(img,cx+(cw-dw)/2,cy+(ch-dh)/2,dw,dh);
    x.restore();
  });
}

/* ---------- olaylar ---------- */
function bind(){
  $('bImp').onclick=()=>$('fIn').click();
  $('bDir').onclick=()=>$('fDir').click();
  $('bDemo').onclick=addDemos;
  $('fIn').onchange=e=>{importFiles(e.target.files);e.target.value=''};
  $('fDir').onchange=e=>{importFiles(e.target.files);e.target.value=''};
  $('q').oninput=e=>{UI.q=e.target.value;render()};
  $('sort').onchange=e=>{UI.sort=e.target.value;saveUI();render()};
  $('sort').value=UI.sort;
  $('size').value=UI.size;
  $('size').oninput=e=>{UI.size=+e.target.value;saveUI();$('lib').style.setProperty('--ts',UI.size+'px')};
  $('menuBtn').onclick=()=>$('side').classList.toggle('open');
  $('bSlide').onclick=()=>startSlide(SEL.size?selRecs():VIS);
  $('bCol').onclick=()=>openCollage(SEL.size?selRecs():VIS.slice(0,4));
  $('side').onclick=e=>{
    if(e.target.closest('#newAl')){ask('Yeni albüm adı','Albüm adı',n=>{newAlbum(n);render()});return}
    const b=e.target.closest('.si');if(!b)return;UI.view=b.dataset.v;SEL.clear();$('side').classList.remove('open');render();
  };
  $('lib').onclick=e=>{
    const a=e.target.closest('[data-a]');
    if(a){({imp:()=>$('fIn').click(),dir:()=>$('fDir').click(),demo:addDemos})[a.dataset.a]();return}
    const th=e.target.closest('.th');
    if(!th){if(!e.target.closest('button')){SEL.clear();render()}return}
    const id=th.dataset.id,i=+th.dataset.i;
    if(e.target.closest('[data-st]')){const r=P.find(x=>x.id===id);r.star=!r.star;idbPut(r);render();return}
    toggleSel(id,e.shiftKey?'range':(e.ctrlKey||e.metaKey)?'toggle':'one',i);
    render();
  };
  $('lib').ondblclick=e=>{const th=e.target.closest('.th');if(th)openEditor(th.dataset.id)};
  $('lib').onkeydown=e=>{const th=e.target.closest&&e.target.closest('.th');if(th&&(e.key==='Enter')){openEditor(th.dataset.id)}};
  $('tray').onclick=e=>{
    const b=e.target.closest('[data-t]');if(!b)return;
    ({open:()=>{const f=selRecs()[0];f&&openEditor(f.id)},star:actStar,tag:actTag,album:actAlbum,unalbum:actUnalbum,dl:actDl,col:()=>openCollage(selRecs()),slide:()=>startSlide(selRecs()),del:actDel,none:()=>{SEL.clear();render()}})[b.dataset.t]();
  };
  // sürükle bırak
  let dc=0;const lib=$('lib');
  window.addEventListener('dragenter',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){dc++;if(!lib.querySelector('.drop')){const d=document.createElement('div');d.className='drop';d.textContent='Fotoğrafları bırak';lib.appendChild(d)}}});
  window.addEventListener('dragleave',()=>{dc=Math.max(0,dc-1);if(!dc){const d=lib.querySelector('.drop');d&&d.remove()}});
  window.addEventListener('dragover',e=>e.preventDefault());
  window.addEventListener('drop',e=>{e.preventDefault();dc=0;const d=lib.querySelector('.drop');d&&d.remove();if(e.dataTransfer&&e.dataTransfer.files.length)importFiles(e.dataTransfer.files)});
  // düzenleyici
  $('edBack').onclick=closeEditor;
  $('edUndo').onclick=undo;$('edRedo').onclick=redo;
  $('edSaveC').onclick=()=>saveEdit('copy');$('edSaveO').onclick=()=>saveEdit('over');
  $('edDl').onclick=async()=>{const c=renderEdit(ED.img,ED.p,4096,false);dlBlob(await canvasBlob(c,'image/jpeg',.92),ED.rec.name+'.jpg')};
  const cmpOn=e=>{e.preventDefault();ED.cmp=true;drawNow()},cmpOff=()=>{if(ED.cmp){ED.cmp=false;drawNow()}};
  $('edCmp').addEventListener('pointerdown',cmpOn);window.addEventListener('pointerup',cmpOff);
  $('navL').onclick=()=>gotoPhoto(-1);$('navR').onclick=()=>gotoPhoto(1);
  $('film').onclick=e=>{const i=e.target.closest('img');if(i)openEditor(ED.list[+i.dataset.i].id)};
  $('tabs').onclick=e=>{const b=e.target.closest('button');if(b)setTab(b.dataset.t)};
  const tp=$('tp');
  tp.addEventListener('input',e=>{
    const i=e.target.closest('input[data-k]');if(!i)return;
    const k=i.dataset.k,v=+i.value;
    if(k==='fxamt'){if(ED.p.fx)ED.p.fx.amt=v}else ED.p[k]=v;
    const b=tp.querySelector(`b[data-v="${k}"]`);if(b)b.textContent=v;
    draw();
  });
  tp.addEventListener('change',e=>{if(e.target.closest('input[data-k]'))pushHist()});
  tp.addEventListener('click',e=>{
    const q=e.target.closest('[data-q]');if(q){quick(q.dataset.q);return}
    const a=e.target.closest('[data-asp]');if(a){setAspect(+a.dataset.asp);return}
    const f=e.target.closest('[data-fx]');
    if(f){const n=f.dataset.fx;ED.p.fx=n?{name:n,amt:100}:null;pushHist();syncUI();buildPanel();draw()}
  });
  // slayt
  $('ssX').onclick=endSlide;$('ssNext').onclick=()=>{showSlide(SS.i+1);schedSlide()};$('ssPrev').onclick=()=>{showSlide(SS.i-1);schedSlide()};
  $('ssPlay').onclick=()=>{SS.play=!SS.play;$('ssPlay').textContent=SS.play?'⏸':'▶';schedSlide()};
  $('ssSpd').onchange=schedSlide;
  $('ssFs').onclick=()=>{const e=$('ss');if(document.fullscreenElement)document.exitFullscreen();else e.requestFullscreen&&e.requestFullscreen().catch(()=>{})};
  // kolaj
  $('colBack').onclick=()=>{$('col').hidden=true};
  $('colSide').addEventListener('click',e=>{
    const l=e.target.closest('[data-l]');if(l){CL.layout=l.dataset.l;buildColPanel();drawCollage();return}
    if(e.target.closest('[data-c="shuf"]')){CL.bmps.sort(()=>Math.random()-.5);drawCollage()}
  });
  $('colSide').addEventListener('input',e=>{
    const i=e.target.closest('input[data-c]');if(!i)return;
    const k=i.dataset.c;CL[k]=k==='bg'?i.value:+i.value;
    const b=$('colSide').querySelector(`b[data-cv="${k}"]`);if(b)b.textContent=i.value;
    drawCollage();
  });
  $('colDl').onclick=async()=>dlBlob(await canvasBlob($('colCv'),'image/png'),'kolaj.png');
  $('colSave').onclick=async()=>{const b=await canvasBlob($('colCv'),'image/jpeg',.92);const r=await addBlob(b,'Kolaj '+new Date().toLocaleDateString('tr-TR'),Date.now(),{edited:true});if(r){render();toast('Kolaj albüme kaydedildi')}};
  // klavye
  window.addEventListener('keydown',e=>{
    const tgt=e.target;if(tgt&&(tgt.tagName==='INPUT'&&tgt.type!=='range'||tgt.tagName==='SELECT'))return;
    if(!$('dlg').hidden){if(e.key==='Escape'){$('dlg').hidden=true}return}
    if(!$('ss').hidden){
      if(e.key==='Escape')endSlide();else if(e.key==='ArrowRight'){showSlide(SS.i+1);schedSlide()}else if(e.key==='ArrowLeft'){showSlide(SS.i-1);schedSlide()}else if(e.key===' '){e.preventDefault();$('ssPlay').click()}
      return;
    }
    if(!$('col').hidden){if(e.key==='Escape')$('col').hidden=true;return}
    if(!$('ed').hidden){
      if(e.key==='Escape'){if(ED.cropOpen){ED.cropOpen=false;ED.box=null;buildPanel();draw()}else closeEditor()}
      else if(e.key==='ArrowLeft'&&tgt.tagName!=='INPUT')gotoPhoto(-1);
      else if(e.key==='ArrowRight'&&tgt.tagName!=='INPUT')gotoPhoto(1);
      else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}
      else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}
      return;
    }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){e.preventDefault();VIS.forEach(r=>SEL.add(r.id));render()}
    else if(e.key==='Delete'&&SEL.size)actDel();
    else if(e.key==='Escape'){SEL.clear();render()}
  });
  window.addEventListener('resize',()=>{if(!$('ed').hidden)draw()});
}

async function init(){
  bind();
  await idbReady;
  P=await idbAll();
  P.forEach(r=>{if(!r.tags)r.tags=[];if(!r.albums)r.albums=[];r.tv=r.tv||1});
  render();
}
window.__fa={get P(){return P},get UI(){return UI},get ED(){return ED},get SEL(){return SEL},addDemos,importFiles,addBlob,openEditor,closeEditor,quick,draw:drawNow,renderEdit,defP,FX,startSlide,endSlide,openCollage,drawCollage,CL,render,visible,saveEdit,setTab,SS,idbAll,analyze,loadBmp,drawScene,get META(){return META}};
init();
})();
