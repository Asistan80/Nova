<!DOCTYPE html>

<script>
"use strict";
/* ============ Kayıp Kaset — found footage korku (raycaster) ============ */
const cv = document.getElementById("c"), g = cv.getContext("2d");
const RW = 480, RH = 270; const rc = document.createElement("canvas"); rc.width = RW; rc.height = RH; const r = rc.getContext("2d");
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;

const SET = Object.assign({ vol: 0.8, scare: 1, sens: 1 }, store.get("kk_set", {})); const BEST = store.get("kk_best", {});

const WORDS = "ABCDEFGHJKLMNPRSTUVYZ23456789"; function randCode() { let s = ""; for (let i = 0; i < 5; i++) s += WORDS[Math.floor(Math.random() * WORDS.length)]; return s; }

/* ------------------------------------------------ hikâye */
const TAPES = [
  ["KASET 1 · 14 EKİM", "Belgesel ekibi Sarıdere Sanatoryumu'na vardı. Dört kişiyiz: ben, Selim, Derya ve ses mühendisi Orhan. Kapı zincirliydi ama kilit içeriden açılmış gibi duruyordu."],

  ["KASET 3 · 15 EKİM", "Selim sabah odasında yoktu. Yatağın üstünde kaset kutusu vardı, içinde kendi sesi: 'Kameraya bakmayı bırakmayın. Bakmadığınız an yaklaşıyor.'"],
  ["KASET 4 · 15 EKİM, AKŞAM", "Flaşın ışığında ilk kez gördük: uzun, ince, yüzü yok. Flaş patlayınca dondu. Derya koşarak merdivene gitti. Pil kalmadı. Orhan sayıyor."],
  ["KASET 5 · 16 EKİM", "Arşiv odasında 1974 tarihli bir rapor: 'Hasta 14 hiç uyumuyor. Karşısında kamera varsa hareket etmiyor.' Hasta 14'ün fotoğrafı yok. Yalnızca bir kasetin etiketi."],
  ["KASET 6 · SON KAYIT", "Çıkış kapısını buldum. Hepsini bulduğumda açılıyormuş. Arkadaşlar… Orhan'ın sayısı bitti. Kamerayı bıraktım. Kim bulursa: kapıdan çık ve geriye bakma."],
];
const ENDING = ["Kapı açıldı ve soğuk gece havası yüzüne çarptı.", "Kasetleri izlerken fark ettin: kameranın arkasında hiç kimsenin yüzünü görmemiştin.", "Çünkü sen de ekibin bir parçasıydın. Hasta 14, kamerayı elinden bırakmadığın sürece hareket etmeyen şeydi.", "Kapıdan çıkarken kamera yerde kayıt almaya devam etti. Sayaç: bir… iki… üç…"];

/* ------------------------------------------------ ses */
const A = { ctx: null }; let hbT = 0;

  const nb = A.ctx.createBuffer(1, A.ctx.sampleRate * 2, A.ctx.sampleRate), d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; A.nb = nb;
  A.drone = A.ctx.createOscillator(); A.drone.type = "sawtooth"; A.drone.frequency.value = 42; const dg = A.ctx.createGain(); dg.gain.value = 0.05; const df = A.ctx.createBiquadFilter(); df.type = "lowpass"; df.frequency.value = 120; A.drone.connect(df); df.connect(dg); dg.connect(A.master); A.drone.start(); A.dg = dg;

/* ------------------------------------------------ harita */
const N = 18, GW = N * 2 + 1;
let M = [], S = { screen: "menu" };
function newGame(code) {
  code = (code || randCode()).toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8) || randCode(); const R = mulberry(hashSeed(code)); audioInit();
  M = []; for (let y = 0; y < GW; y++) { M.push([]); for (let x = 0; x < GW; x++) M[y].push(1); }
  const vis = []; for (let y = 0; y < N; y++) { vis.push(Array(N).fill(false)); }
  const stack = [[0, 0]]; vis[0][0] = true; M[1][1] = 0;
  while (stack.length) { const [cx, cy] = stack[stack.length - 1]; const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(d => [cx + d[0], cy + d[1], d]).filter(n => n[0] >= 0 && n[1] >= 0 && n[0] < N && n[1] < N && !vis[n[1]][n[0]]);
    if (!nb.length) { stack.pop(); continue; } const [nx, ny, d] = nb[Math.floor(R() * nb.length)]; vis[ny][nx] = true; M[ny * 2 + 1][nx * 2 + 1] = 0; M[cy * 2 + 1 + d[1]][cx * 2 + 1 + d[0]] = 0; stack.push([nx, ny]); }
  for (let i = 0; i < 40; i++) { const x = 1 + Math.floor(R() * (GW - 2)), y = 1 + Math.floor(R() * (GW - 2)); if ((x % 2) !== (y % 2)) M[y][x] = 0; }
  for (let i = 0; i < 8; i++) { const cx = 3 + 2 * Math.floor(R() * (N - 3)), cy = 3 + 2 * Math.floor(R() * (N - 3)); for (let y = cy - 1; y <= cy + 1; y++) for (let x = cx - 1; x <= cx + 1; x++) M[y][x] = 0; }
  for (let y = 0; y < GW; y++) for (let x = 0; x < GW; x++) if (M[y][x] === 1) M[y][x] = (((x >> 3) + (y >> 3)) % 2) ? 2 : 1;
  const dist = bfs(1, 1); let far = [1, 1], fd = 0; for (let y = 0; y < GW; y++) for (let x = 0; x < GW; x++) if (M[y][x] === 0 && dist[y][x] < 9999 && dist[y][x] > fd) { fd = dist[y][x]; far = [x, y]; }
  // çıkış: en uzak hücrenin yanındaki duvar
  let ex = null; for (const d of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const x = far[0] + d[0], y = far[1] + d[1]; if (x > 0 && y > 0 && x < GW - 1 && y < GW - 1 && M[y][x] > 0) { ex = [x, y]; break; } }
  if (!ex) { ex = [far[0] + 1, far[1]]; } M[ex[1]][ex[0]] = 3;
  const cells = []; for (let y = 0; y < GW; y++) for (let x = 0; x < GW; x++) if (M[y][x] === 0 && dist[y][x] >= 8 && !(x === far[0] && y === far[1])) cells.push([x, y]);
  const pick = (n, minSep, list) => { const out = []; let tries = 0; while (out.length < n && tries++ < 4000) { const c = cells[Math.floor(R() * cells.length)]; if (out.every(o => Math.hypot(o[0] - c[0], o[1] - c[1]) >= minSep) && !list.some(o => Math.hypot(o[0] - c[0], o[1] - c[1]) < 2)) out.push(c); } return out; };
  const tp = pick(6, 11, []); const order = [0, 1, 2, 3, 4, 5];
  const bt = pick(9, 5, tp);
  S = { screen: "play", code, t: 0, p: { x: 1.5, y: 1.5, a: 0.4 }, fov: 1.15, keys: {}, tapes: tp.map((c, i) => ({ x: c[0] + 0.5, y: c[1] + 0.5, got: false, n: i })), bats: bt.map(c => ({ x: c[0] + 0.5, y: c[1] + 0.5, got: false })), got: 0, bat: 100, nv: false, flashT: 0, flashCd: 0, stamina: 100, en: { x: far[0] + 0.5, y: far[1] + 0.5, active: false, frozen: 0, seen: false, path: [], pt: 0, vis: 0 }, exit: ex, far, dist, msg: "", msgT: 0, shake: 0, glitch: 0, stepT: 0, bobT: 0, playing: null, paused: false, dead: false, deadT: 0, winT: 0, readT: 0, locked: false, story: [], by: "", lastSeenT: 0 };
  S.screen = "intro"; S.introT = 0; hbT = 0; say("Hepsini topla: 6 kaset. Sonra çıkışı bul.", 6);
}
function bfs(sx, sy) { const d = []; for (let y = 0; y < GW; y++) d.push(Array(GW).fill(9999)); const q = [[sx, sy]]; d[sy][sx] = 0; for (let i = 0; i < q.length; i++) { const [x, y] = q[i]; for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nx = x + dx, ny = y + dy; if (nx >= 0 && ny >= 0 && nx < GW && ny < GW && M[ny][nx] === 0 && d[ny][nx] === 9999) { d[ny][nx] = d[y][x] + 1; q.push([nx, ny]); } } } return d; }
function say(t, d = 4) { S.msg = t; S.msgT = d; }
const solid = (x, y) => { const ix = Math.floor(x), iy = Math.floor(y); return ix < 0 || iy < 0 || ix >= GW || iy >= GW || M[iy][ix] > 0; };
function los(x0, y0, x1, y1) { const d = Math.hypot(x1 - x0, y1 - y0), n = Math.ceil(d / 0.2); for (let i = 1; i < n; i++) { const t = i / n; if (solid(lerp(x0, x1, t), lerp(y0, y1, t))) return false; } return true; }

/* ------------------------------------------------ güncelleme */
function die(by) { if (S.screen !== "play") return; S.screen = "dead"; S.deadT = 0; S.by = by; S.shake = 1; SFX.scare(); try { document.exitPointerLock(); } catch (e) { } }
function win() { S.screen = "win"; S.winT = 0; SFX.win(); const sc = Math.max(0, Math.round(1200 - S.t)) + Math.round(S.bat); if (BEST[S.code] == null || sc > BEST[S.code]) { BEST[S.code] = sc; store.set("kk_best", BEST); S.newBest = true; } else S.newBest = false; S.score = sc; try { document.exitPointerLock(); } catch (e) { } }
function move(dx, dy) { const rad = 0.24, p = S.p; if (!solid(p.x + dx + Math.sign(dx) * rad, p.y)) p.x += dx; if (!solid(p.x, p.y + dy + Math.sign(dy) * rad)) p.y += dy; }
function update(dt) {
  if (S.screen === "intro") { S.introT += dt; return; }
  if (S.screen === "dead") { S.deadT += dt; S.shake = Math.max(0, S.shake - dt * 0.5); return; }
  if (S.screen === "win") { S.winT += dt; return; }
  if (S.screen !== "play" || S.paused) return;
  if (S.playing) { S.playing.t += dt; return; }
  const p = S.p, K = S.keys; S.t += dt; S.msgT = Math.max(0, S.msgT - dt); S.shake = Math.max(0, S.shake - dt * 2); S.flashT = Math.max(0, S.flashT - dt); S.flashCd = Math.max(0, S.flashCd - dt); S.glitch = Math.max(0, S.glitch - dt * 1.5);

  let f = (K["w"] || K["arrowup"] ? 1 : 0) - (K["s"] || K["arrowdown"] ? 1 : 0), sd = (K["d"] ? 1 : 0) - (K["a"] ? 1 : 0);
  const sprint = K["shift"] && S.stamina > 5 && (f || sd); S.stamina = sprint ? Math.max(0, S.stamina - 22 * dt) : Math.min(100, S.stamina + 14 * dt);
  const sp = (sprint ? 3.7 : 2.3) * dt, l = Math.hypot(f, sd) || 1; const ca = Math.cos(p.a), sa = Math.sin(p.a);
  if (f || sd) { move((ca * f - sa * sd) / l * sp, (sa * f + ca * sd) / l * sp); S.stepT -= dt; S.bobT += dt * (sprint ? 12 : 8); if (S.stepT <= 0) { SFX.step(); S.stepT = sprint ? 0.28 : 0.45; } }
  // pil
  S.bat = Math.max(0, S.bat - (0.35 + (S.nv ? 1.3 : 0)) * dt); if (S.bat <= 0 && S.nv) S.nv = false; if (S.bat <= 0 && !S.batWarn) { S.batWarn = true; say("Pil bitti! Görüş daraldı.", 5); }
  if (S.bat > 0) S.batWarn = false;
  // eşyalar
  for (const t of S.tapes) if (!t.got && Math.hypot(t.x - p.x, t.y - p.y) < 0.7) { t.got = true; S.got++; SFX.pick(); S.playing = { n: t.n, t: 0 }; if (S.got === 1) S.en.active = true; return; }
  for (const b of S.bats) if (!b.got && Math.hypot(b.x - p.x, b.y - p.y) < 0.6) { b.got = true; S.bat = Math.min(100, S.bat + 35); SFX.bat(); say("Pil bulundu (+35).", 2.5); }
  // çıkış
  const ex = S.exit; if (Math.hypot(ex[0] + 0.5 - p.x, ex[1] + 0.5 - p.y) < 1.15) { if (S.got >= 6) { win(); return; } else if (S.msgT < 1) { say("Çıkış kilitli. " + (6 - S.got) + " kaset daha gerek.", 3); SFX.locked(); } }
  // yaratık
  const en = S.en; if (S.t > 25 && S.got === 0) en.active = true;
  if (en.active) {
    const dx = en.x - p.x, dy = en.y - p.y, d = Math.hypot(dx, dy); let ang = Math.atan2(dy, dx) - (p.a + Math.PI); ang = Math.atan2(Math.sin(ang), Math.cos(ang)); // kamera yönüne göre
    const inView = Math.abs(ang) < S.fov / 2 + 0.08 && d < 13 && los(p.x, p.y, en.x, en.y); en.seen = inView; if (inView) { en.vis += dt; S.lastSeenT = S.t; S.glitch = Math.max(S.glitch, 0.35 + Math.max(0, 1 - d / 7)); } else en.vis = 0;
    if (S.flashT > 2.5 && inView) en.frozen = 4.5; en.frozen = Math.max(0, en.frozen - dt);

function flash() { if (S.flashCd > 0 || S.bat < 8 || S.screen !== "play" || S.playing) return; S.bat -= 8; S.flashT = 3; S.flashCd = 8; SFX.flash(); }

/* ------------------------------------------------ sprite & doku */
function mk(w, h, fn) { const c = document.createElement("canvas"); c.width = w; c.height = h; fn(c.getContext("2d"), w, h); return c; }

  mk(64, 64, (c, w, h) => { c.fillStyle = "#5d7568"; c.fillRect(0, 0, w, h); c.fillStyle = "#8aa396"; c.fillRect(0, 0, w, 20); for (let x = 0; x < 64; x += 16) { c.fillStyle = "#2f3f38"; c.fillRect(x, 0, 1, 64); } c.fillStyle = "#2f3f38"; c.fillRect(0, 20, w, 3); for (let i = 0; i < 220; i++) { c.fillStyle = `rgba(0,0,0,${Math.random() * 0.3})`; c.fillRect(Math.random() * 64, Math.random() * 64, 2, 3); } }),
  mk(64, 64, (c, w, h) => { c.fillStyle = "#3a1212"; c.fillRect(0, 0, w, h); c.fillStyle = "#8e1d1d"; c.fillRect(6, 6, 52, 52); c.fillStyle = "#e8d9b0"; c.font = "bold 14px sans-serif"; c.textAlign = "center"; c.fillText("ÇIKIŞ", 32, 30); c.fillRect(14, 38, 36, 4); c.fillRect(28, 38, 8, 12); })];
const SPR = { en: mk(64, 128, (c, w, h) => { c.fillStyle = "#050505"; c.beginPath(); c.ellipse(32, 20, 12, 15, 0, 0, 7); c.fill(); c.fillRect(27, 32, 10, 50); c.fillRect(14, 36, 36, 6); c.fillRect(14, 36, 5, 62); c.fillRect(45, 36, 5, 62); c.fillRect(26, 82, 5, 44); c.fillRect(34, 82, 5, 44); c.fillStyle = "#ddd"; c.beginPath(); c.ellipse(32, 20, 8, 11, 0, 0, 7); c.fill(); c.fillStyle = "#000"; c.fillRect(27, 15, 3, 7); c.fillRect(35, 15, 3, 7); c.fillRect(30, 28, 5, 6); }),
  tape: mk(32, 32, (c) => { c.fillStyle = "#222"; c.fillRect(2, 8, 28, 18); c.fillStyle = "#e8d9b0"; c.fillRect(6, 11, 20, 8); c.fillStyle = "#000"; c.beginPath(); c.arc(11, 15, 3, 0, 7); c.arc(21, 15, 3, 0, 7); c.fill(); c.fillStyle = "#d33"; c.fillRect(6, 21, 20, 2); }),
  bat: mk(24, 32, (c) => { c.fillStyle = "#222"; c.fillRect(4, 6, 16, 22); c.fillStyle = "#4c4"; c.fillRect(6, 10, 12, 14); c.fillStyle = "#ccc"; c.fillRect(9, 2, 6, 4); }) };

/* ------------------------------------------------ çizim */
const zb = new Float32Array(RW);
function render3D() {
  const p = S.p, nv = S.nv && S.bat > 0, vis = S.bat <= 0 ? 2.4 : (nv ? 10 : 5.8) + (S.flashT > 0 ? 6 : 0);
  const sky = r.createLinearGradient(0, 0, 0, RH / 2); sky.addColorStop(0, "#050505"); sky.addColorStop(1, "#14110f"); r.fillStyle = sky; r.fillRect(0, 0, RW, RH / 2);
