<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Gece Bekçisi</title>
<style>
html,body{margin:0;height:100%;background:#050507;color:#d8d2c4;font-family:system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{background:#000;max-width:100vw;max-height:100vh;box-shadow:0 0 60px #000}
</style></head><body><div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
"use strict";
/* ============================================================ GECE BEKÇİSİ
   Terk edilmiş kervansaray müzesinde 5 gece. Fener, kepenk, kameralar ve nefes. */
const W = 1280, H = 720, cv = document.getElementById("c"), g = cv.getContext("2d");
const $ = {};
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };
const rnd = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const SET = Object.assign({ vol: 0.8, scare: 1, flicker: true }, store.get("gb_set", {}));
const SAVE = Object.assign({ night: 1, done: 0, best: 0 }, store.get("gb_save", {}));

/* ------------------------------------------------------------ ses */
const A = { ctx: null, master: null, amb: null };
function audioInit() {
  if (A.ctx) { if (A.ctx.state === "suspended") A.ctx.resume(); return; }
  try {
    const C = window.AudioContext || window.webkitAudioContext; A.ctx = new C();
    A.master = A.ctx.createGain(); A.master.gain.value = SET.vol; A.master.connect(A.ctx.destination);
    const len = A.ctx.sampleRate * 2, buf = A.ctx.createBuffer(1, len, A.ctx.sampleRate), d = buf.getChannelData(0);
    let b0 = 0; for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; b0 = 0.97 * b0 + 0.03 * w; d[i] = b0 * 3; }
    A.noise = buf;
    const white = A.ctx.createBuffer(1, len, A.ctx.sampleRate), wd = white.getChannelData(0); for (let i = 0; i < len; i++) wd[i] = Math.random() * 2 - 1;
    A.white = white;
    // rüzgâr
    const s = A.ctx.createBufferSource(); s.buffer = A.noise; s.loop = true;
    const f = A.ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 380;
    const gn = A.ctx.createGain(); gn.gain.value = 0.18; s.connect(f); f.connect(gn); gn.connect(A.master); s.start();
    A.amb = { f, gn };
    const lfo = A.ctx.createOscillator(), lg = A.ctx.createGain(); lfo.frequency.value = 0.12; lg.gain.value = 140; lfo.connect(lg); lg.connect(f.frequency); lfo.start();
    // elektrik uğultusu
    const o = A.ctx.createOscillator(), og = A.ctx.createGain(); o.type = "sawtooth"; o.frequency.value = 50; og.gain.value = 0.012; o.connect(og); og.connect(A.master); o.start();
    A.hum = og;
  } catch (e) { A.ctx = null; }
}
function setVol() { if (A.master) A.master.gain.value = SET.vol; }
function tone(freq, dur, type = "sine", vol = 0.2, pan = 0, slide = 0, delay = 0) {
  if (!A.ctx) return; const t0 = A.ctx.currentTime + delay, o = A.ctx.createOscillator(), gn = A.ctx.createGain(), p = A.ctx.createStereoPanner ? A.ctx.createStereoPanner() : null;
  o.type = type; o.frequency.setValueAtTime(freq, t0); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t0 + dur);
  gn.gain.setValueAtTime(0.0001, t0); gn.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(gn); if (p) { p.pan.value = pan; gn.connect(p); p.connect(A.master); } else gn.connect(A.master); o.start(t0); o.stop(t0 + dur + 0.05);
}
function noiseBurst(dur, vol = 0.3, f0 = 800, f1 = 800, type = "bandpass", pan = 0, delay = 0, q = 1) {
  if (!A.ctx) return; const t0 = A.ctx.currentTime + delay, s = A.ctx.createBufferSource(); s.buffer = A.white;
  const f = A.ctx.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
  const gn = A.ctx.createGain(); gn.gain.setValueAtTime(vol, t0); gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  const p = A.ctx.createStereoPanner ? A.ctx.createStereoPanner() : null; s.connect(f); f.connect(gn); if (p) { p.pan.value = pan; gn.connect(p); p.connect(A.master); } else gn.connect(A.master);
  s.start(t0, Math.random()); s.stop(t0 + dur + 0.05);
}
const SFX = {
  click() { tone(900, 0.04, "square", 0.05); },
  knock(pan = 0) { for (let i = 0; i < 3; i++) { noiseBurst(0.09, 0.5, 220, 90, "lowpass", pan, i * 0.22); tone(110, 0.1, "sine", 0.3, pan, -50, i * 0.22); } },
  step(pan = 0, n = 5) { for (let i = 0; i < n; i++) { noiseBurst(0.12, 0.22 + i * 0.04, 300, 120, "lowpass", pan * (1 - i / n), i * 0.45); } },
  whisper(pan = 0) { for (let i = 0; i < 3; i++) noiseBurst(0.9, 0.16, 1800 + i * 300, 900, "bandpass", pan, i * 0.35, 6); },
  shutter() { noiseBurst(0.35, 0.3, 500, 120, "bandpass", 0.6, 0, 3); tone(80, 0.3, "square", 0.08, 0.6, -30); },
  lantern() { tone(420, 0.05, "square", 0.05, -0.6); noiseBurst(0.08, 0.08, 2000, 1000, "highpass", -0.6); },
  cam() { tone(1400, 0.06, "square", 0.04); noiseBurst(0.18, 0.1, 3000, 800, "bandpass"); },
  ring() { for (let i = 0; i < 4; i++) { tone(1450, 0.18, "sine", 0.12, 0, 0, i * 0.42); tone(1250, 0.18, "sine", 0.1, 0, 0, i * 0.42 + 0.2); } },
  chime() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 1.6, "sine", 0.13, 0, 0, i * 0.35)); },
  scare(kind) {
    const v = [0.55, 0.9, 1.0][SET.scare];
    noiseBurst(1.4, 0.9 * v, 4000, 200, "bandpass", 0, 0, 0.7); noiseBurst(1.2, 0.7 * v, 200, 60, "lowpass");
    tone(180, 1.2, "sawtooth", 0.35 * v, 0, -140); tone(540, 1.0, "sawtooth", 0.25 * v, 0, -380); tone(900, 0.8, "square", 0.12 * v, 0, -500);
  },
  blind() { noiseBurst(0.5, 0.5, 3000, 300, "bandpass"); tone(300, 0.5, "sawtooth", 0.2, -0.6, -200); },
  low() { tone(60, 2, "sine", 0.3, 0, -20); },
  tick() { tone(1800, 0.02, "square", 0.02); },
};

/* ------------------------------------------------------------ oyun durumu */
const NIGHTS = [
  null,
  { lv: [3, 0, 0, 0], msg: 0, name: "1. Gece", note: "Sadece Gölge." },
  { lv: [4, 3, 0, 0], msg: 1, name: "2. Gece", note: "Cadı kapıya geliyor." },
  { lv: [5, 4, 4, 0], msg: 2, name: "3. Gece", note: "Heykel yerinde durmaz." },
  { lv: [6, 5, 5, 4], msg: 3, name: "4. Gece", note: "Fısıltılar başlıyor." },
  { lv: [7, 6, 5, 5], msg: 4, name: "5. Gece", note: "Hepsi uyanık." },
];
const MSG = [
  ["Alo? Ben Haşim, senden önceki bekçi.", "Kervansaray müzesi gece 22:00'de kapanır. Sabah 06:00'ya kadar buradasın.", "Sol pencerede bir gölge görürsen fenerini tut (A). Gözünü alırsan çekilir.", "Gaz yağı sınırlı. Gereksiz yakma. Allah yardımcın olsun."],
  ["Dün gece iyi geçti, ha? Bu gece başka biri gelecek.", "Sağ kapıdan gelen ayak seslerini duyarsan kepenği indir (D). Cadı görünce çok geç.", "Kepenk yağ yer. Gittiğini anlayınca kaldır."],
  ["Eski bir heykel var depoda. Kimse kıpırdadığını görmemiş. Çünkü bakan olmuş.", "Kameralara bak (Boşluk). Gözünü ayırmadığın sürece ilerleyemez.", "Ofis kapısına geldiyse bir süre bakıp geri çevir."],
  ["Geceleri fısıltılar duyulur. Duyunca nefesini tut (Boşluk basılı).", "Tutmazsan sana kulak verir. Üç kere tutmazsan... Bilmiyorum, kimse anlatamadı.", "Dayan. Sabaha az kaldı."],
  ["Son gece. Hepsi uyanık.", "Eğer sabaha çıkarsan müze müdürü sana açıklama yapacak.", "Sen iyi bir bekçisin. Hep öyleydin."],
];
const G = {
  screen: "menu", night: 1, t: 0, oil: 100, view: "office", cam: 0, lan: false, shut: false, breath: false, breathBar: 100,
  paused: false, shake: 0, flash: 0, blackout: 0, msgIdx: 0, msgT: 0, msgs: [], dead: null, deadT: 0, out: false, fails: 0, custom: [5, 5, 5, 5],
  gol: { st: 0, cd: 10, t: 0, blind: 0 }, cad: { st: 0, cd: 20, t: 0 }, hey: { stage: 0, cd: 12, look: 0 }, fis: { cd: 25, win: 0, held: 0, pan: 0 },
  hour: 0, lastHour: -1, ring: 0, noise: 0, mx: 0, my: 0,
};
const HOUR = 45; // saniye/saat
function lvls() { return G.night === 6 ? G.custom : NIGHTS[G.night].lv; }
const par = lvl => ({ gap: lerp(46, 13, lvl / 10), dl: lerp(7.2, 3.3, lvl / 10) });

function startNight(n) {
  G.night = n; G.screen = "intro"; G.t = 0; G.oil = 100; G.view = "office"; G.cam = 0; G.lan = false; G.shut = false; G.breath = false; G.breathBar = 100; G.out = false; G.fails = 0; G.dead = null; G.blackout = 0; G.flash = 0; G.shake = 0;
  const L = lvls(), P = i => par(L[i]);
  G.gol = { st: 0, cd: L[0] ? rnd(P(0).gap * 0.5, P(0).gap) : 1e9, t: 0, blind: 0 };
  G.cad = { st: 0, cd: L[1] ? rnd(P(1).gap * 0.6, P(1).gap * 1.2) : 1e9, t: 0, wait: 0 };
  G.hey = { stage: 0, cd: L[2] ? rnd(8, 14) : 1e9, look: 0, at: 0 };
  G.fis = { cd: L[3] ? rnd(18, 28) : 1e9, win: 0, held: 0, pan: 0 };
  G.hour = 0; G.lastHour = -1; G.msgIdx = 0; G.msgT = 0;
  G.msgs = n <= 5 ? MSG[NIGHTS[n].msg] : ["Özel gece: ayarladığın seviyeyle ağır bir gece."];
  G.deadT = 0; G.paused = false;
  audioInit(); SFX.ring();
}
function die(by) {
  if (G.dead) return; G.dead = by; G.deadT = 0; G.screen = "dead"; G.view = "office"; G.lan = false; G.shake = 1; SFX.scare(by);
}
function win() {
  G.screen = "win"; G.deadT = 0; SFX.chime();
  if (G.night <= 5) { SAVE.done = Math.max(SAVE.done, G.night); SAVE.night = Math.min(6, Math.max(SAVE.night, G.night + 1)); }
  store.set("gb_save", SAVE);
}

/* ------------------------------------------------------------ mantık */
function oilDrain(dt) {
  let r = 0.13;
  if (G.lan) r += 0.9; if (G.shut) r += 0.45; if (G.view === "cam") r += 0.2;
  G.oil = Math.max(0, G.oil - r * dt);
  if (G.oil <= 0 && !G.out) { G.out = true; SFX.low(); G.blackout = 1; G.lan = false; G.shut = false; G.view = "office"; }
}
function update(dt) {
  if (G.screen === "intro") { G.msgT += dt; return; }
  if (G.screen === "dead" || G.screen === "win") { G.deadT += dt; return; }
  if (G.screen !== "play" || G.paused) return;
  G.t += dt; G.hour = Math.floor(G.t / HOUR);
  if (G.hour !== G.lastHour) { G.lastHour = G.hour; if (G.hour > 0 && G.hour < 6) SFX.tick(); }
  if (G.hour >= 6) { win(); return; }
  oilDrain(dt);
  G.shake = Math.max(0, G.shake - dt * 2); G.flash = Math.max(0, G.flash - dt * 3);
  const L = lvls(), out = G.out;
  // nefes
  if (G.breath) { G.breathBar = Math.max(0, G.breathBar - dt * 22); if (G.breathBar <= 0) G.breath = false; } else G.breathBar = Math.min(100, G.breathBar + dt * 16);
  // ---------- Gölge (sol pencere)
  const go = G.gol, gp = par(L[0]);
  if (L[0] > 0) {
    if (go.st === 0) { go.cd -= dt; if (go.cd <= 0) { go.st = 1; go.t = 0; go.blind = 0; SFX.knock(-0.8); } }
    else if (go.st === 1) {
      go.t += dt;
      if (G.lan && !out) { go.blind += dt; if (go.blind >= 1.2) { go.st = 0; go.cd = rnd(gp.gap * 0.7, gp.gap * 1.2); SFX.blind(); G.flash = 0.6; } }
      else go.blind = Math.max(0, go.blind - dt * 0.5);
      if (go.t > (out ? 3.5 : gp.dl)) die("gol");
    }
  }
  // ---------- Cadı (sağ kapı)
  const ca = G.cad, cp = par(L[1]);
  if (L[1] > 0) {
    if (ca.st === 0) { ca.cd -= dt; if (ca.cd <= 0) { ca.st = 1; ca.t = 0; SFX.step(0.8, 5); } }
    else if (ca.st === 1) { ca.t += dt; if (ca.t > 2.4) { ca.st = 2; ca.t = 0; ca.wait = rnd(5, 9) - L[1] * 0.2; if (G.shut) SFX.knock(0.8); } }
    else if (ca.st === 2) {
      ca.t += dt;
      if (!G.shut) { if (ca.t > 1.1 && !ca.seen) { ca.seen = true; } if (ca.t > 1.25) die("cad"); }
      else { ca.seen = false; if (ca.t > ca.wait) { ca.st = 0; ca.cd = rnd(cp.gap * 0.7, cp.gap * 1.2); ca.t = 0; SFX.step(0.8, 3); } else if (Math.floor(ca.t * 2) !== Math.floor((ca.t - dt) * 2) && Math.random() < 0.3) noiseBurst(0.08, 0.3, 200, 90, "lowpass", 0.8); }
    }
  }
  // ---------- Heykel (kameralar)
  const he = G.hey, ROOM = [2, 1, 3, 4]; // aşama 0:Depo(2) 1:Avlu(1) 2:Koridor(3) 3:Kapı önü(4)
  if (L[2] > 0 && he.stage < 4) {
    const watched = G.view === "cam" && G.cam === ROOM[he.stage] && !out;
    if (watched) { he.look += dt; if (he.stage === 3 && he.look > 2) { he.stage = 1; he.look = 0; he.cd = rnd(8, 14); SFX.cam(); } }
    else {
      he.look = Math.max(0, he.look - dt);
      he.cd -= dt * (1 + L[2] * 0.08);
      if (he.cd <= 0) { he.stage++; he.cd = he.stage === 3 ? lerp(15, 9, L[2] / 10) : rnd(8, 14) * lerp(1.3, 0.8, L[2] / 10); if (he.stage === 4) die("hey"); else if (Math.random() < 0.6) SFX.low(); }
    }
  }
  // ---------- Fısıltı
  const fi = G.fis;
  if (L[3] > 0) {
    if (fi.win <= 0) { fi.cd -= dt; if (fi.cd <= 0) { fi.win = 3.8; fi.held = 0; fi.pan = Math.random() < 0.5 ? -0.8 : 0.8; SFX.whisper(fi.pan); fi.cd = rnd(22, 34) - L[3] * 1.2; } }
    else {
      fi.win -= dt; if (G.breath) fi.held += dt;
      if (fi.held >= 1.8) { fi.win = 0; fi.held = 0; SFX.cam(); }
      else if (fi.win <= 0) { G.fails++; G.flash = 0.5; G.blackout = 0.7; SFX.low(); if (G.fails >= 3) die("fis"); }
    }
  }
  if (G.blackout > 0) G.blackout = Math.max(0, G.blackout - dt * (G.out ? 0 : 0.8));
}
// kullanıcı eylemleri
function toggleCam() { if (G.screen !== "play" || G.out || G.paused) return; G.view = G.view === "cam" ? "office" : "cam"; G.lan = false; SFX.cam(); }
function toggleShut() { if (G.screen !== "play" || G.out || G.paused) return; G.shut = !G.shut; G.view = "office"; SFX.shutter(); }
function setLan(v) { if (G.screen !== "play" || G.paused) return; if (v && (G.out || G.view === "cam")) return; if (v && !G.lan) SFX.lantern(); G.lan = v; }
function setBreath(v) { if (G.screen !== "play" || G.paused) return; G.breath = v && G.breathBar > 8; }

/* ------------------------------------------------------------ çizim: yardımcılar */
function bgOffice() {
  const c = document.createElement("canvas"); c.width = W; c.height = H; const x = c.getContext("2d");
  let gr = x.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, "#1a1410"); gr.addColorStop(1, "#0b0907"); x.fillStyle = gr; x.fillRect(0, 0, W, H);
  // taş duvar
  for (let r = 0; r < 14; r++) for (let q = 0; q < 24; q++) { const o = (r % 2) * 28, px = q * 56 - o, py = r * 36, l = 20 + ((q * 7 + r * 13) % 9); x.fillStyle = `rgb(${l + 14},${l + 9},${l + 4})`; x.fillRect(px + 2, py + 2, 52, 32); }
  x.fillStyle = "rgba(0,0,0,.35)"; x.fillRect(0, 0, W, H);
  // zemin
  gr = x.createLinearGradient(0, 520, 0, H); gr.addColorStop(0, "#241a12"); gr.addColorStop(1, "#0a0705"); x.fillStyle = gr; x.fillRect(0, 520, W, 200);
  // tavan kirişi
  x.fillStyle = "#0e0a07"; x.fillRect(0, 0, W, 60); for (let i = 0; i < 6; i++) x.fillRect(i * 230 + 40, 0, 40, 90);
  // masa
  x.fillStyle = "#2a1c10"; x.fillRect(390, 520, 500, 40); x.fillStyle = "#1a110a"; x.fillRect(400, 560, 480, 160);
  x.fillStyle = "#3b2915"; x.fillRect(390, 516, 500, 10);
  // kandil
  x.fillStyle = "#3a2b1a"; x.fillRect(612, 478, 56, 40); x.fillStyle = "#c58a3a"; x.fillRect(624, 456, 32, 26);
  // sol pencere çerçevesi
  x.fillStyle = "#000"; x.fillRect(80, 150, 240, 320); x.strokeStyle = "#3a2a1a"; x.lineWidth = 14; x.strokeRect(80, 150, 240, 320); x.lineWidth = 6; x.beginPath(); x.moveTo(200, 150); x.lineTo(200, 470); x.moveTo(80, 310); x.lineTo(320, 310); x.stroke();
  // sağ kapı çerçevesi
  x.fillStyle = "#000"; x.fillRect(960, 120, 240, 400); x.strokeStyle = "#3a2a1a"; x.lineWidth = 16; x.strokeRect(960, 120, 240, 400);
  return c;
}
let OFFICE = null;
function drawEyes(x, y, s, a = 1, col = "#fff") { g.save(); g.globalAlpha = a; g.fillStyle = col; g.shadowColor = col; g.shadowBlur = 18 * s; g.beginPath(); g.ellipse(x - 14 * s, y, 6 * s, 9 * s, 0, 0, 7); g.ellipse(x + 14 * s, y, 6 * s, 9 * s, 0, 0, 7); g.fill(); g.restore(); }
function figGol(cx, cy, s, a = 1) { // uzun siyah gölge
  g.save(); g.globalAlpha = a; g.fillStyle = "#020202"; g.beginPath(); g.moveTo(cx - 50 * s, cy + 260 * s); g.quadraticCurveTo(cx - 60 * s, cy + 40 * s, cx - 26 * s, cy - 20 * s); g.arc(cx, cy - 50 * s, 40 * s, Math.PI * 0.85, Math.PI * 2.15); g.quadraticCurveTo(cx + 60 * s, cy + 40 * s, cx + 50 * s, cy + 260 * s); g.fill();
  g.restore(); drawEyes(cx, cy - 52 * s, s, a);
}
function figCad(cx, cy, s, a = 1) { // kambur cadı
  g.save(); g.globalAlpha = a; g.fillStyle = "#0a0707"; g.beginPath(); g.moveTo(cx - 90 * s, cy + 340 * s); g.quadraticCurveTo(cx - 120 * s, cy + 60 * s, cx - 40 * s, cy - 10 * s); g.arc(cx, cy - 50 * s, 46 * s, Math.PI * 0.8, Math.PI * 2.2); g.quadraticCurveTo(cx + 120 * s, cy + 60 * s, cx + 90 * s, cy + 340 * s); g.fill();
  g.strokeStyle = "#1a1414"; g.lineWidth = 3 * s; for (let i = 0; i < 18; i++) { g.beginPath(); g.moveTo(cx + (i - 9) * 5 * s, cy - 80 * s); g.quadraticCurveTo(cx + (i - 9) * 9 * s, cy + 20 * s, cx + (i - 9) * 11 * s + Math.sin(i) * 8 * s, cy + 150 * s); g.stroke(); }
  g.fillStyle = "#c9c2b2"; g.beginPath(); g.ellipse(cx, cy - 44 * s, 24 * s, 32 * s, 0, 0, 7); g.fill(); g.fillStyle = "#000"; g.beginPath(); g.ellipse(cx - 9 * s, cy - 48 * s, 5 * s, 8 * s, 0, 0, 7); g.ellipse(cx + 9 * s, cy - 48 * s, 5 * s, 8 * s, 0, 0, 7); g.fill(); g.beginPath(); g.ellipse(cx, cy - 22 * s, 8 * s, 14 * s, 0, 0, 7); g.fill(); g.restore();
}
function figHey(cx, cy, s, a = 1) { // soluk heykel/manken
  g.save(); g.globalAlpha = a; g.fillStyle = "#b9b2a0"; g.beginPath(); g.ellipse(cx, cy - 60 * s, 28 * s, 36 * s, 0, 0, 7); g.fill(); g.fillRect(cx - 12 * s, cy - 26 * s, 24 * s, 28 * s);
  g.fillStyle = "#9d9684"; g.beginPath(); g.moveTo(cx - 60 * s, cy + 30 * s); g.lineTo(cx - 20 * s, cy); g.lineTo(cx + 20 * s, cy); g.lineTo(cx + 60 * s, cy + 30 * s); g.lineTo(cx + 46 * s, cy + 260 * s); g.lineTo(cx - 46 * s, cy + 260 * s); g.fill();
