<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saatçinin Köşkü</title>

<body><canvas id="c" width="1280" height="720"></canvas>
<script>
"use strict";
/* ===== Saatçinin Köşkü — motor ===== */
const cv = document.getElementById("c"), g = cv.getContext("2d");
const W = 1280, H = 720;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };
const SET = Object.assign({ vol: 0.7, hints: true }, store.get("sk_set", {})); const BEST = store.get("sk_best", {});
function hashSeed(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const WORDS = "ABCDEFGHJKLMNPRSTUVYZ23456789"; function randCode() { let s = ""; for (let i = 0; i < 5; i++) s += WORDS[Math.floor(Math.random() * WORDS.length)]; return s; }
function shade(hex, a) { const n = parseInt(hex.slice(1), 16); let r = n >> 16, gg = (n >> 8) & 255, b = n & 255; const f = a >= 0 ? 255 : 0, k = Math.abs(a); r = Math.round(r + (f - r) * k); gg = Math.round(gg + (f - gg) * k); b = Math.round(b + (f - b) * k); return `rgb(${r},${gg},${b})`; }
function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
const SERIF = (s, w = "600") => `${w} ${s}px Georgia,"Times New Roman",serif`, SANS = (s, w = "600") => `${w} ${s}px system-ui,"Segoe UI",sans-serif`;
function T(t, x, y, sz = 22, col = "#eadfc2", al = "left", font = "sans") { g.font = font === "serif" ? SERIF(sz) : SANS(sz); g.fillStyle = col; g.textAlign = al; g.fillText(t, x, y); g.textAlign = "left"; }
function wrapT(t, x, y, mw, lh, sz = 22, col = "#eadfc2", font = "serif", al = "left") { g.font = font === "serif" ? SERIF(sz, "500") : SANS(sz, "500"); g.fillStyle = col; g.textAlign = al; const paras = String(t).split("\n"); for (const pr of paras) { const w = pr.split(" "); let l = ""; for (const a of w) { const tt = l + a + " "; if (g.measureText(tt).width > mw && l) { g.fillText(l.trim(), x, y); l = a + " "; y += lh; } else l = tt; } g.fillText(l.trim(), x, y); y += lh; } g.textAlign = "left"; return y; }

/* ---------- ses ---------- */
const A = { ctx: null };
function audioInit() { if (A.ctx) { if (A.ctx.state === "suspended") A.ctx.resume(); return; } try { const C = window.AudioContext || window.webkitAudioContext; A.ctx = new C(); A.master = A.ctx.createGain(); A.master.gain.value = SET.vol; A.master.connect(A.ctx.destination);
  const nb = A.ctx.createBuffer(1, A.ctx.sampleRate * 2, A.ctx.sampleRate), d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; A.nb = nb;
  const mk = (f, v) => { const o = A.ctx.createOscillator(); o.type = "sine"; o.frequency.value = f; const gn = A.ctx.createGain(); gn.gain.value = v; o.connect(gn); gn.connect(A.master); o.start(); return gn; };
  A.pad1 = mk(110, 0.025); A.pad2 = mk(164.8, 0.015); A.pad3 = mk(130.8, 0.012);
  const s = A.ctx.createBufferSource(); s.buffer = nb; s.loop = true; const f = A.ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 420; const gn = A.ctx.createGain(); gn.gain.value = 0.03; s.connect(f); f.connect(gn); gn.connect(A.master); s.start(); A.wind = gn; } catch (e) { A.ctx = null; } }
function tone(f, d, type = "sine", v = 0.15, slide = 0, delay = 0) { if (!A.ctx) return; const t = A.ctx.currentTime + delay, o = A.ctx.createOscillator(), gn = A.ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t + d); gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(0.0008, t + d); o.connect(gn); gn.connect(A.master); o.start(t); o.stop(t + d + 0.05); }
function noise(d, v = 0.1, fq = 1500) { if (!A.ctx) return; const t = A.ctx.currentTime, s = A.ctx.createBufferSource(); s.buffer = A.nb; const f = A.ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = fq; const gn = A.ctx.createGain(); gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(0.0008, t + d); s.connect(f); f.connect(gn); gn.connect(A.master); s.start(t, Math.random()); s.stop(t + d + 0.05); }
const SFX = { click() { tone(520, 0.05, "square", 0.04); }, pick() { tone(660, 0.1, "triangle", 0.12); tone(990, 0.15, "triangle", 0.12, 0, 0.08); }, bad() { tone(140, 0.25, "sawtooth", 0.1, -40); }, ok() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.35, "triangle", 0.12, 0, i * 0.09)); }, creak() { noise(0.5, 0.12, 400); tone(90, 0.5, "sawtooth", 0.05, 30); }, tick(a) { tone(a ? 1100 : 800, 0.03, "square", 0.018); }, unlock() { noise(0.12, 0.15, 3000); tone(300, 0.1, "square", 0.08); tone(450, 0.2, "square", 0.08, 0, 0.1); }, note(f) { tone(f, 0.7, "triangle", 0.18); tone(f * 2, 0.4, "sine", 0.05); }, chime() { [392, 523, 659, 784].forEach((f, i) => tone(f, 1.6, "sine", 0.1, 0, i * 0.4)); } };

/* ---------- durum ---------- */
let S = { screen: "menu", sub: null, mx: 0, my: 0 }; let V = {}; let MOD = null;
const VIEWS = {}, ITEMS = {}, PUZ = {}, COMBOS = [], ORDER = [], ROOMS = [];
const F = k => !!S.flags[k], setF = (k, v = true) => { S.flags[k] = v; };
const has = id => S.inv.includes(id);
function say(t, d = 4.5) { S.msg = t; S.msgT = d; }
function addItem(id) { if (has(id)) return; S.inv.push(id); SFX.pick(); say("Aldın: " + ITEMS[id].n, 3); save(); }
function delItem(id) { S.inv = S.inv.filter(x => x !== id); if (S.sel === id) S.sel = null; }
function addNote(id, title, text) { if (S.notes.find(n => n.id === id)) return; S.notes.push({ id, title, text }); S.noteNew = true; save(); }

function newGame(code, fromSave) {
  audioInit(); code = (code || randCode()).toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8) || randCode();
  S = { screen: "play", code, t: 0, view: "hol1", flags: {}, inv: [], sel: null, notes: [], solved: {}, hintLvl: {}, hintsUsed: 0, stamps: {}, msg: "", msgT: 0, journal: false, noteIdx: 0, paused: false, mx: 640, my: 360, sub: null, tickT: 0, hover: null, fade: 1, vroom: 0, noteNew: false };
  V = genValues(code); MOD = null;
  if (fromSave) Object.assign(S, fromSave); 
  if (!fromSave) { openModal({ type: "note", title: "Saatçinin Köşkü", lines: INTRO, btn: "Başla", onClose() { say("İpucu: ← → ile duvarlar arasında gez, nesnelere tıkla. H: ipucu, J: günlük.", 7); } }); }
  save();
}
function save() { if (!S.code || S.screen !== "play") return; const o = { code: S.code, t: S.t, view: S.view, flags: S.flags, inv: S.inv, notes: S.notes, solved: S.solved, hintLvl: S.hintLvl, hintsUsed: S.hintsUsed, stamps: S.stamps }; store.set("sk_save", o); }
function loadGame() { const o = store.get("sk_save", null); if (!o) return false; newGame(o.code, o); S.screen = "play"; MOD = null; return true; }
function curView() { return VIEWS[S.view]; }
function goView(id) { if (!VIEWS[id]) return; S.view = id; S.hover = null; S.fade = 0; SFX.click(); const r = VIEWS[id].room; if (r !== S.vroom) { S.vroom = r; const rm = ROOMS[r]; if (rm && !S.flags["seen_" + r]) { setF("seen_" + r); if (rm.intro) say(rm.intro, 8); } } }

/* ---------- ipucu & hedef ---------- */
function objective() { for (const id of ORDER) { const p = PUZ[id]; if (!S.solved[id] && (!p.req || p.req())) return id; } return null; }
function giveHint() {
  const id = (MOD && MOD.spec && MOD.spec.pid) || objective(); if (!id) { say("Hiç ipucuna gerek yok gibi görünüyor."); return; }
  const p = PUZ[id], lv = S.hintLvl[id] || 0; let h = p.hints[Math.min(lv, p.hints.length - 1)]; if (typeof h === "function") h = h(); S.hintLvl[id] = Math.min(lv + 1, p.hints.length); S.hintsUsed++;
  const txt = (lv === 0 ? "İpucu (" + p.title + "): " : "İpucu " + (lv + 1) + ": ") + h; if (MOD) MOD.hint = txt; say(txt, 9); SFX.click(); save();
}

/* ---------- görünüm çizimi ---------- */
function drawBG(th, t) {

  const wall = g.createLinearGradient(0, 40, 0, 500); wall.addColorStop(0, C[0]); wall.addColorStop(1, C[1]); g.fillStyle = wall; g.fillRect(0, 40, W, 460);
  g.fillStyle = "rgba(255,255,255,.035)"; for (let x = 0; x < W; x += 48) g.fillRect(x, 40, 22, 460);
  const fl = g.createLinearGradient(0, 500, 0, 620); fl.addColorStop(0, C[2]); fl.addColorStop(1, shade(C[2].length === 7 ? C[2] : "#222222", -0.5)); g.fillStyle = fl; g.fillRect(0, 500, W, 120);
  g.strokeStyle = "rgba(0,0,0,.35)"; g.lineWidth = 2; for (let x = -200; x < W + 200; x += 110) { g.beginPath(); g.moveTo(640 + (x - 640) * 0.55, 500); g.lineTo(x, 620); g.stroke(); }
  g.fillStyle = shade(C[2].length === 7 ? C[2] : "#222222", 0.15); g.fillRect(0, 492, W, 14);
  if (th === "obs") { for (let i = 0; i < 70; i++) { const x = (i * 197) % W, y = 40 + ((i * 89) % 280), a = 0.3 + 0.5 * Math.abs(Math.sin(t * 0.8 + i)); g.fillStyle = `rgba(255,255,230,${a})`; g.fillRect(x, y, 2, 2); } }
}
function drawObj(o, t) {
  if (o.show && !o.show()) return;
  if (o.d) { o.d(g, o, t); } else if (o.c) {
    const gr = g.createLinearGradient(o.x, o.y, o.x, o.y + o.h); gr.addColorStop(0, shade(o.c, 0.15)); gr.addColorStop(1, o.c2 || shade(o.c, -0.3)); g.fillStyle = gr; rr(o.x, o.y, o.w, o.h, o.r == null ? 6 : o.r); g.fill(); g.strokeStyle = "rgba(0,0,0,.45)"; g.lineWidth = 2; g.stroke();
  }
  if (o.txt) T(o.txt, o.x + o.w / 2, o.y + o.h / 2 + (o.tsz || 20) * 0.35, o.tsz || 20, o.tc || "#eadfc2", "center", "serif");
}
const interactive = o => !!(o.take || o.puz || o.click || o.look || o.go || o.use);
function hitObj(x, y) { const v = curView(); const blind = v.dark && !has("fener_pilli"); for (let i = v.objs.length - 1; i >= 0; i--) { const o = v.objs[i]; if (o.nohit) continue; if (o.show && !o.show()) continue; if (!interactive(o)) continue; if (blind && !o.always) continue; if (x >= o.x && x <= o.x + o.w && y >= o.y && y <= o.y + o.h) return o; } return null; }
function objClick(o) {
  if (S.sel) { const u = o.use && (o.use[S.sel] || o.use["*"]); if (u) { u(o); return; } say(["Bu burada işe yaramıyor.", "Olmadı.", "Bununla bir şey olmayacak."][Math.floor(Math.random() * 3)], 3); SFX.bad(); return; }
  if (o.go) { if (o.lock && !o.lock()) return; goView(o.go); return; }
  if (o.take) { if (o.need && !o.need()) { if (o.look) say(typeof o.look === "function" ? o.look() : o.look); return; } addItem(o.take); setF("took_" + o.take); if (o.onTake) o.onTake(); return; }
  if (o.puz) { openPuz(o.puz); return; }
  if (o.click) { o.click(o); return; }
  if (o.look) say(typeof o.look === "function" ? o.look() : o.look, 7);
}
function openPuz(id) { const p = PUZ[id]; if (!p) return; if (S.solved[id]) { if (p.after) p.after(); else say(p.doneMsg || "Burası zaten çözüldü.", 3); return; } if (p.need && !p.need()) { say(p.needMsg || "Şu an buna başlayamazsın.", 4); SFX.bad(); return; } openModal(Object.assign({ pid: id, title: p.title, onSolve() { S.solved[id] = true; SFX.ok(); if (p.reward) p.reward(); save(); } }, p.make())); }

/* ---------- çizim ---------- */
function icon(id, x, y, s) {
  const it = ITEMS[id]; g.save(); g.translate(x, y); const k = it.ico, c = it.col || "#d9b45a"; g.lineWidth = 2;
  const R = { key() { g.strokeStyle = c; g.fillStyle = c; g.beginPath(); g.arc(-s * .25, 0, s * .2, 0, 7); g.stroke(); g.fillRect(-s * .05, -2, s * .45, 4); g.fillRect(s * .22, 0, 4, s * .14); g.fillRect(s * .32, 0, 4, s * .1); },
    paper() { g.fillStyle = c; g.fillRect(-s * .28, -s * .34, s * .56, s * .68); g.fillStyle = "rgba(0,0,0,.4)"; for (let i = 0; i < 5; i++) g.fillRect(-s * .2, -s * .24 + i * s * .12, s * .4, 2); },
    gear() { g.fillStyle = c; g.beginPath(); for (let i = 0; i < 16; i++) { const a = i / 16 * 6.283, rr2 = i % 2 ? s * .28 : s * .38; g.lineTo(Math.cos(a) * rr2, Math.sin(a) * rr2); } g.closePath(); g.fill(); g.fillStyle = "#222"; g.beginPath(); g.arc(0, 0, s * .1, 0, 7); g.fill(); },
    shaft() { g.fillStyle = c; g.fillRect(-s * .4, -4, s * .8, 8); g.fillStyle = shade(c.length === 7 ? c : "#999999", -.4); g.fillRect(-s * .4, -4, 8, 8); g.fillRect(s * .3, -4, 8, 8); },
    lever() { g.strokeStyle = c; g.lineWidth = 6; g.beginPath(); g.moveTo(-s * .3, s * .3); g.lineTo(s * .2, -s * .25); g.stroke(); g.fillStyle = c; g.beginPath(); g.arc(s * .25, -s * .3, 8, 0, 7); g.fill(); },
    candle() { g.fillStyle = "#f2ead0"; g.fillRect(-6, -s * .1, 12, s * .4); if (it.lit) { g.fillStyle = "#ffb43a"; g.beginPath(); g.ellipse(0, -s * .2, 6, 12, 0, 0, 7); g.fill(); } g.fillStyle = "#555"; g.fillRect(-12, s * .3, 24, 5); },
    match() { g.fillStyle = "#b98b50"; g.fillRect(-s * .3, -2, s * .6, 4); g.fillStyle = "#c33"; g.beginPath(); g.arc(s * .3, 0, 5, 0, 7); g.fill(); },
    lantern() { g.fillStyle = "#6a5a3a"; g.fillRect(-s * .18, -s * .3, s * .36, s * .5); g.fillStyle = it.lit ? "#ffe9a0" : "#9bb8c6"; g.fillRect(-s * .12, -s * .2, s * .24, s * .3); g.strokeStyle = "#6a5a3a"; g.beginPath(); g.arc(0, -s * .3, s * .14, Math.PI, 0); g.stroke(); },
    battery() { g.fillStyle = "#4a9a4a"; g.fillRect(-s * .12, -s * .28, s * .24, s * .56); g.fillStyle = "#ddd"; g.fillRect(-s * .06, -s * .34, s * .12, s * .06); },
    lens() { g.strokeStyle = "#cfe"; g.lineWidth = 4; g.beginPath(); g.arc(0, 0, s * .26, 0, 7); g.stroke(); g.fillStyle = "rgba(160,220,255,.35)"; g.fill(); },
    gem() { g.fillStyle = "#ff5d7a"; g.beginPath(); g.moveTo(0, -s * .3); g.lineTo(s * .26, -s * .05); g.lineTo(0, s * .3); g.lineTo(-s * .26, -s * .05); g.closePath(); g.fill(); g.strokeStyle = "#fff"; g.stroke(); },
    wheel() { g.strokeStyle = c; g.lineWidth = 3; g.beginPath(); g.arc(0, 0, s * .3, 0, 7); g.stroke(); g.beginPath(); g.arc(0, 0, s * .17, 0, 7); g.stroke(); T("A", 0, -s * .33, 12, c, "center"); },
    core() { R.gear(); g.strokeStyle = "#fff"; g.beginPath(); g.arc(0, 0, s * .45, 0, 7); g.stroke(); },
    stamp() { g.fillStyle = "#b33"; g.fillRect(-s * .22, -s * .22, s * .44, s * .44); g.fillStyle = "#fff"; g.fillRect(-s * .15, -s * .15, s * .3, s * .3); } };
  (R[k] || R.paper)(); g.restore();
}
function drawHUD() {
  g.fillStyle = "rgba(10,7,5,.85)"; g.fillRect(0, 0, W, 40); T(ROOMS[curView().room].name + " · " + curView().name, 20, 27, 20, "#e8d9b0", "left", "serif");
  const m = Math.floor(S.t / 60), s = Math.floor(S.t % 60); T(String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0"), 1180, 27, 20, "#e8d9b0", "right");
  T("İpucu [H]  ·  Günlük [J]" + (S.noteNew ? " ●" : "") + "  ·  Duraklat [P]", 1000, 27, 16, "#b9a678", "right");
  T("Pul " + Object.keys(S.stamps).length + "/5", 1250, 27, 18, "#e0a8a8", "right");
  g.fillStyle = "rgba(10,7,5,.9)"; g.fillRect(0, 630, W, 90); g.strokeStyle = "#5a4526"; g.lineWidth = 2; g.beginPath(); g.moveTo(0, 630); g.lineTo(W, 630); g.stroke();
  for (let i = 0; i < 14; i++) { const x = 20 + i * 90; g.fillStyle = "rgba(255,255,255,.05)"; rr(x, 642, 80, 66, 8); g.fill(); const id = S.inv[i]; if (id) { if (S.sel === id) { g.strokeStyle = "#ffbe55"; g.lineWidth = 3; rr(x, 642, 80, 66, 8); g.stroke(); } icon(id, x + 40, 668, 52); T(ITEMS[id].n.slice(0, 13), x + 40, 703, 11, "#cdbf9a", "center"); } }
  if (S.msgT > 0) { const a = Math.min(1, S.msgT); g.globalAlpha = a; g.fillStyle = "rgba(8,5,3,.88)"; g.fillRect(60, 560, 1160, 64); g.strokeStyle = "#8a6d38"; g.lineWidth = 2; g.strokeRect(60, 560, 1160, 64); const lines = String(S.msg).length > 105 ? 2 : 1; wrapT(S.msg, 80, lines === 2 ? 584 : 598, 1120, 24, 20, "#f0e4c4", "serif"); g.globalAlpha = 1; }
  const v = curView(); g.fillStyle = "rgba(255,255,255,.25)"; if (v.l) { g.beginPath(); g.moveTo(34, 330); g.lineTo(58, 300); g.lineTo(58, 360); g.fill(); } if (v.r) { g.beginPath(); g.moveTo(1246, 330); g.lineTo(1222, 300); g.lineTo(1222, 360); g.fill(); }
}
function drawView(t) {
  const v = curView(); drawBG(v.theme, t);
  for (const o of v.objs) drawObj(o, t);
  if (v.dark) { const lamp = has("fener_pilli") ; g.fillStyle = "#000"; const gr = g.createRadialGradient(S.mx, S.my, lamp ? 40 : 4, S.mx, S.my, lamp ? 260 : 60); gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(1, lamp ? "rgba(0,0,0,.96)" : "rgba(0,0,0,.995)"); g.fillStyle = gr; g.fillRect(0, 40, W, 590); }
  const h = S.hover; if (h && !MOD && !S.journal) { g.strokeStyle = "rgba(255,230,150,.7)"; g.lineWidth = 2; rr(h.x - 2, h.y - 2, h.w + 4, h.h + 4, 6); g.stroke(); if (h.name) { g.font = SANS(16); const w = g.measureText(h.name).width + 20; const tx = clamp(S.mx + 14, 4, W - w - 4); g.fillStyle = "rgba(8,5,3,.9)"; g.fillRect(tx, S.my + 18, w, 28); T(h.name, tx + 10, S.my + 38, 16, "#ffe6a0"); } }
  if (S.fade < 1) { g.fillStyle = `rgba(0,0,0,${1 - S.fade})`; g.fillRect(0, 0, W, H); }
}
function drawJournal() {
  g.fillStyle = "rgba(0,0,0,.82)"; g.fillRect(0, 0, W, H); g.fillStyle = "#2a1f14"; rr(90, 60, 1100, 590, 12); g.fill(); g.strokeStyle = "#8a6d38"; g.lineWidth = 3; g.stroke();
  T("Günlük", 130, 110, 34, "#ffbe55", "left", "serif"); T("[J] kapat", 1150, 108, 18, "#b9a678", "right");
  if (!S.notes.length) T("Henüz bir not yok. Okuduğun her ipucu buraya eklenir.", 130, 170, 22, "#b9a678"); 
  S.notes.forEach((n, i) => { const y = 140 + i * 34; if (y > 620) return; g.fillStyle = i === S.noteIdx ? "rgba(255,190,85,.2)" : "rgba(255,255,255,.04)"; g.fillRect(120, y - 22, 330, 30); T(n.title.slice(0, 30), 130, y, 18, i === S.noteIdx ? "#ffe6a0" : "#cdbf9a"); });
  const n = S.notes[S.noteIdx]; if (n) { g.fillStyle = "#e9dcb8"; rr(480, 130, 680, 490, 6); g.fill(); T(n.title, 510, 175, 26, "#3a2a14", "left", "serif"); wrapT(n.text, 510, 215, 620, 30, 22, "#3a2a14", "serif"); }
