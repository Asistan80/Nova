<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Alt Geçit</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);touch-action:none}
#nm{position:absolute;display:none;left:50%;top:50%;transform:translate(-50%,0);width:260px;padding:10px 12px;font:20px Georgia,serif;text-align:center;background:#0b0f0d;color:#dfe8d8;border:2px solid #4f6b5c;border-radius:6px;outline:none}</style></head><body>
<canvas id="c" width="1280" height="720"></canvas><input id="nm" maxlength="14" placeholder="Adın nedir?" autocomplete="off"><script>
'use strict';
const cv=document.getElementById('c'),g=cv.getContext('2d'),NM=document.getElementById('nm');
const W=1280,H=720,FL=860,LC=44,HT=3.1,EYE=1.62,NEAR=.12;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),TAU=Math.PI*2,lerp=(a,b,t)=>a+(b-a)*t;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// ---------------------------------------------------------------- kayıt
const SK='ag_save_v1';
const defSave=()=>({name:'',found:{},vol:{m:.8,a:.7,f:1},best:0,ends:{},runs:0,sound:true,shake:true});
function loadSave(){try{const s=JSON.parse(localStorage.getItem(SK));const d=defSave();if(s){Object.assign(d,s);d.vol=Object.assign({m:.8,a:.7,f:1},s.vol||{})}return d}catch(e){return defSave()}}
let SAVE=loadSave();function save(){try{localStorage.setItem(SK,JSON.stringify(SAVE))}catch(e){}}
// ---------------------------------------------------------------- anomaliler
const ANOMS=[
['lightOut','Sönük Lamba','Tavan lambalarından biri sönük.'],['flicker','Titreyen Işıklar','Koridorun ışıkları kırpışıyor.'],
['posterEyes','Bakan Poster','Kayıp ilanındaki yüz seni izliyor.'],['posterMissing','Kayıp Poster','Hat haritası yerinde yok, çerçeve boş.'],
['posterText','Yanlış Yazı','Mama reklamının yazısı değişmiş.'],['posterUpside','Ters Poster','Çocuk resmi baş aşağı asılı.'],
['clockWrong','Geri Giden Saat','Duvar saati geriye doğru işliyor.'],['doorOpen','Aralık Kapı','Teknik odanın kapısı aralık; içeride bir şey var.'],
['extraDoor','Fazladan Kapı','Karşı duvarda olmaması gereken bir kapı var.'],['benchCeil','Tavandaki Bank','Bank tavana yapışmış.'],
['vendRed','Kızıl Otomat','Otomatın ışığı kızıl ve ekranda bir yazı var.'],['camTrack','Takip Eden Kamera','Güvenlik kamerası seni gözlüyor.'],
['signMirror','Aynalı Tabela','Çıkış tabelası aynalanmış.'],['signWrong','Yanlış Tabela','Tabela "ÇIKIŞ" yerine başka bir şey diyor.'],
['puddle','Kara Gölcük','Zeminde kara bir su birikintisi var.'],['footprints','Islak Ayak İzleri','Zeminde sana doğru yürüyen ıslak izler.'],
['tilesInvert','Ters Fayanslar','Bir kısım fayansın deseni ters dönmüş.'],['handprints','El İzleri','Duvarda koyu el izleri.'],
['tilt','Eğik Koridor','Koridor yana yatmış gibi.'],['narrow','Daralan Koridor','Duvarlar birbirine yaklaşmış.'],
['crack','Çatlak Duvar','Duvarda yeni bir çatlak.'],['figure','Koridordaki Siluet','Koridorda biri duruyor.'],
['ball','Yuvarlanan Top','Kırmızı bir top sana doğru yuvarlanıyor.'],['counterWrong','Yanlış Sayaç','Kat tabelası yanlış sayıyı gösteriyor.'],
['fog','Yoğun Sis','Koridoru kalın bir sis kaplamış.'],['whisper','Fısıltı','Kulağına birinin fısıltısı geliyor. (Ses anomalisi)'],
['steps','Fazladan Ayak Sesi','Arkandan senin olmayan adımlar geliyor. (Ses anomalisi)'],['laugh','Çocuk Kahkahası','Uzaktan bir çocuk gülüyor. (Ses anomalisi)'],
['heartbeat','Kalp Atışı','Duvarlar içinden kalp atışı geliyor. (Ses anomalisi)']].map(a=>({id:a[0],n:a[1],d:a[2]}));
const ITEMS=[{n:1,z:15,name:'Kırık Künye',d:'Üstünde silik bir isim kazınmış.'},{n:3,z:31,name:'Eski Bilet',d:'Tarihi yazılmamış bir tek geçiş bileti.'},{n:5,z:9,name:'Solmuş Fotoğraf',d:'Bir yüz var ama yüzü kazınmış.'}];
// ---------------------------------------------------------------- ses
let AC=null,hum=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();if(AC&&!hum)startHum();return AC}
const vA=()=>SAVE.sound?SAVE.vol.m*SAVE.vol.a:0,vF=()=>SAVE.sound?SAVE.vol.m*SAVE.vol.f:0;
function startHum(){try{const o1=AC.createOscillator(),o2=AC.createOscillator(),o3=AC.createOscillator(),gn=AC.createGain();o1.frequency.value=100;o2.frequency.value=150.7;o3.frequency.value=48;o1.type='sawtooth';o2.type='triangle';o3.type='sine';gn.gain.value=0;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=380;o1.connect(f);o2.connect(f);o3.connect(f);f.connect(gn);gn.connect(AC.destination);o1.start();o2.start();o3.start();hum={gn,f,o3}}catch(e){}}
function setHum(level){if(hum&&AC){hum.gn.gain.setTargetAtTime(.035*vA()*level,AC.currentTime,.15)}}
function tone(f,d,type,v,sl){const vv=(v||.05)*vF();if(vv<.0004||!ac())return;try{const t=AC.currentTime,o=AC.createOscillator(),gn=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*sl),t+d);gn.gain.setValueAtTime(vv,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d,v,fc,type,q,sweep){const vv=(v||.1)*vF();if(vv<.0004||!ac())return;try{const t=AC.currentTime,n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/n,1.4);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),gn=AC.createGain();s.buffer=b;f.type=type||'lowpass';f.frequency.setValueAtTime(fc||1000,t);if(sweep)f.frequency.exponentialRampToValueAtTime(Math.max(60,sweep),t+d);if(q)f.Q.value=q;gn.gain.value=vv;s.connect(f);f.connect(gn);gn.connect(AC.destination);s.start(t)}catch(e){}}
const SFX={step:run=>noise(.09,.16,run?700:420,'lowpass'),drip:()=>{tone(1400,.07,'sine',.05,.5);setTimeout(()=>tone(900,.12,'sine',.03,.6),90)},
 whisper:()=>{noise(1.4,.22,1800,'bandpass',4,700);setTimeout(()=>noise(1,.15,1200,'bandpass',5,2200),700)},
 laugh:()=>{for(let i=0;i<5;i++)setTimeout(()=>tone(700+i%2*160,.12,'triangle',.05,1.15),i*160)},
 heart:()=>{tone(55,.18,'sine',.22,.7);setTimeout(()=>tone(50,.2,'sine',.16,.7),240)},
 ding:()=>{tone(880,.5,'sine',.08);setTimeout(()=>tone(1320,.6,'sine',.06),120)},bad:()=>{tone(180,.6,'sawtooth',.07,.5);tone(120,.7,'square',.04,.5)},
 bang:()=>{noise(.5,.5,500,'lowpass');tone(70,.5,'sawtooth',.2,.4)},scare:()=>{noise(1.3,.6,2500,'lowpass',0,200);tone(60,1.2,'sawtooth',.3,.3);tone(900,.9,'square',.12,.2);tone(1300,.8,'sawtooth',.1,.3)},
 glitch:()=>{for(let i=0;i<7;i++)setTimeout(()=>tone(200+Math.random()*1800,.05,'square',.05),i*45)},flick:()=>noise(.08,.15,3000,'highpass'),
 pick:()=>{tone(660,.1,'triangle',.06);setTimeout(()=>tone(990,.2,'triangle',.06),80)},door:()=>{noise(.4,.3,300,'lowpass');tone(90,.3,'square',.08,.5)},click:()=>tone(500,.04,'triangle',.05),
 step2:()=>noise(.09,.12,380,'lowpass'),thud:()=>{tone(40,.5,'sine',.3,.5);noise(.3,.2,200)}};
// ---------------------------------------------------------------- girdi
const IN={keys:{},mx:W/2,my:H/2,down:false,click:null,touch:false,tk:{}};
function mpos(e){const r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]||e.changedTouches[0]:e;return{x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height}}
cv.addEventListener('mousemove',e=>{const p=mpos(e);IN.mx=p.x;IN.my=p.y});
cv.addEventListener('mousedown',e=>{ac();const p=mpos(e);IN.mx=p.x;IN.my=p.y;if(e.button===2){if(G.scene==='play')turn();return}IN.down=true;IN.click=p});
addEventListener('mouseup',()=>IN.down=false);cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('touchstart',e=>{e.preventDefault();ac();IN.touch=true;const p=mpos(e);IN.mx=p.x;IN.my=p.y;IN.down=true;IN.click=p},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();const p=mpos(e);IN.mx=p.x;IN.my=p.y},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();IN.down=false;IN.tk={}});
addEventListener('keydown',e=>{if(document.activeElement===NM){if(e.key==='Enter')startGame();return}const k=e.key.toLowerCase();IN.keys[k]=true;if([' ','arrowup','arrowdown'].includes(k))e.preventDefault();ac();
 if(G.scene==='play'){if(k==='q'||k===' '||k==='r')turn();if(k==='e')interact();if(k==='escape'||k==='p')G.paused=!G.paused}
 if(k==='m'){SAVE.sound=!SAVE.sound;save();setHum(1)}});
addEventListener('keyup',e=>IN.keys[e.key.toLowerCase()]=false);
addEventListener('blur',()=>{if(G.scene==='play')G.paused=true});
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}addEventListener('resize',fit);fit();
// ---------------------------------------------------------------- durum
const G={scene:'menu',t:0,n:0,z:1.5,yaw:0,yawFrom:0,yawTo:0,turnT:1,anom:null,seed:1,loopIndex:0,mistakes:0,idle:0,paused:false,fade:0,fadeDir:0,fadeCb:null,msg:null,items:[0,0,0],ev:{},stalker:null,scare:null,freeze:0,flash:0,flick:0,blackout:0,bob:0,stepD:0,aT:0,hint:0,run:0,btns:[],sls:[],ret:'menu',round:1,nb:0,end:null,lastAnom:null,time:0,chase:false,eyesT:0,ball:0,shake:0};
let CAM={x:0,z:0,yaw:0,ox:0,oy:0,roll:0};
let rng=mulberry(1);
function go(sc){G.scene=sc;SFX.click()}
function hw(){return G.anom==='narrow'?1.1:1.7}
const A=id=>G.anom===id;
// ---------------------------------------------------------------- oyun akışı
function startGame(){const nm=(NM.value||'').trim();SAVE.name=nm||SAVE.name||'Yolcu';NM.style.display='none';save();newRun(Date.now()%100000)}
function newRun(seed){G.seed=seed;G.n=0;G.loopIndex=-1;G.mistakes=0;G.items=[0,0,0];G.ev={};G.round=1;G.scene='play';G.paused=false;G.end=null;G.chase=false;G.t=0;SAVE.runs++;save();newLoop();G.msg={t:5,s:'W / ↑ ileri yürü · Q veya Boşluk: geri dön · E: incele · Shift: koş',small:true};ac();setHum(1)}
function newLoop(){G.loopIndex++;const r=mulberry(G.seed*131+G.loopIndex*977+G.round*31);rng=r;G.z=1.4;G.yaw=0;G.yawTo=0;G.turnT=1;G.idle=0;G.stalker=null;G.scare=null;G.blackout=0;G.freeze=0;G.chase=false;G.aT=0;G.ball=0;G.eyesT=0;
 let an=null;const p=G.loopIndex===0?0:(G.n===7?0:.58);if(r()<p){let tries=0;do{an=ANOMS[Math.floor(r()*ANOMS.length)].id;tries++}while(an===G.lastAnom&&tries<8)}G.anom=an;G.lastAnom=an;G.fade=1;G.fadeDir=-1;G.hint=0;
 if(G.n===7)G.chase=true}
function turn(){if(G.scene!=='play'||G.paused||G.scare||G.turnT<1||G.freeze>0||G.fade>.3)return;G.yawFrom=G.yaw;G.yawTo=G.yaw+Math.PI;G.turnT=0;SFX.step(false)}
function dirNow(){const c=Math.cos(G.yawTo);return c>0?1:-1}
function arrive(kind){if(G.scene!=='play'||G.fade>0&&G.fadeDir>0)return;const had=!!G.anom,ok=kind==='fwd'?!had:had;G.fade=0;G.fadeDir=1;
 G.fadeCb=()=>{if(ok){G.n++;SFX.ding();if(had){if(!SAVE.found[G.anom]){SAVE.found[G.anom]=1;save()}}G.msg={t:2.2,s:'KAT '+G.n,sub:had?'Anomali: '+ANOMS.find(a=>a.id===G.anom).n:'Her şey normaldi.'}}
  else{G.n=0;G.mistakes++;SFX.bad();G.msg={t:3.2,s:'KAT 0',sub:had?'Anomali vardı: '+ANOMS.find(a=>a.id===G.anom).n+'. İlerlemeye devam ettin.':'Anomali yoktu. Boşuna geri döndün.',bad:true}}
  G.items=G.items.map(x=>x);if(G.n>=8){startStairs();return}newLoop()}}
function triggerScare(why){if(G.scare||G.scene!=='play')return;G.scare={t:0,why};SFX.scare();G.shake=1}
function interact(){if(G.scene!=='play')return;const d=dirNow();for(let i=0;i<3;i++){const it=ITEMS[i];if(!G.items[i]&&G.n===it.n){const dz=(it.z-G.z)*d;if(Math.abs(it.z-G.z)<2.6&&dz>-1){G.items[i]=1;SFX.pick();G.msg={t:3.5,s:it.name,sub:it.d};return}}}}
function startStairs(){G.scene='stairs';G.t=0;setHum(.4);SFX.door()}
function endGame(){const got=G.items.reduce((a,b)=>a+b,0);G.end={true:got>=3,got,perfect:G.mistakes===0};SAVE.ends[G.end.true?(G.end.perfect?'perfect':'true'):'loop']=1;save();G.scene='ending';G.t=0}
// ---------------------------------------------------------------- güncelleme
function update(dt){G.t+=dt;G.time+=dt;
 if(G.fade>0||G.fadeDir!==0){if(G.fadeDir>0){G.fade+=dt*3;if(G.fade>=1){G.fade=1;G.fadeDir=0;const cb=G.fadeCb;G.fadeCb=null;if(cb)cb();}}else if(G.fadeDir<0){G.fade-=dt*1.6;if(G.fade<=0){G.fade=0;G.fadeDir=0}}}
 if(G.msg){G.msg.t-=dt;if(G.msg.t<=0)G.msg=null}
 if(G.scene==='stairs'){if(G.t>11)endGame();return}
 if(G.scene!=='play'||G.paused)return;
 if(G.freeze>0){G.freeze-=dt;if(G.freeze<=0){G.msg={t:3,s:'Oyun yanıt vermiyor…',sub:'Ben de.',small:true};document.title='Alt Geçit'}return}
 if(G.scare){G.scare.t+=dt;if(G.scare.t>1.5){G.scare=null;G.n=0;G.mistakes++;G.fade=0;G.fadeDir=1;G.fadeCb=()=>{G.msg={t:3,s:'KAT 0',sub:'Seni yakaladı.',bad:true};newLoop()}}return}
 if(G.shake>0)G.shake-=dt;if(G.flash>0)G.flash-=dt*2.2;if(G.blackout>0)G.blackout-=dt;
 // yön + hareket
 if(G.turnT<1){G.turnT=Math.min(1,G.turnT+dt/.6);const e=G.turnT<.5?2*G.turnT*G.turnT:1-Math.pow(-2*G.turnT+2,2)/2;G.yaw=lerp(G.yawFrom,G.yawTo,e)}
 const K=IN.keys,d=dirNow();let mv=0;
 if((K.w||K.arrowup||IN.tk.f)&&G.turnT>=1&&G.fade<.4){mv=1}
 const run=(K.shift)?1:0,spd=mv?(run?4.4:2.5):0;
 if(mv){G.z+=d*spd*dt;G.idle=0;G.stepD+=spd*dt;if(G.stepD>(run?1.1:.8)){G.stepD=0;SFX.step(run);if(A('steps')&&Math.random()<.9)setTimeout(()=>SFX.step2(),180)}G.bob+=dt*(run?11:8)}else G.idle+=dt;
 G.z=clamp(G.z,-.4,LC+.4);
 if(d>0&&G.z>=LC-.7)arrive('fwd');else if(d<0&&G.z<=.7)arrive('back');
 // ses anomalileri
 if(G.anom){G.aT-=dt;if(G.aT<=0){if(A('whisper')){SFX.whisper();G.aT=6+Math.random()*3}else if(A('laugh')){SFX.laugh();G.aT=7+Math.random()*3}else if(A('heartbeat')){SFX.heart();G.aT=.95}else if(A('puddle')||A('footprints')){SFX.drip();G.aT=2.5+Math.random()*2}else if(A('flicker')){G.flick=.25;SFX.flick();G.aT=.4+Math.random()*1.4}else G.aT=99}}
 if(A('flicker')&&G.flick>0)G.flick-=dt;
 if(A('ball')){G.ball+=dt;}
 // olaylar
 const evKey=G.n+'_'+G.round;
 if(G.n===2&&!G.ev[evKey]&&G.z>16&&dirNow()>0&&!G.anom){G.ev[evKey]=1;G.blackout=3;SFX.flick();setTimeout(()=>{SFX.whisper();try{const u=new SpeechSynthesisUtterance(SAVE.name||'Yolcu');u.lang='tr-TR';u.pitch=.1;u.rate=.55;u.volume=Math.min(1,.7*vF());speechSynthesis.speak(u)}catch(e){}},900);G.msg={t:3,s:'',sub:'…',small:true}}
 if(G.n===4&&!G.ev[evKey]&&G.z>20&&dirNow()>0){G.ev[evKey]=1;G.freeze=2.2;SFX.glitch();try{document.title=(SAVE.name||'Yolcu')+' …arkana bak'}catch(e){}}
 if(G.n===5&&!G.ev[evKey]&&G.z>26&&dirNow()>0&&!G.anom){G.ev[evKey]=1;G.flash=1;SFX.bang();G.shake=.8;G.sudden=.18}
 if(G.sudden>0)G.sudden-=dt;
 // takipçi
 const lim=G.n>=5?6:11;
 if(!G.stalker&&((G.idle>lim&&G.loopIndex>0)||(G.chase&&G.z>10&&dirNow()>0))){const dd=G.chase?-1:d;let sz=G.z+dd*(G.chase?12:13);sz=clamp(sz,2,LC-2);G.stalker={z:sz,x:.1,t:0};if(!G.chase)SFX.thud()}
 if(G.stalker){const st=G.stalker;st.t+=dt;const dist=st.z-G.z;if(G.chase||G.idle>.5){const sp=G.chase?2.1:2.6;st.z-=Math.sign(dist)*sp*dt}
  if(Math.abs(st.z-G.z)<1.3)triggerScare('stalker');
  if(!G.chase&&mv&&Math.abs(dist)>9&&G.idle<.2){G.stalker=null}}
 // siluet anomalisi
 if(A('figure')){const dz=Math.abs(30-G.z);if(dz<8.5&&!G.fig){G.fig={z:30};SFX.thud()}if(G.fig){G.fig.z+=Math.sign(G.z-G.fig.z)*4.2*dt;if(Math.abs(G.fig.z-G.z)<1.2)triggerScare('figure')}}else G.fig=null;
 CAM.oy=Math.sin(G.bob)*(run?5:3)*(mv?1:0);CAM.ox=(IN.mx-W/2)*.06;CAM.oy+=(IN.my-H/2)*.04;
 if(G.hint<1)G.hint+=dt*.05;
 setHum(G.blackout>0?.2:1)}
// ---------------------------------------------------------------- 3B çizim yardımcıları
function toCam(x,y,z){const rx=x-CAM.x,rz=z-CAM.z,c=Math.cos(CAM.yaw),s=Math.sin(CAM.yaw);return[rx*c-rz*s,y-EYE,rx*s+rz*c]}
function proj(p){const k=FL/p[2];return[W/2+p[0]*k+CAM.ox,H/2-p[1]*k+CAM.oy]}
function clipNear(pc){const o=[];for(let i=0;i<pc.length;i++){const a=pc[i],b=pc[(i+1)%pc.length],ai=a[2]>=NEAR,bi=b[2]>=NEAR;if(ai)o.push(a);if(ai!==bi){const t=(NEAR-a[2])/(b[2]-a[2]);o.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,NEAR])}}return o}
function poly3(pts,fill,stroke,lw){const pc=pts.map(p=>toCam(p[0],p[1],p[2])),c=clipNear(pc);if(c.length<3)return;g.beginPath();for(let i=0;i<c.length;i++){const q=proj(c[i]);i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1])}g.closePath();if(fill){g.fillStyle=fill;g.fill()}if(stroke||fill){g.strokeStyle=stroke||fill;g.lineWidth=lw||1;g.stroke()}}
const FOG=()=>A('fog')?9:26;
const LAMPS=[3,9,15,21,27,33,39];
function lampOn(i){if(A('lightOut')&&i===3)return 0;return 1}
function bright(zw,rz){let L=.12;for(let i=0;i<LAMPS.length;i++){if(!lampOn(i))continue;const d=zw-LAMPS[i];L+=.6/(1+d*d*.18)}L=Math.min(1,L);if(G.blackout>0)L*=.05;if(A('flicker')&&G.flick>0)L*=.2;if(G.sudden>0)L=1.4;const f=Math.pow(Math.max(0,1-rz/FOG()),1.15);return L*(.18+.82*f)}
