<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Telsiz</title>
<style>
html,body{margin:0;height:100%;background:#050403;color:#e8d9b0;font-family:system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}

</style></head><body><div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
"use strict";
/* ============================================================ TELSİZ
   Karlı geçitte bir telsiz istasyonunda vardiyadasın. Kafile seni çağırıyor; ama hatta başka bir şey de var.
   Kulaklıkla oyna. Konuşan kim? Doğrula. Kapıya ve pencereye gelen sesi duy. */
const W = 1280, H = 720, cv = document.getElementById("c"), g = cv.getContext("2d");
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const SET = Object.assign({ vol: 0.85, scare: 1, tts: true, hints: true }, store.get("ts_set", {}));
const BEST = store.get("ts_best", {});
function hash(s) { let h = 2166136261; s = String(s); for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

/* ------------------------------------------------------------ ses */
const A = { ctx: null, master: null, stat: null, statF: null, wind: null };

    const C = window.AudioContext || window.webkitAudioContext; A.ctx = new C(); A.master = A.ctx.createGain(); A.master.gain.value = SET.vol; A.master.connect(A.ctx.destination);
    const len = A.ctx.sampleRate * 2, w = A.ctx.createBuffer(1, len, A.ctx.sampleRate), d = w.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; A.white = w;
    const br = A.ctx.createBuffer(1, len, A.ctx.sampleRate), bd = br.getChannelData(0); let b = 0; for (let i = 0; i < len; i++) { b = 0.97 * b + 0.03 * (Math.random() * 2 - 1); bd[i] = b * 3; } A.brown = br;
    let s = A.ctx.createBufferSource(); s.buffer = br; s.loop = true; let f = A.ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 500; let gn = A.ctx.createGain(); gn.gain.value = 0.16; s.connect(f); f.connect(gn); gn.connect(A.master); s.start(); A.wind = { f, gn };

    s = A.ctx.createBufferSource(); s.buffer = w; s.loop = true; f = A.ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 2400; f.Q.value = 0.6; gn = A.ctx.createGain(); gn.gain.value = 0; s.connect(f); f.connect(gn); gn.connect(A.master); s.start(); A.stat = gn; A.statF = f;

function tone(freq, dur, type = "sine", vol = 0.2, pan = 0, slide = 0, delay = 0) { if (!A.ctx) return; const t0 = A.ctx.currentTime + delay, o = A.ctx.createOscillator(), gn = A.ctx.createGain(), p = A.ctx.createStereoPanner ? A.ctx.createStereoPanner() : null; o.type = type; o.frequency.setValueAtTime(freq, t0); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t0 + dur); gn.gain.setValueAtTime(0.0001, t0); gn.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); o.connect(gn); if (p) { p.pan.value = clamp(pan, -1, 1); gn.connect(p); p.connect(A.master); } else gn.connect(A.master); o.start(t0); o.stop(t0 + dur + 0.05); }

const SFX = {
  click() { tone(900, 0.04, "square", 0.05); },
  ping() { tone(1100, 0.1, "sine", 0.1); tone(1500, 0.14, "sine", 0.08, 0, 0, 0.1); },
  ring() { for (let i = 0; i < 3; i++) { tone(1000, 0.12, "square", 0.06, 0, 0, i * 0.3); } },
  step(pan, n = 6) { for (let i = 0; i < n; i++) noise(0.13, 0.2 + i * 0.05, 280, 110, "lowpass", pan * (1 - i * 0.12), i * 0.5); },
  scratch(pan) { for (let i = 0; i < 6; i++) noise(0.16, 0.18, 3500, 1800, "bandpass", pan, i * 0.18, 4); },
  knock(pan = 0) { for (let i = 0; i < 3; i++) { noise(0.09, 0.5, 220, 90, "lowpass", pan, i * 0.24); tone(110, 0.1, "sine", 0.3, pan, -50, i * 0.24); } },
  shutter(pan) { noise(0.3, 0.3, 500, 120, "bandpass", pan, 0, 3); tone(80, 0.3, "square", 0.08, pan, -30); },
  lamp() { tone(300, 0.05, "square", 0.05); noise(0.08, 0.08, 1500, 600, "highpass"); },
  breath(pan) { noise(0.9, 0.12, 700, 400, "bandpass", pan, 0, 1.5); },
  whisper(pan) { for (let i = 0; i < 3; i++) noise(0.9, 0.12, 1700 + i * 260, 900, "bandpass", pan, i * 0.3, 6); },
  scare() { const v = [0.55, 0.9, 1.0][SET.scare]; noise(1.4, 0.9 * v, 4000, 200, "bandpass", 0, 0, 0.7); noise(1.2, 0.7 * v, 200, 60, "lowpass"); tone(180, 1.2, "sawtooth", 0.35 * v, 0, -140); tone(540, 1.0, "sawtooth", 0.25 * v, 0, -380); },
  dawn() { [392, 523, 659, 784].forEach((f, i) => tone(f, 1.8, "sine", 0.12, 0, 0, i * 0.4)); },
  cut() { noise(0.25, 0.4, 3000, 200, "bandpass"); },
};

/* ------------------------------------------------------------ konuşma (TTS + altyazı) */
const TTS = { ok: typeof speechSynthesis !== "undefined", voice: null };
function pickVoice() { if (!TTS.ok) return; const vs = speechSynthesis.getVoices(); TTS.voice = vs.find(v => /tr/i.test(v.lang)) || null; }
if (TTS.ok) { pickVoice(); try { speechSynthesis.onvoiceschanged = pickVoice; } catch (e) { } }
function mumble(text, fake, pan = 0) { // sesli okuma yoksa sentezlenmiş mırıltı
  if (!A.ctx) return; const words = text.split(/\s+/); let t = 0;
  for (const wd of words) { const n = Math.max(2, Math.min(7, Math.round(wd.length / 2))); for (let i = 0; i < n; i++) { const f = (fake ? 110 : 170) + ((hash(wd + i) % 90)); tone(f, 0.085, fake ? "sawtooth" : "triangle", 0.045, pan, 0, t); noise(0.07, 0.015, f * 5, f * 3, "bandpass", pan, t, 3); t += 0.09; } t += 0.11; }
}
function speechDur(text) { return Math.max(1.4, text.length * 0.065); }

/* ------------------------------------------------------------ içerik */
const PAROLA = ["Kızıl Elma", "Demir Kar", "Sessiz Çan", "Kırık Ay", "Eski Ardıç", "Soğuk Ateş", "Gümüş Kurt", "Kara Kilit"];
const ITEMS = ["kırmızı fener", "yarım ekmek", "mavi battaniye", "pirinç pusula", "eski bir harita", "kırık bir gözlük"];
const NAMES_T = "Kaptan Selim, Doktor Ayla ve Çoban Hasan";
const NAMES_F = ["Kaptan Selim, Doktor Ayten ve Orhan", "Selim, Ayla… ve bir kişi daha", "Kaptan Selim ve… ve… kimse"];
const ROUTES = [{ n: "Kuzey vadi yolu", c: "çığ riski var; vadiye inmeyin" }, { n: "Eski köprü yolu", c: "köprü çürük; geçilmez" }, { n: "Kızıl işaretli patika", c: "güvenli yol; kızıl bayrakları izleyin" }, { n: "Taş ocağı yolu", c: "tünel çökmüş" }];
const M = { t: 0, calls: [], threats: [] };
function newGame(code) {
  audioInit(); S.code = (code || newCode()).toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8) || newCode(); history.replaceState(null, "", "#s=" + S.code);
  const R = rngf(hash(S.code));
  S.parola = PAROLA[Math.floor(R() * PAROLA.length)]; S.item = ITEMS[Math.floor(R() * ITEMS.length)];
  let ri = [0, 1, 2, 3]; for (let i = 3; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [ri[i], ri[j]] = [ri[j], ri[i]]; } S.routes = ri.map(i => ROUTES[i]); S.safe = S.routes.findIndex(r => r.n === "Kızıl işaretli patika");
  S.freqs = []; for (let i = 0; i < 8; i++) S.freqs.push(+(88.5 + R() * 19).toFixed(1));
  // zaman çizelgesi (saniye): [t, tip, ayrıntı]
  const j = () => (R() - 0.5) * 8; const sd = () => (R() < 0.5 ? -1 : 1);
  S.events = [
    [18 + j(), "true", 0], [58 + j(), "win", sd()], [90 + j(), "fake", 1], [132 + j(), "true", 1], [172 + j(), "door", sd()], [208 + j(), "fake", 2], [248 + j(), "win", sd()], [288 + j(), "true", 2], [332 + j(), "fake", 3], [372 + j(), "door", sd()], [402 + j(), "fake", 4], [430, "win", sd()],
  ].sort((a, b) => a[0] - b[0]);
  S.dawn = 470; S.t = 0; S.next = 0; S.freq = 98.0 + (R() - 0.5) * 6; S.menace = 0; S.saved = 3; S.call = null; S.threat = null; S.screen = "brief"; S.briefT = 0; S.sub = null; S.log = []; S.subs = ""; S.subT = 0; S.shutL = false; S.shutR = false; S.lamp = true; S.breath = false; S.breathBar = 100; S.shake = 0; S.deadT = 0; S.winT = 0; S.paused = false; S.fails = []; S.stats = { fakeCut: 0, trueGood: 0, lost: 0 };
  S.noteOpen = false; S.flashHint = 0; S.msg = ""; S.msgT = 0; try { speechSynthesis.cancel(); } catch (e) { }
}
const S = { screen: "menu", code: "", t: 0, freq: 98, call: null, threat: null, menace: 0, sub: null, subs: "", keys: {}, paused: false, mx: 0, my: 0, drag: false, events: [], next: 0, log: [] };

/* ------------------------------------------------------------ çağrılar */
const Q = {
  parola: "Parola nedir?", who: "Yanınızda kimler var?", item: "Elinizde ne var?", ok: "Güvenli. Yönlendireceğim.", cut: "Hattı kes.",
};
function startCall(kind, idx) {
  const f = S.freqs[S.log.length % 8]; S.freqNeed = f;
  S.call = { kind, idx, f, st: "ring", t: 0, asked: {}, line: "", lines: [], timer: 0, route: null, tuned: false, spoke: false, lastLineT: 0, done: false, lost: false };
  SFX.ring(); say("ÇAĞRI — " + f.toFixed(1) + " MHz. Frekansı ayarla!", 5);
}
function say(t, d = 4) { S.msg = t; S.msgT = d; }
function fakeAnswer(q, tier) {
  if (q === "parola") return tier <= 1 ? ["Parola… hatırlamıyorum. Üşüyorum.", "Parola mı? " + PAROLA[(PAROLA.indexOf(S.parola) + 3) % PAROLA.length] + "."][tier] || "..." : "Parola " + S.parola + ".";
  if (q === "who") return tier <= 2 ? NAMES_F[tier] + "." : tier === 3 ? NAMES_T + "." : NAMES_T + ".";
  if (q === "item") return tier <= 3 ? (tier === 3 ? "Bir " + ITEMS[(ITEMS.indexOf(S.item) + 2) % ITEMS.length] + "." : "Bir şey… var. Tutuyorum.") : "Bir " + S.item + ".";
}
function trueAnswer(q) { if (q === "parola") return "Parola " + S.parola + "."; if (q === "who") return NAMES_T + "."; if (q === "item") return "Elimizde bir " + S.item + " var."; }
function callSay(txt, fake, extra) {
  const c = S.call; c.line = txt; c.lineT = 0; c.speaking = true; c.dur = speechDur(txt); c.fakeVoice = fake; c.said = false; c.spoken = false;
}
function openers(c) {
  if (c.kind === "true") return ["Telsiz istasyonu, duyuyor musunuz? Biz kafile. Yol ayrımındayız.", "İstasyon! Kafile çağırıyor. Hava çok kötü, yönlendirme lazım.", "Duyuyor musunuz? Kar bastırıyor… Yön söyleyin!"][c.idx];
  return ["İstasyon… duyuyor musunuz? Biz kafileyiz. Yardım edin.", "Telsiz, kafile bu. Hemen yön söyleyin.", "Kafile çağırıyor. Yön… yön söyleyin. Çabuk.", "Aç… kapıdayım. Kafile burada. Aç.", "Duyuyor musunuz? Duyuyor musunuz? Duyuyor musunuz?"][c.idx];
}
function callTune(dt) {
  const c = S.call; if (!c) return; if (c.done) { c.dd = (c.dd || 0) + dt; if (c.dd > 1.6) S.call = null; return; } const d = Math.abs(S.freq - c.f); c.tuned = d < 0.35; c.quality = clamp(1 - d / 0.9, 0, 1);
  if (c.st === "ring") { c.t += dt; if (c.tuned) { c.st = "talk"; c.t = 0; callSay(openers(c), c.kind === "fake"); } else if (c.t > 18) { endCall("missed"); } return; }

    else { c.waitT += dt; if (c.waitT > 24) { endCall("silent"); } }

function speakLine(txt, fake) {

function ask(q) {

  c.st = "ask"; c.waitT = 0; const ans = c.kind === "true" ? trueAnswer(q) : fakeAnswer(q, c.idx); c.asked[q] = ans; callSay(ans, c.kind === "fake");

}
function guide() { const c = S.call; if (!c || c.speaking || c.route || c.done || c.st === "ring") return; SFX.click(); c.route = "choose"; c.rt = 0; }
function pickRoute(i) {

  else { S.menace++; say("Hattın öbür ucunda bir şey gülümsedi. Yol tarifini aldı.", 5); SFX.whisper(0); S.shake = 0.4; checkDeath(); }

}

  const c = S.call; if (!c || c.done) return; SFX.cut(); c.done = true;
  if (c.kind === "fake") { S.stats.fakeCut++; say("Hat kesildi. Statik sustu.", 4); } else { loseSurvivor("Gerçek kafileyle bağlantıyı kestin. Biri geride kaldı."); }

}

/* ------------------------------------------------------------ tehditler */
function startThreat(kind, side) {
  S.threat = { kind, side, t: 0, st: "warn", handled: false };
  if (kind === "win") { SFX.scratch(side * 0.85); } else { SFX.step(side * 0.8, 6); }
}
function updateThreat(dt) {
  const T = S.threat; if (!T) return; T.t += dt;

    if (T.t < 6) { if (closed && !T.handled) { T.handled = true; } if (Math.floor(T.t * 3) !== Math.floor((T.t - dt) * 3) && T.t > 1 && !T.handled) SFX.scratch(T.side * 0.85); }

    if (T.t >= 3.2 && !T.knocked) { T.knocked = true; SFX.knock(T.side * 0.3); T.kt = 0; }
    if (T.knocked) { T.kt += dt; if (S.lamp === false && S.breath) T.ok = (T.ok || 0) + dt; if (T.kt > 4.5) { if ((T.ok || 0) > 2.4) say("Vuruşlar kesildi. Adımlar uzaklaştı.", 4); else { S.menace++; say("Kapı kolu döndü… ışık seni ele verdi.", 4); SFX.whisper(0); S.shake = 0.6; checkDeath(); } S.threat = null; } }
  }
}

/* ------------------------------------------------------------ ana güncelleme */
function update(dt) {
  if (S.screen === "dead") { S.deadT += dt; S.shake = Math.max(0, S.shake - dt * 0.6); return; }
  if (S.screen === "win") { S.winT += dt; return; }
  if (S.screen === "brief") { S.briefT += dt; return; }
  if (S.screen !== "play" || S.paused) return;
  S.t += dt; S.msgT = Math.max(0, S.msgT - dt); S.shake = Math.max(0, S.shake - dt * 2);
  // ayar tuşları
  const K = S.keys, step = K["shift"] ? 0.02 : 0.06; if (K["arrowleft"] || K["q"]) S.freq -= step * 60 * dt * 0.5; if (K["arrowright"] || K["e"]) S.freq += step * 60 * dt * 0.5; S.freq = clamp(S.freq, 88, 108);

  callTune(dt); updateThreat(dt);
  // ses karışımı
  if (A.ctx) { const c = S.call; let q = 0; if (c && c.st !== "ring") q = c.quality; const stat = c ? (1 - q) * 0.22 : (0.04 + (Math.abs(S.freq - 98) > 6 ? 0.04 : 0)); A.stat.gain.value = lerp(A.stat.gain.value, stat + S.menace * 0.02 + (c && c.kind === "fake" && c.tuned ? 0.025 : 0), 0.1); A.statF.frequency.value = 1200 + ((S.freq - 88) / 20) * 2400; A.wind.gn.gain.value = lerp(A.wind.gn.gain.value, 0.16 + S.menace * 0.05, 0.05); }
  if (S.t >= S.dawn) { win(); }
