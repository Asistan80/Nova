<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ömür Defteri</title>
<meta name="description" content="Rastgele doğ, yıl yıl yaşa, bir ömür yaz. / Be born at random, live year by year, write a life.">
<style>:root{--bg:#0e1020;--bg2:#161a30;--bg3:#1f2440;--line:#2c3358;--tx:#eef0ff;--mut:#9aa3cc;--gold:#ffcf66;--teal:#5eead4;--pink:#ff7a9c;--blue:#6ea8ff;--green:#7be08a;--purple:#b58cff;--bad:#ff6b6b}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 700px at 20% -10%,#242a5a 0%,transparent 60%),radial-gradient(900px 600px at 110% 10%,#3a1f4d 0%,transparent 55%),var(--bg);color:var(--tx);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0}
#app{max-width:1180px;margin:0 auto;padding:14px 16px 40px;min-height:100%}
.top{display:flex;align-items:center;gap:10px;padding:8px 2px 14px}
.brand{font-weight:800;font-size:20px;letter-spacing:.3px;background:linear-gradient(90deg,var(--gold),var(--pink),var(--purple));-webkit-background-clip:text;color:transparent;cursor:pointer}
.sp{flex:1}
.ib{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 12px;color:var(--mut)}
.ib:hover{color:var(--tx);border-color:#4a5497}
.ib.on{color:var(--gold);border-color:#7a6a2e}
.screen{display:none;animation:fade .4s ease}.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.btn{background:linear-gradient(135deg,#ffcf66,#ff9c5e);color:#2a1a00;border:0;border-radius:14px;padding:13px 26px;font-weight:700;font-size:17px;box-shadow:0 8px 24px #ff9c5e33;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}.btn.g{background:var(--bg3);color:var(--tx);border:1px solid var(--line);box-shadow:none}
.btn.sm{padding:8px 16px;font-size:14px;border-radius:10px}
.card{background:linear-gradient(180deg,var(--bg2),#12152a);border:1px solid var(--line);border-radius:18px;padding:18px}
/* home */
.hero{text-align:center;padding:40px 10px 20px}
.hero h1{font-size:clamp(34px,6vw,64px);font-weight:900;letter-spacing:-1px;line-height:1.05}
.hero h1 span{background:linear-gradient(90deg,var(--gold),var(--pink),var(--purple),var(--teal));-webkit-background-clip:text;color:transparent;background-size:200%;animation:flow 8s linear infinite}
@keyframes flow{to{background-position:200% 0}}
.hero p{color:var(--mut);max-width:620px;margin:14px auto 24px;font-size:18px}
.home-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.challenge{max-width:560px;margin:14px auto;background:#2a2342;border:1px solid #5b4a8f;border-radius:14px;padding:12px 16px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12.5px;padding:2px 9px;border-radius:99px;background:var(--bg3);border:1px solid var(--line);color:var(--mut)}
.chip.up{color:var(--green);border-color:#2f6b3a}.chip.dn{color:var(--bad);border-color:#7a3333}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:26px}
.facts div{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--mut);font-size:14.5px}
.facts b{display:block;color:var(--tx);margin-bottom:4px}
select.sel{background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
/* birth */
.wheel{max-width:640px;margin:30px auto;text-align:center}
.slot{height:84px;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,5vw,46px);font-weight:800;border-radius:18px;background:linear-gradient(180deg,#1b2043,#12152a);border:1px solid var(--line);overflow:hidden;position:relative}
.slot.spin{color:var(--mut)}.slot.land{color:var(--gold);animation:pop .5s}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.cert{max-width:640px;margin:18px auto;position:relative;background:linear-gradient(180deg,#fbf1d6,#f1e0b0);color:#3a2c12;border-radius:16px;padding:26px 28px;box-shadow:0 20px 60px #0008;border:3px double #b8934a;animation:fade .6s}
.cert h2{font-family:Georgia,serif;text-align:center;letter-spacing:2px;font-size:22px;margin-bottom:12px;color:#5a3d12}
.cert .row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed #c9ac6c;padding:6px 0;font-size:16px}
.cert .row b{font-family:Georgia,serif}
.cert .odds{font-size:30px;text-align:center;font-weight:800;color:#7a4d0a;margin:10px 0 2px}
.cert .sub{text-align:center;color:#7a6330;font-size:14px}
.attrs{margin-top:12px}.attr{display:flex;align-items:center;gap:10px;font-size:13.5px;margin:4px 0}.attr i{display:block;height:8px;border-radius:5px;background:#c9ac6c}.attr span{width:110px}.attr .bar{flex:1;background:#e3cf9a;border-radius:5px;overflow:hidden}
/* life */
.life{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}
.side{position:sticky;top:10px}
.pers{display:flex;gap:12px;align-items:center}
.avatar{width:120px;height:132px;flex:none;border-radius:16px;background:var(--bg3);overflow:hidden}
.pname{font-size:20px;font-weight:800;line-height:1.2}.pmeta{color:var(--mut);font-size:13.5px}
.agebig{font-size:34px;font-weight:900;line-height:1;color:var(--gold)}
.meters{margin-top:14px;display:grid;gap:9px}
.m{position:relative}.m .lb{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:3px}.m .lb b{color:var(--tx);font-variant-numeric:tabular-nums}
.m .bar{height:11px;background:#0b0d1d;border-radius:8px;overflow:hidden;border:1px solid #232850}
.m .bar i{display:block;height:100%;border-radius:8px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.m .d{position:absolute;right:30px;top:-3px;font-weight:800;font-size:13px;opacity:0;pointer-events:none}.m .d.show{animation:dlt 1.6s ease-out}
@keyframes dlt{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.pri{margin-top:14px}.pri h4{margin:0 0 6px;font-size:13px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.pbtn{display:block;width:100%;text-align:left;background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:7px 10px;margin-bottom:5px;transition:.15s}
.pbtn small{display:block;color:var(--mut);font-size:11.5px}.pbtn:hover{border-color:#4a5497}.pbtn.on{border-color:var(--gold);background:#2d2a3c}
.main{display:grid;gap:14px;min-width:0}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sbtn{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 12px;color:var(--mut)}.sbtn.on{color:#2a1a00;background:var(--gold);border-color:var(--gold)}
.yearbar{height:6px;background:#0b0d1d;border-radius:5px;overflow:hidden;flex:1;min-width:80px}.yearbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--blue))}
.stage{min-height:150px;position:relative;overflow:hidden}
.stage .ag{font-size:13px;color:var(--mut);margin-bottom:6px}
.stage .tx{font-size:19px;line-height:1.5}.stage .rs{margin-top:8px;color:var(--teal);font-size:16px}
.stage.q .tx{color:var(--mut)}
.choices{display:grid;gap:8px;margin-top:14px}
.cbtn{background:linear-gradient(180deg,#242a52,#1b2043);border:1px solid #3b4482;border-radius:12px;padding:12px 14px;text-align:left;font-size:16px;transition:.15s;display:flex;gap:10px;align-items:center}
.cbtn:hover{border-color:var(--gold);transform:translateX(3px)}.cbtn kbd{background:#0b0d1d;border:1px solid var(--line);border-radius:6px;padding:0 7px;color:var(--mut);font-size:12px}
.cbtn .hn{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.feed{display:grid;gap:8px;max-height:520px;overflow:auto;padding-right:4px}
.ent{background:var(--bg2);border:1px solid var(--line);border-left:4px solid var(--c,#4a5497);border-radius:12px;padding:10px 12px;animation:slide .5s}
@keyframes slide{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.ent.quiet{opacity:.6;padding:6px 12px}
.ent .eh{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut)}.ent .eh b{color:var(--gold);font-size:15px}
.ent .et{margin-top:2px}.ent .ch{color:var(--blue);font-size:14px;margin-top:3px}.ent .er{color:var(--teal);font-size:15px;margin-top:2px}
.star{margin-left:auto;background:none;border:0;color:#6b739f;font-size:18px;padding:0 4px}.star.on{color:var(--gold)}
.cat-fam{--c:#ff9ec0}.cat-school{--c:#6ea8ff}.cat-work{--c:#c4a35a}.cat-health{--c:#ff6b6b}.cat-love{--c:#ff7ab8}.cat-world{--c:#9a7bff}.cat-money{--c:#7be08a}.cat-life{--c:#5eead4}.cat-quiet{--c:#2c3358}
canvas.chart{width:100%;height:150px;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
/* end */
.endhead{text-align:center;padding:22px 8px 6px}
.stone{display:inline-block;background:linear-gradient(180deg,#3a3f66,#232745);border:1px solid #565e9a;border-radius:90px 90px 14px 14px;padding:34px 44px 22px;min-width:min(520px,92vw);box-shadow:0 20px 60px #0008}
.stone h2{font-size:clamp(26px,5vw,38px)}.stone .yrs{color:var(--mut);margin:4px 0 12px}.stone .big{font-size:56px;font-weight:900;color:var(--gold);line-height:1}
.stone .cause{margin-top:10px;font-size:18px}.stone .ep{color:var(--teal);margin-top:10px;font-style:italic}
.grade{display:inline-flex;align-items:center;justify-content:center;width:70px;height:70px;border-radius:50%;font-size:38px;font-weight:900;background:conic-gradient(var(--gold),var(--pink),var(--purple),var(--gold));color:#1a1030;margin-top:14px;box-shadow:0 8px 30px #ff9c5e44}
.endgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-top:16px}
.stat{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0;font-size:15px}.stat span{color:var(--mut)}
.badges{display:flex;flex-wrap:wrap;gap:8px}.bdg{background:var(--bg3);border:1px solid #6a5a2a;border-radius:12px;padding:8px 12px;font-size:14px}.bdg small{display:block;color:var(--mut);font-size:12px}.bdg.new{border-color:var(--gold);box-shadow:0 0 18px #ffcf6644}.bdg.lock{opacity:.35;border-color:var(--line)}
.hl{margin:6px 0;padding-left:10px;border-left:3px solid var(--gold);font-size:14.5px}.hl b{color:var(--gold)}
/* modal */
.modal{position:fixed;inset:0;background:#05061499;backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}.modal.on{display:flex}
.mbox{background:var(--bg2);border:1px solid var(--line);border-radius:18px;max-width:760px;width:100%;max-height:88vh;overflow:auto;padding:20px;animation:fade .3s}
.mbox h2{margin-bottom:12px}.x{float:right}
.bk{display:grid;gap:8px}.bk .it{background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}.bk .it:hover{border-color:#4a5497}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#232850;border:1px solid var(--gold);padding:10px 18px;border-radius:12px;z-index:80;opacity:0;pointer-events:none;transition:.3s}.toast.on{opacity:1}
.tip{background:#1c2a3e;border:1px solid #2f5b86;border-radius:12px;padding:10px 14px;color:#cfe6ff;font-size:14.5px}
@media(max-width:860px){.meters{grid-template-columns:1fr 1fr;gap:8px 14px}.pri .pbtn small{display:none}.pri{display:grid;grid-template-columns:1fr 1fr;gap:5px}.pri h4{grid-column:1/-1}.pri .pbtn{margin:0;padding:6px 8px;font-size:14px}.top{flex-wrap:wrap}.ib{padding:5px 9px;font-size:13px}.brand{flex:1 1 100%}.stage .tx{font-size:17px}.life{grid-template-columns:1fr}.side{position:static}.endgrid{grid-template-columns:1fr}.avatar{width:96px;height:108px}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <span class="brand" data-t="brand">Ömür Defteri</span><span class="sp"></span>
    <button class="ib" id="b-book" data-t="book">Hayatlar Defteri</button>
    <button class="ib" id="b-badges" data-t="badges">Rozetler</button>
    <button class="ib" id="b-help" data-t="help">Nasıl oynanır?</button>
    <button class="ib" id="b-snd" title="Ses">♪</button>
    <button class="ib" id="b-lang">EN</button>
  </div>

  <section class="screen on" id="s-home">
    <div class="hero">
      <h1><span data-t="brand">Ömür Defteri</span></h1>
      <p data-t="sub"></p>
      <p style="font-size:16px" data-t="lead"></p>
      <div id="challenge" class="challenge" style="display:none"></div>
      <div class="home-row"><button class="btn" id="h-start">Hayata başla</button><button class="btn g" id="h-fresh" style="display:none"></button></div>
      <div class="home-row"><select class="sel" id="h-prac"></select></div>
      <div class="mut" style="color:var(--mut);font-size:13px" data-t="practiceNote"></div>
    </div>
    <div class="facts">
      <div><b data-t="f1t"></b><span data-t="f1"></span></div><div><b data-t="f2t"></b><span data-t="f2"></span></div>
      <div><b data-t="f3t"></b><span data-t="f3"></span></div><div><b data-t="f4t"></b><span data-t="f4"></span></div>
    </div>
    <p style="text-align:center;color:var(--mut);font-size:13px;margin-top:26px" data-t="fictional"></p>
  </section>

  <section class="screen" id="s-birth">
    <div class="wheel"><div id="birth-msg" style="color:var(--mut);margin-bottom:8px"></div><div class="slot spin" id="slot">…</div></div>
    <div id="birth-cert"></div>
    <div id="birth-actions" class="home-row" style="display:none"><button class="btn" id="birth-begin"></button><button class="btn g" id="birth-redo"></button></div>
  </section>

  <section class="screen" id="s-life">
    <div class="life">
      <aside class="side card">
        <div class="pers"><div class="avatar" id="av"></div><div><div class="pname" id="pname"></div><div class="agebig" id="agebig"></div><div class="pmeta" id="pmeta"></div><div class="pmeta" id="pmeta2"></div></div></div>
        <div class="meters" id="meters"></div>
        <div class="pri" id="pri"></div>
      </aside>
      <div class="main">
        <div class="ctrl">
          <button class="sbtn" id="c-pause">Duraklat</button><button class="sbtn" id="c-next" data-t="next"></button>
          <button class="sbtn" data-sp="1" data-t="slow"></button><button class="sbtn" data-sp="2" data-t="norm"></button><button class="sbtn" data-sp="3" data-t="fast"></button>
          <button class="sbtn" id="c-auto" data-t="auto"></button><div class="yearbar" id="yearbar"><i></i></div>
        </div>
        <div class="tip" id="tip"></div>
        <div class="card stage" id="stage"></div>
        <div id="choices" class="choices"></div>
        <div class="card"><h3 style="font-size:15px;color:var(--mut);margin-bottom:6px" data-t="chart"></h3><canvas class="chart" id="chart"></canvas><div class="legend" id="legend"></div></div>
        <div><h3 style="font-size:15px;color:var(--mut);margin:4px 0 8px" data-t="feed"></h3><div class="feed" id="feed"></div></div>
        <div style="color:var(--mut);font-size:12.5px;text-align:center" id="fict"></div>
      </div>
    </div>
  </section>

  <section class="screen" id="s-end">
    <div class="endhead" id="end-stone"></div>
    <div class="endgrid">
      <div class="card"><h3 style="margin-bottom:6px" data-t="chart"></h3><canvas class="chart" id="end-chart" style="height:190px"></canvas><div class="legend" id="end-legend"></div>
        <h3 style="margin:16px 0 6px" data-t="hls"></h3><div id="end-hl"></div></div>
      <div class="card"><h3 style="margin-bottom:6px" data-t="avg"></h3><div class="meters" id="end-avg"></div>
        <h3 style="margin:16px 0 6px" data-t="summary"></h3><div id="end-sum"></div>
        <h3 style="margin:16px 0 8px" data-t="earned"></h3><div class="badges" id="end-badges"></div></div>
    </div>
    <div class="home-row" style="margin-top:18px"><button class="btn" id="e-share" data-t="share"></button><button class="btn g" id="e-copy" data-t="copy"></button><button class="btn g" id="e-link" data-t="link"></button></div>
    <div class="home-row"><button class="btn g" id="e-new" data-t="again2"></button><button class="btn g" id="e-same" data-t="same"></button><button class="btn g" id="e-book" data-t="book"></button></div>
  </section>
</div>
<div class="modal" id="m-book"></div><div class="modal" id="m-badges"></div><div class="modal" id="m-help"></div>
<div class="toast" id="toast"></div>
<script>
/* Ömür Defteri - çekirdek (DOM yok): ülkeler, motor, ölüm, rozetler */
const OD = {};
(function () {
  const T = (tr, en) => ({ tr, en });
  OD.T = T;

  // ---------------------------------------------------------------- RNG
  OD.rng = function (seed) {
    let a = seed >>> 0;
    const f = function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    return f;
  };
  OD.hashSeed = function (s) {
    s = String(s);
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  };
  OD.newSeedCode = function () {
    const ch = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let s = "";
    for (let i = 0; i < 6; i++) s += ch[Math.floor(Math.random() * ch.length)];
    return s;
  };

  // ---------------------------------------------------------------- ülkeler
  // [kod, tr, en, doğum(milyon), sağlık, eğitim, refah, huzur, yaşam beklentisi, deprem, zorunlu hizmet, isim havuzu]
  const C = [
    ["IN", "Hindistan", "India", 23, .45, .55, .25, .6, 70, .5, 0, "sa"],
    ["NG", "Nijerya", "Nigeria", 7.5, .25, .35, .2, .35, 54, .1, 0, "af"],
    ["CN", "Çin", "China", 9, .7, .7, .5, .8, 78, .4, 0, "ea"],
    ["PK", "Pakistan", "Pakistan", 7, .35, .35, .22, .45, 67, .5, 0, "sa"],
    ["ID", "Endonezya", "Indonesia", 4.5, .5, .6, .35, .7, 71, .7, 0, "ea"],
    ["ET", "Etiyopya", "Ethiopia", 4.3, .3, .3, .12, .4, 67, .3, 0, "af"],
    ["US", "ABD", "USA", 3.6, .75, .8, .9, .7, 78, .3, 0, "en"],
    ["CD", "Kongo DC", "DR Congo", 3.7, .15, .25, .05, .2, 61, .1, 0, "af"],
    ["BD", "Bangladeş", "Bangladesh", 3.2, .45, .5, .22, .6, 73, .4, 0, "sa"],
    ["BR", "Brezilya", "Brazil", 2.5, .6, .65, .45, .55, 75, .05, 0, "la"],
    ["MX", "Meksika", "Mexico", 2.0, .6, .65, .5, .5, 75, .5, 0, "la"],
    ["EG", "Mısır", "Egypt", 2.1, .5, .55, .35, .6, 72, .1, 1, "ar"],
    ["PH", "Filipinler", "Philippines", 2.4, .5, .6, .3, .55, 71, .6, 0, "ea"],
    ["TZ", "Tanzanya", "Tanzania", 2.5, .3, .35, .12, .6, 66, .1, 0, "af"],
    ["UG", "Uganda", "Uganda", 1.8, .3, .35, .1, .5, 64, .1, 0, "af"],
    ["SD", "Sudan", "Sudan", 1.6, .2, .3, .1, .2, 66, .05, 0, "ar"],
    ["AF", "Afganistan", "Afghanistan", 1.4, .2, .25, .08, .2, 63, .5, 0, "ar"],
    ["IR", "İran", "Iran", 1.2, .6, .65, .35, .5, 77, .7, 1, "ar"],
    ["TR", "Türkiye", "Türkiye", 1.0, .7, .65, .5, .6, 78, .7, 1, "tr"],
    ["JP", "Japonya", "Japan", .75, .95, .85, .8, .9, 85, .8, 0, "ea"],
    ["DE", "Almanya", "Germany", .7, .9, .85, .85, .85, 81, .02, 0, "eu"],
    ["GB", "Birleşik Krallık", "United Kingdom", .65, .85, .85, .8, .85, 81, .02, 0, "en"],

  const CATC = { fam: "cat-fam", school: "cat-school", work: "cat-work", health: "cat-health", love: "cat-love", world: "cat-world", money: "cat-money", life: "cat-life", quiet: "cat-quiet" };
  function entryHTML(e, idx) {
    const choice = e.choice ? `<div class="ch">&rsaquo; ${esc(tx(e.choice))}</div>` : "";
    const res = e.r ? `<div class="er">${esc(tx(e.r))}</div>` : "";
    return `<div class="ent ${CATC[e.cat] || ""} ${e.quiet ? "quiet" : ""}" data-i="${idx}"><div class="eh"><b>${e.age}</b><span>${e.year}</span><span>· ${esc(cname(OD.byCode[e.country]))}</span><button class="star ${e.star ? "on" : ""}" title="${t("star")}">${e.star ? "★" : "☆"}</button></div><div class="et">${esc(tx(e.t))}</div>${choice}${res}<div class="chips">${fmtD(e.d)}</div></div>`;
  }
  function pushEntries() {
    const L = G.L, feed = $("#feed");
    let lastReal = null;
    for (; G.shown < L.log.length; G.shown++) {
      const e = L.log[G.shown];
      feed.insertAdjacentHTML("afterbegin", entryHTML(e, G.shown));
      if (!e.quiet) lastReal = e; else if (!lastReal) lastReal = e;
      if (e.star) sfx.star(); else if (!e.quiet) {
        const net = Object.values(e.d).reduce((s, v) => s + v, 0);
        (net < -6) ? sfx.bad() : (net > 6 ? sfx.good() : sfx.event());
      }
    }
    if (lastReal) setStage(lastReal);
    $$(".star", feed).forEach(b => { b.onclick = () => { const i = +b.closest(".ent").dataset.i; OD.toggleStar(L, i); b.classList.toggle("on", L.log[i].star); b.textContent = L.log[i].star ? "★" : "☆"; if (L.log[i].star) sfx.star(); }; });

  // ------------------------------------------------------------ grafik
  function drawChart(cv, series, L, big) {
    if (!cv) return;
    const dpr = window.devicePixelRatio || 1, w = cv.clientWidth || 500, h = cv.clientHeight || 150;
    cv.width = w * dpr; cv.height = h * dpr;
    const c = cv.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, h);
    c.strokeStyle = "#2c3358"; c.lineWidth = 1; c.fillStyle = "#6b739f"; c.font = "11px sans-serif";
    for (let v = 0; v <= 100; v += 25) { const y = h - 18 - (h - 26) * v / 100; c.beginPath(); c.moveTo(26, y); c.lineTo(w - 4, y); c.stroke(); c.fillText(v, 2, y + 3); }
    if (!series.length) return;
    const maxA = Math.max(20, series[series.length - 1].age);
    const X = a => 28 + (w - 34) * a / maxA, Y = v => h - 18 - (h - 26) * v / 100;
    for (let a = 0; a <= maxA; a += maxA > 80 ? 20 : 10) c.fillText(a, X(a) - 6, h - 4);
    MET.slice(0, 4).forEach(([k, , col]) => {
      c.strokeStyle = col; c.lineWidth = 2; c.beginPath();
      series.forEach((p, i) => { const x = X(p.age), y = Y(p[k]); i ? c.lineTo(x, y) : c.moveTo(x, y); });
      c.stroke();
    });
    // yıldızlı anılar
    if (L) L.log.forEach(e => { if (e.star) { c.fillStyle = "#ffcf66"; c.beginPath(); c.arc(X(e.age), h - 18, 3.2, 0, 7); c.fill(); } });
  }
  function legend() { return MET.slice(0, 4).map(([k, key, col]) => `<span><i style="background:${col}"></i>${t(key)}</span>`).join(""); }

  function loadBook() { return store.get("od_lives", []); }
  function finishLife() {

      L.badges.forEach(id => { if (!have[id]) { have[id] = L.ended; fresh.push(id); } });
      store.set("od_badges", have);
      const book = loadBook();
      book.unshift({ seed: L.seed, name: L.name, c: L.birthCountry.code, birth: L.birth, age: L.deathAge, cause: L.cause, score: L.score, grade: L.grade, badges: L.badges, at: L.ended, kids: L.kidCount, career: L.career, odds: L.odds,
        stars: L.log.filter(e => e.star).slice(0, 14).map(e => ({ age: e.age, t: e.t, r: e.r })) });

      <div class="cause">${esc(tx(OD.fmt(L, L.cause)))}</div><div class="ep">${esc(tx(L.epitaph.main))}${L.epitaph.extra.map(x => " " + esc(tx(x))).join("")}</div>

    const A = L.avg;
    $("#end-avg").innerHTML = MET.map(([k, key, col]) => `<div class="m"><div class="lb"><span>${t(key)}</span><b>${Math.round(A[k])}</b></div><div class="bar"><i style="background:${col};width:${Math.round(A[k])}%"></i></div></div>`).join("");
    $("#end-sum").innerHTML = [
      [t("country"), cname(L.birthCountry)], [t("odd"), fillT("odds", { n: L.odds })], [t("family"), fam(L)],
      [t("liveds"), L.lived.map(c => cname(OD.byCode[c])).join(" → ")], [t("career"), careerName(L)], [t("kids"), L.kidCount], [t("seedTxt"), L.seed],
    ].map(([a, b]) => `<div class="stat"><span>${a}</span><b>${esc(b)}</b></div>`).join("");
    $("#end-hl").innerHTML = stars.length ? stars.slice(0, 14).map(e => `<div class="hl"><b>${e.age}</b> ${esc(tx(e.t))}${e.r ? " <span style='color:var(--teal)'>" + esc(tx(e.r)) + "</span>" : ""}</div>`).join("") : "<div class='mut' style='color:var(--mut)'>—</div>";
    $("#end-badges").innerHTML = L.badges.length ? L.badges.map(id => { const b = OD.BADGES.find(x => x.id === id); return `<div class="bdg ${fresh.includes(id) ? "new" : ""}">${fresh.includes(id) ? `<small style="color:var(--gold)">${t("newb")}</small>` : ""}<b>${lang === "tr" ? b.tr : b.en}</b><small>${lang === "tr" ? b.dtr : b.den}</small></div>`; }).join("") : `<div class="mut" style="color:var(--mut)">${t("none")}</div>`;
  }
  const shareText = () => { const L = G.L; return fillT("shareText", { n: L.name, c: cname(L.birthCountry), o: L.odds, a: L.deathAge, g: L.grade }) + " " + shareLink(); };
  const shareLink = () => location.href.split("#")[0] + "#s=" + G.L.seed;

  // ------------------------------------------------------------ paylaşım kartı
  function cardCanvas() {
    const L = G.L, W = 1080, H = 1350, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    const c = cv.getContext("2d");
    const g = c.createLinearGradient(0, 0, W, H); g.addColorStop(0, "#1c2150"); g.addColorStop(.55, "#2a1d4d"); g.addColorStop(1, "#0e1020");
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    c.globalAlpha = .08; c.fillStyle = "#fff"; for (let i = 0; i < 70; i++) { c.beginPath(); c.arc(Math.random() * W, Math.random() * H, Math.random() * 3 + 1, 0, 7); c.fill(); } c.globalAlpha = 1;
    c.textAlign = "center"; c.fillStyle = "#ffcf66"; c.font = "700 34px sans-serif"; c.fillText(t("cardTitle"), W / 2, 96);
    c.fillStyle = "#eef0ff"; c.font = "800 84px sans-serif"; c.fillText(L.name, W / 2, 220);
    c.fillStyle = "#9aa3cc"; c.font = "400 38px sans-serif"; c.fillText(`${L.birth} – ${L.birth + L.deathAge}  ·  ${cname(L.birthCountry)}`, W / 2, 285);
    c.fillStyle = "#ffcf66"; c.font = "900 220px sans-serif"; c.fillText(L.deathAge, W / 2, 500);
    c.fillStyle = "#9aa3cc"; c.font = "400 40px sans-serif"; c.fillText(t("years"), W / 2, 550);
    // not
    const gr = c.createLinearGradient(W / 2 - 60, 600, W / 2 + 60, 720); gr.addColorStop(0, "#ffcf66"); gr.addColorStop(1, "#ff7a9c");
    c.fillStyle = gr; c.beginPath(); c.arc(W / 2, 640, 62, 0, 7); c.fill(); c.fillStyle = "#1a1030"; c.font = "900 76px sans-serif"; c.fillText(L.grade, W / 2, 668);
    c.fillStyle = "#eef0ff"; c.font = "400 38px sans-serif";
    wrap(c, tx(OD.fmt(L, L.cause)), W / 2, 760, 880, 50);
    c.fillStyle = "#5eead4"; c.font = "italic 36px sans-serif"; wrap(c, tx(L.epitaph.main), W / 2, 850, 880, 48);
    // grafik
    const gx = 90, gy = 930, gw = W - 180, gh = 220;
    c.fillStyle = "#ffffff0a"; roundRect(c, gx - 20, gy - 20, gw + 40, gh + 60, 22); c.fill();
    const maxA = Math.max(20, L.series[L.series.length - 1].age);
    MET.slice(0, 4).forEach(([k, , col]) => { c.strokeStyle = col; c.lineWidth = 5; c.beginPath(); L.series.forEach((p, i) => { const x = gx + gw * p.age / maxA, y = gy + gh - gh * p[k] / 100; i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke(); });
    c.font = "26px sans-serif"; c.textAlign = "left"; let lx = gx;
    MET.slice(0, 4).forEach(([k, key, col]) => { c.fillStyle = col; c.fillRect(lx, gy + gh + 18, 18, 18); c.fillStyle = "#c8cdef"; c.fillText(t(key), lx + 26, gy + gh + 35); lx += 210; });
    c.textAlign = "center"; c.fillStyle = "#9aa3cc"; c.font = "30px sans-serif";
    c.fillText(`${fillT("odds", { n: L.odds })} · ${t("odd")}`, W / 2, 1215);
    c.fillStyle = "#ffcf66"; c.font = "700 36px sans-serif"; c.fillText(`${t("seedTxt")}: ${L.seed}`, W / 2, 1270);
    c.fillStyle = "#6b739f"; c.font = "26px sans-serif"; c.fillText(location.host || "omur-defteri", W / 2, 1315);
    return cv;
  }
  function wrap(c, text, x, y, mw, lh) { const words = text.split(" "); let line = "", yy = y; for (const w of words) { const test = line + w + " "; if (c.measureText(test).width > mw && line) { c.fillText(line.trim(), x, yy); line = w + " "; yy += lh; } else line = test; } c.fillText(line.trim(), x, yy); }
  function roundRect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  async function shareCard() {
    const cv = cardCanvas();
    cv.toBlob(async blob => {
      const file = new File([blob], "omur-defteri.png", { type: "image/png" });
      try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text: shareText() }); return; } } catch (e) { }
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "omur-defteri-" + G.L.name + ".png"; a.click();
      toast(t("saved"));
    });
  }
  async function copyText(txt) { try { await navigator.clipboard.writeText(txt); } catch (e) { const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (e2) { } ta.remove(); } toast(t("copied")); }

  // ------------------------------------------------------------ defter, rozetler, yardım
  function openBook() {
    const book = loadBook();
    const avg = book.length ? Math.round(book.reduce((s, b) => s + b.age, 0) / book.length) : 0, mx = book.length ? Math.max(...book.map(b => b.age)) : 0;
    $("#m-book").innerHTML = `<div class="mbox"><button class="ib x" id="x-book">${t("close")}</button><h2>${t("book")}</h2>${book.length ? `<div class="mut" style="color:var(--mut);margin-bottom:10px">${fillT("bookSum", { n: book.length, a: avg, m: mx })}</div>` : ""}
      <div class="bk">${book.length ? book.map((b, i) => `<div class="it" data-i="${i}"><b>${esc(b.name)}</b> · ${esc(cname(OD.byCode[b.c]))} · ${b.birth}–${b.birth + b.age} <span class="chip" style="float:right">${b.grade} · ${b.age} ${t("years")}</span><div style="color:var(--mut);font-size:13.5px">${esc(tx(OD.fmt({ name: b.name, c: OD.byCode[b.c], birthCountry: OD.byCode[b.c], kids: [], age: b.age, birth: b.birth }, b.cause)))}</div><div class="det" style="display:none;margin-top:8px">${b.stars.map(s => `<div class="hl"><b>${s.age}</b> ${esc(tx(s.t))}${s.r ? " <span style='color:var(--teal)'>" + esc(tx(s.r)) + "</span>" : ""}</div>`).join("")}<div style="margin-top:6px"><button class="btn sm g" data-ch="${b.seed}">${t("link")}</button></div></div></div>`).join("") : `<div class="mut" style="color:var(--mut)">${t("bookEmpty")}</div>`}</div>
      ${book.length ? `<div style="margin-top:12px"><button class="btn sm g" id="b-clear">${t("clear")}</button></div>` : ""}</div>`;
    modal("m-book", true);
    $("#x-book").onclick = () => modal("m-book", false);
    $$("#m-book .it").forEach(it => it.onclick = e => { if (e.target.closest("button")) return; const d = it.querySelector(".det"); d.style.display = d.style.display === "none" ? "block" : "none"; });
    $$("#m-book [data-ch]").forEach(b => b.onclick = () => copyText(location.href.split("#")[0] + "#s=" + b.dataset.ch));
    const cl = $("#b-clear"); if (cl) cl.onclick = () => { if (confirm(t("confirm"))) { store.set("od_lives", []); openBook(); } };
  }
  function openBadges() {
    const have = store.get("od_badges", {});
    $("#m-badges").innerHTML = `<div class="mbox"><button class="ib x" id="x-bdg">${t("close")}</button><h2>${t("badges")} · ${Object.keys(have).length}/${OD.BADGES.length}</h2><div class="badges">${OD.BADGES.map(b => `<div class="bdg ${have[b.id] ? "" : "lock"}"><b>${lang === "tr" ? b.tr : b.en}</b><small>${lang === "tr" ? b.dtr : b.den}</small></div>`).join("")}</div></div>`;
    modal("m-badges", true); $("#x-bdg").onclick = () => modal("m-badges", false);
  }
  function openHelp() {
    $("#m-help").innerHTML = `<div class="mbox"><button class="ib x" id="x-help">${t("close")}</button><h2>${t("help")}</h2>${t("helpBody")}<p style="color:var(--mut);font-size:14px">${t("fictional")}</p></div>`;
    modal("m-help", true); $("#x-help").onclick = () => modal("m-help", false);
  }

  // ------------------------------------------------------------ olaylar
  function newGame(seedFromHash, practice) {
    const seed = seedFromHash || OD.newSeedCode();
    if (!practice) history.replaceState(null, "", "#s=" + seed);
    startBirth(seed, practice || null);
  }
  function init() {
    i18nStatic(); renderHome();
    $("#b-lang").onclick = () => { lang = lang === "tr" ? "en" : "tr"; store.set("od_lang", lang); i18nStatic(); renderHome(); if (G.L) { if ($("#s-life").classList.contains("on")) { relang(); } else if ($("#s-end").classList.contains("on")) renderEnd(); else if ($("#s-birth").classList.contains("on") && G.birthL) land(); } };
    $("#b-snd").onclick = () => { soundOn = !soundOn; store.set("od_sound", soundOn); i18nStatic(); };
    $("#b-book").onclick = openBook; $("#b-badges").onclick = openBadges; $("#b-help").onclick = openHelp;
    $(".brand").onclick = () => { clearTimeout(G.timer); G.L = null; renderHome(); show("s-home"); };
    $("#h-start").onclick = () => {
      const pr = $("#h-prac").value;
      const m = location.hash.match(/s=([A-Za-z0-9]{4,12})/);
      newGame(m ? m[1].toUpperCase() : null, pr || null);
    };
    $("#h-fresh").onclick = () => { history.replaceState(null, "", location.pathname); renderHome(); newGame(null, $("#h-prac").value || null); };
    $("#birth-begin").onclick = beginLife;
    $("#birth-redo").onclick = () => newGame(G.practice ? OD.newSeedCode() : null, G.practice ? G.L.c.code : null);
    $("#c-pause").onclick = () => setPaused(!G.paused);
    $("#c-next").onclick = () => { if (G.L && !G.L.pending && !G.L.dead) { clearTimeout(G.timer); advance(); } };
    $("#c-auto").onclick = () => { G.auto = !G.auto; store.set("od_auto", G.auto); renderSide(); if (G.auto && G.L && G.L.pending) showPending(); };
    $$(".sbtn[data-sp]").forEach(b => b.onclick = () => { G.speed = +b.dataset.sp; renderSide(); if (!G.paused) schedule(); });
    $("#e-share").onclick = shareCard;
    $("#e-copy").onclick = () => copyText(shareText());
    $("#e-link").onclick = () => copyText(shareLink());
    $("#e-new").onclick = () => { history.replaceState(null, "", location.pathname); newGame(null, G.practice ? G.L.c.code : null); };
    $("#e-same").onclick = () => newGame(G.L.seed, G.practice ? G.L.c.code : null);
    $("#e-book").onclick = openBook;
    document.addEventListener("keydown", e => {
      if (e.target.closest && e.target.closest("input,select,textarea")) return;
      if (!$("#s-life").classList.contains("on")) return;
      if (e.key === " ") { e.preventDefault(); setPaused(!G.paused); }
      else if (e.key.toLowerCase() === "n") $("#c-next").click();
      else if (e.key.toLowerCase() === "a") $("#c-auto").click();
      else if (/^[1-9]$/.test(e.key) && G.L && G.L.pending) { const i = +e.key - 1; if (i < G.L.pending.choices.length) pick(i); }
    });
    document.addEventListener("visibilitychange", () => { if (document.hidden && G.L && $("#s-life").classList.contains("on") && !G.paused) setPaused(true); });
    window.addEventListener("resize", () => { if (G.L && $("#s-life").classList.contains("on")) drawChart($("#chart"), G.L.series, G.L); });
    window.addEventListener("hashchange", renderHome);
    $("#legend").innerHTML = legend();
    window.__OD_G = G;
  }
  function relang() {
    const L = G.L;
    $("#feed").innerHTML = ""; G.shown = 0;
    // geçmiş girişleri yeniden çiz (eski -> yeni)
    const feed = $("#feed");
    L.log.forEach((e, i) => feed.insertAdjacentHTML("afterbegin", entryHTML(e, i)));
    G.shown = L.log.length;
    $$(".star", feed).forEach(b => { b.onclick = () => { const i = +b.closest(".ent").dataset.i; OD.toggleStar(L, i); b.classList.toggle("on", L.log[i].star); b.textContent = L.log[i].star ? "★" : "☆"; }; });
    renderSide(true); $("#legend").innerHTML = legend(); $("#fict").textContent = t("fictional");
    if (L.pending) showPending(); else { const last = [...L.log].reverse().find(e => !e.quiet) || L.log[L.log.length - 1]; if (last) setStage(last); }
  }
  document.addEventListener("DOMContentLoaded", init);
})();

</script>
</body></html>
